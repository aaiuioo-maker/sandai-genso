<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="三大元素">
<title>三大元素といのち</title>
<link rel="apple-touch-icon" id="appleIcon" href="">
<link rel="icon" id="favIcon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root { --bg:#05040d; --fg:#f3ead6; --accent:#d97757; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font-family: "DotGothic16", sans-serif; display: flex; flex-direction: column; align-items: center;
         padding: calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); min-height: 100vh; }
  h1 { font-size: 18px; font-weight: 400; margin: 0 0 4px; letter-spacing: .08em; }
  .sub { font-size: 11px; opacity: .6; margin: 0 0 10px; }
  .stage { width: 100%; max-width: 480px; position: relative; }
  canvas { width: 100%; display: block; image-rendering: pixelated; border: 2px solid #2a2540; border-radius: 6px; background: #000; }
  .bar { height: 6px; background: #1c1930; border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); }
  .ctrl { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
  button { font-family: inherit; font-size: 15px; color: var(--fg); background: #1c1930; border: 2px solid var(--accent);
           border-radius: 6px; padding: 8px 18px; cursor: pointer; }
  button:active { transform: translateY(1px); }
  .start { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .start button { font-size: 18px; padding: 12px 26px; background: rgba(28,25,48,.9); }
  .hide { display: none !important; }
</style>
</head>
<body>
<h1>三大元素と いのち</h1>
<p class="sub">火素・水素・土素 ／ 約15秒のドット絵</p>
<div class="stage">
  <canvas id="cv"></canvas>
  <div class="start" id="startBox"><button id="startBtn">▶ 再生する</button></div>
</div>
<div class="stage"><div class="bar"><i id="barFill"></i></div></div>
<div class="ctrl"><button id="replay" class="hide">↻ もう一度見る</button></div>

<script>
const W = 180, H = 260, S = 3, SH = 216, DUR = 15;
const cv = document.getElementById('cv');
cv.width = W * S; cv.height = H * S;
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

// ---------- 描画の道具 ----------
const rd = Math.round;
function R(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(rd(x) * S, rd(y) * S, rd(w) * S, rd(h) * S); }
function P(x, y, c, s = 1) { R(x, y, s, s, c); }
function disc(cx, cy, r, c) {
  for (let y = -r; y <= r; y++) { const w = Math.floor(Math.sqrt(r * r - y * y) + 0.3); R(cx - w, cy + y, w * 2 + 1, 1, c); }
}
function T(s, x, y, size, c, align = 'center', a = 1) {
  ctx.globalAlpha = a;
  ctx.font = `${size * S}px "DotGothic16", monospace`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineWidth = S * 1.4; ctx.lineJoin = 'round'; ctx.strokeStyle = '#000';
  ctx.strokeText(s, x * S, y * S);
  ctx.fillStyle = c; ctx.fillText(s, x * S, y * S);
  ctx.globalAlpha = 1;
}
function A(a, fn) { ctx.globalAlpha = Math.max(0, Math.min(1, a)); fn(); ctx.globalAlpha = 1; }
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const fadeIn = (lt, st, d = 0.3) => clamp((lt - st) / d);
const ease = k => k * k * (3 - 2 * k);
function mix(c1, c2, k) {
  const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
  const ch = s => rd(lerp((a >> s) & 255, (b >> s) & 255, k));
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}
// 小さなタグ（ラベル）
function tag(s, x, y, c, a = 1, size = 8) { T(s, x, y, size, c, 'center', a); }

// ---------- 星 ----------
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const stars = [...Array(70)].map(() => ({ x: rnd() * W | 0, y: rnd() * SH | 0, p: rnd() * 6.28, s: rnd() < .15 ? 2 : 1 }));
function drawStars(t, a = 1) {
  for (const s of stars) { const b = .5 + .5 * Math.sin(t * 3 + s.p); ctx.globalAlpha = a * (.25 + .75 * b); P(s.x, s.y, '#fff', s.s); }
  ctx.globalAlpha = 1;
}

// ---------- 太陽・月・地球 ----------
function sun(cx, cy, t, r = 13) {
  A(.25 + .1 * Math.sin(t * 6), () => disc(cx, cy, r + 5, '#ff7a2e'));
  disc(cx, cy, r, '#ffb02e'); disc(cx - 1, cy - 1, r - 4, '#ffd84a'); disc(cx - 3, cy - 3, 2, '#fff6c0');
  for (let i = 0; i < 8; i++) {
    const an = i * Math.PI / 4 + t * .6, L = r + 7 + (Math.sin(t * 8 + i) > 0 ? 2 : 0);
    P(cx + Math.cos(an) * L, cy + Math.sin(an) * L, '#ffd84a', 2);
  }
}
function moon(cx, cy, r, bg) { disc(cx, cy, r, '#efe9c9'); disc(cx + 5, cy - 3, r - 1, bg); }
function earth() {
  disc(90, 300, 100, '#4a9a3a'); disc(90, 302, 99, '#7a5230');
  [[62, 214, '#5e3e22'], [104, 208, '#5e3e22'], [80, 210, '#9a6a3c'], [120, 213, '#9a6a3c']].forEach(([x, y, c]) => R(x, y, 3, 2, c));
}
function ground(c = '#5a3d24') { R(0, 202, W, 14, c); R(0, 202, W, 2, '#3f8f3a'); for (let x = 3; x < W; x += 11) P(x, 207 + (x % 3), '#6b4a2c', 2); }

// ---------- 人の体 ----------
function bodyShape(dx, dy, c) {
  disc(90 + dx, 62 + dy, 10, c);
  R(86 + dx, 71 + dy, 9, 6, c);
  R(72 + dx, 76 + dy, 37, 2, c); R(70 + dx, 78 + dy, 41, 72, c);
  R(62 + dx, 80 + dy, 8, 46, c); R(111 + dx, 80 + dy, 8, 46, c);
  disc(66 + dx, 129 + dy, 4, c); disc(115 + dx, 129 + dy, 4, c);
  R(74 + dx, 150 + dy, 13, 48, c); R(94 + dx, 150 + dy, 13, 48, c);
  R(72 + dx, 197 + dy, 15, 5, c); R(94 + dx, 197 + dy, 15, 5, c);
}
function drawBody(fill = '#2c2f52', line = '#9a90d0', a = 1) {
  A(a, () => {
    [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(([x, y]) => bodyShape(x, y, line));
    bodyShape(0, 0, fill);
    R(85, 60, 2, 2, '#f3ead6'); R(94, 60, 2, 2, '#f3ead6'); R(88, 67, 5, 1, '#f3ead6');
  });
}
const HEART = ['.XX...XX.', 'XXXX.XXXX', 'XXXXXXXXX', 'XXXXXXXXX', '.XXXXXXX.', '..XXXXX..', '...XXX...', '....X....'];
function heart(beat, col = '#ff3b4e', a = 1) {
  A(a, () => {
    if (beat > .05) A(a * beat * .5, () => disc(90, 96, 9, '#ff6a5a'));
    HEART.forEach((row, y) => [...row].forEach((ch, x) => { if (ch === 'X') P(86 + x, 92 + y, col); }));
    P(87, 93, '#ffb0b0'); P(88, 93, '#ffb0b0');
  });
}
function lungs(b, a = 1, col = '#3d8bff') {
  A(a, () => {
    R(74 - b, 86, 11 + b, 26, col); R(75 - b, 85, 9 + b, 1, col); R(74 - b, 86, 2, 3, '#2c2f52');
    R(95, 86, 11 + b, 26, col); R(96, 85, 9 + b, 1, col); R(104 + b, 86, 2, 3, '#2c2f52');
    R(76 - b, 88, 3, 18, '#7dc0ff'); R(97, 88, 3, 18, '#7dc0ff');
  });
}
function stomach(a = 1, glow = 0) {
  A(a, () => {
    if (glow) A(a * glow * .4, () => disc(90, 121, 9, '#ffcf6a'));
    R(82, 116, 16, 10, '#d9973a'); R(80, 118, 2, 6, '#d9973a'); R(98, 117, 2, 6, '#d9973a'); R(83, 117, 6, 2, '#f2c17a');
  });
}

// ---------- Claude Code のキャラクター（字幕の左にいる案内役） ----------
function mascot(ox, oy, t, mode = 'walk') {
  const p = 1, c = '#d97757', f = Math.floor(t * 6) % 4;
  const hop = mode === 'jump' ? -Math.abs(Math.sin(t * 7)) * 4 : (f % 2 ? -1 : 0);
  const up = [f === 1, f === 3, f === 3, f === 1];
  [2, 4, 7, 9].forEach((x, i) => R(ox + x * p, oy + 6 * p, p, (up[i] && mode === 'walk' ? 1 : 2) * p, c));
  const y0 = oy + hop;
  R(ox + 2 * p, y0, 8 * p, 6 * p, c);
  const wave = mode === 'talk' && Math.sin(t * 10) > 0 ? -1 : 0;
  R(ox, y0 + 2 * p + wave, 2 * p, 2 * p, c); R(ox + 10 * p, y0 + 2 * p - wave, 2 * p, 2 * p, c);
  const blink = (t % 3) > 2.85;
  R(ox + 3 * p, y0 + p + (blink ? .6 : 0), p, blink ? .4 : p, '#1a1612'); R(ox + 8 * p, y0 + p + (blink ? .6 : 0), p, blink ? .4 : p, '#1a1612');
}

// ---------- 字幕 ----------
const CAPS = [
  [0.0, 0.9, '宇宙は 三つの元素で', 'できている'],
  [0.9, 1.8, '火素（霊気）', '太陽から タテ（経）に働く'],
  [1.8, 2.7, '水素（空気）', '月から ヨコ（緯）に流れる'],
  [2.7, 3.5, '土素（物質）', '地球そのもの・見える物質'],
  [3.5, 4.3, '人間は 小宇宙', '三つを吸収する機関がある'],
  [4.3, 5.2, '心臓', '鼓動で 霊界の火素を吸収'],
  [5.2, 6.1, '肺臓', '呼吸で 空気界の水素を吸収'],
  [6.1, 7.0, '胃', '飲食で 土素（食物）を吸収'],
  [7.0, 8.0, '発熱は 浄化作用', ''],
  [8.0, 9.0, '鼓動を早めて', '火素を 多く吸収し'],
  [9.0, 10.0, 'その熱で', '凝結毒素を 溶かす'],
  [10.0, 11.0, '死ぬと 三つの元素が', 'それぞれへ 還る'],
  [11.0, 12.0, '火素（精霊）は霊界へ', '水素は 空気界へ'],
  [12.0, 13.0, '肉体は 土素として', '土へ 還る'],
  [13.0, 15.1, '見えるものと 見えないもの', '結びついて いのちとなる'],
];
const CAP_COL = { 火: '#ffb04a', 水: '#7dc8ff', 土: '#d9a35a' };
function captions(t) {
  R(0, SH, W, H - SH, '#0d0b18'); R(0, SH, W, 1, '#3a3358');
  const c = CAPS.find(c => t >= c[0] && t < c[1]); if (!c) return;
  const a = clamp((t - c[0]) / .15);
  let col = '#f3ead6';
  for (const k in CAP_COL) if (c[2].startsWith(k) || c[2].startsWith(k === '火' ? '心' : k === '水' ? '肺' : '胃')) col = CAP_COL[k];
  T(c[2], 104, c[3] ? 229 : 237, 9, col, 'center', a);
  if (c[3]) T(c[3], 104, 246, 8.5, '#f3ead6', 'center', a);
}

// ---------- 場面1：宇宙の三大元素 ----------
function scene1(lt, t) {
  const bg = '#0b0a1a'; R(0, 0, W, SH, bg); drawStars(t);
  // 火素：太陽からタテに
  const fa = fadeIn(lt, .7);
  const lanesX = [66, 78, 90, 102, 114], lanesY = [90, 104, 118];
  if (fa > 0) A(fa, () => lanesX.forEach((x, li) => {
    for (let k = 0; k < 6; k++) {
      const ph = (lt * .9 + k / 6 + li * .37) % 1, y = 50 + ph * 148;
      R(x, y, 1, 4, '#ff7a2e'); P(x, y + 4, '#ffe07a');
    }
  }));
  // 水素：月からヨコに
  const wa = fadeIn(lt, 1.6);
  if (wa > 0) A(wa, () => lanesY.forEach((ly, li) => {
    for (let k = 0; k < 8; k++) {
      const ph = (lt * .55 + k / 8 + li * .13) % 1, x = 38 + ph * 145;
      P(x, ly + rd(Math.sin(x / 7 + lt * 5) * 2), k % 2 ? '#6cc4ff' : '#bfe6ff', 2);
    }
  }));
  // 経と緯が交わるところ
  const ca = fadeIn(lt, 2.2) * (.6 + .4 * Math.sin(t * 8));
  if (ca > 0) A(ca, () => lanesX.forEach(x => lanesY.forEach(y => { P(x - 1, y, '#fff'); P(x + 1, y, '#fff'); P(x, y - 1, '#fff'); P(x, y + 1, '#fff'); P(x, y, '#fff7d0'); })));
  sun(90, 34, t);
  moon(24, 104, 10, bg);
  earth();
  tag('太陽＝火素', 132, 22, '#ffb04a', fadeIn(lt, .9));
  tag('経（タテ）', 140, 166, '#ffb04a', fadeIn(lt, 1.1) * .9, 7);
  tag('月＝水素', 26, 124, '#7dc8ff', fadeIn(lt, 1.8));
  tag('緯（ヨコ）', 150, 76, '#7dc8ff', fadeIn(lt, 2.0) * .9, 7);
  tag('地球＝土素', 90, 209, '#f3d9a0', fadeIn(lt, 2.7));
}

// ---------- 場面2：人体は小宇宙 ----------
function room(t, a = .5) { R(0, 0, W, SH, '#0f1028'); drawStars(t, a); ground(); }
function flowFire(lt, n, sp, a = 1, tx = 90, ty = 96) {
  A(a, () => { for (let k = 0; k < n; k++) {
    const ph = (lt * sp + k / n) % 1, sx = 90 + ((k * 37) % 44 - 22);
    const x = lerp(sx, tx, ease(ph)), y = lerp(-4, ty, ph);
    R(x, y - 3, 1, 3, '#ff7a2e'); P(x, y, '#ffe07a', 2);
  } });
}
function flowWater(lt, a = 1) {
  A(a, () => { for (let k = 0; k < 10; k++) {
    const ph = (lt * .7 + k / 10) % 1, side = k % 2;
    const x = side ? lerp(184, 100, ph) : lerp(-4, 80, ph);
    P(x, 98 + rd(Math.sin(ph * 12 + k) * 4), k % 3 ? '#6cc4ff' : '#bfe6ff', 2);
  } });
}
function flowFood(lt, a = 1) {
  const cols = ['#c98a3a', '#6fbf4a', '#e8d27a', '#d9572e'];
  A(a, () => { for (let k = 0; k < 5; k++) {
    const ph = (lt * .6 + k / 5) % 1; let x, y;
    if (ph < .5) { x = lerp(150, 90, ph * 2); y = lerp(56, 67, ph * 2); } else { x = 89; y = lerp(67, 120, (ph - .5) * 2); }
    P(x, y, cols[k % 4], 2);
  } });
}
function scene2(lt, t) {
  room(t);
  const focus = lt < .8 ? 0 : lt < 1.7 ? 1 : lt < 2.6 ? 2 : 3;
  const breath = rd(1 + Math.sin(lt * 4));
  const beat = Math.pow(Math.max(0, Math.sin(lt * Math.PI * 2.6)), 8);
  drawBody();
  if (focus >= 2) A(.35, () => R(89, 72, 2, 44, '#e8b070'));
  lungs(breath, focus === 2 ? 1 : .75);
  stomach(focus === 3 ? 1 : .75, focus === 3 ? .6 + .4 * Math.sin(t * 8) : 0);
  heart(beat, '#ff3b4e', focus === 1 ? 1 : .8);
  flowFire(lt, 8, .8, focus === 1 ? 1 : .45);
  flowWater(lt, focus === 2 ? 1 : .45);
  flowFood(lt, focus === 3 ? 1 : .45);
  tag('人体＝小宇宙', 90, 38, '#f3ead6', fadeIn(lt, .1) * (focus === 0 ? 1 : .5));
  tag('心臓', 146, 92, '#ffb04a', fadeIn(lt, .8) * (focus === 1 ? 1 : .55));
  tag('←火素', 146, 103, '#ffb04a', fadeIn(lt, .8) * (focus === 1 ? 1 : .55), 7);
  tag('肺臓', 33, 82, '#7dc8ff', fadeIn(lt, 1.7) * (focus === 2 ? 1 : .55));
  tag('水素→', 33, 112, '#7dc8ff', fadeIn(lt, 1.7) * (focus === 2 ? 1 : .55), 7);
  tag('胃', 146, 121, '#d9a35a', fadeIn(lt, 2.6) * (focus === 3 ? 1 : .55));
  tag('土素（食物）', 150, 48, '#d9a35a', fadeIn(lt, 2.6) * (focus === 3 ? 1 : .55), 7);
}

// ---------- 場面3：発熱は浄化作用 ----------
function scene3(lt, t) {
  room(t, .35);
  const heat = clamp(lt / 1.2);
  A(heat * (.25 + .1 * Math.sin(t * 9)), () => R(0, 0, W, 202, '#4a0e12'));
  const shake = lt > 1 ? (Math.floor(t * 30) % 2 ? 1 : 0) * .5 : 0;
  drawBody(mix('#2c2f52', '#5a2436', heat), mix('#9a90d0', '#ff8a6a', heat));
  lungs(rd(1 + Math.sin(lt * 6)), .7);
  stomach(.7);
  // 凝結毒素
  const tox = lt < 1.9 ? 7 : rd(lerp(7, 0, clamp((lt - 1.9) / 1)));
  if (tox > 0) {
    disc(82, 142, tox, '#4a1d5e'); disc(81, 141, Math.max(0, tox - 3), '#6d2f86');
    if (lt > 1.9) for (let k = 0; k < 4; k++) { const ph = (lt * 1.5 + k / 4) % 1; P(78 + k * 3, 144 + ph * 14, '#9b5ab8'); }
  } else {
    A(1 - clamp((lt - 2.9) / .3) + .3, () => { for (let k = 0; k < 6; k++) P(76 + k * 2, 140 + (k % 2), '#ffe07a'); });
  }
  const bpm = lt < .8 ? 1.3 : 3.2;
  const beat = Math.pow(Math.max(0, Math.sin(lt * Math.PI * bpm)), 6);
  ctx.save(); ctx.translate(shake * S, 0); heart(beat, '#ff2a3e'); ctx.restore();
  flowFire(lt, lt < .8 ? 8 : 16, lt < .8 ? .8 : 1.6, .9);
  // 心臓から毒素へ火素を送る
  if (lt > 1) for (let k = 0; k < 6; k++) {
    const ph = (lt * 1.4 + k / 6) % 1;
    P(lerp(90, 82, ph), lerp(100, 140, ph), k % 2 ? '#ff7a2e' : '#ffe07a', 2);
  }
  // 頭のまわりの熱気と汗
  for (let k = 0; k < 4; k++) { const ph = (lt * .9 + k / 4) % 1; A(heat * (1 - ph), () => P(76 + k * 9, 48 - ph * 16, '#ff8a5a', 2)); }
  if (lt > 1.6) for (let k = 0; k < 2; k++) { const ph = (lt * 1.1 + k / 2) % 1; P(k ? 101 : 79, 60 + ph * 10, '#9fd8ff', 2); }
  // 体温計
  const temp = lerp(36.5, 39.2, ease(heat)) - (lt > 2.6 ? clamp((lt - 2.6) / .4) * 1.5 : 0);
  R(149, 66, 7, 74, '#e8e8f0'); R(151, 68, 3, 70, '#333');
  const lv = (temp - 35) / 5 * 66; R(151, 138 - lv, 3, lv, '#ff3b4e');
  disc(152, 144, 5, '#e8e8f0'); disc(152, 144, 3, '#ff3b4e');
  tag(temp.toFixed(1) + '℃', 152, 156, '#ffb0a0', 1, 8);
  tag('凝結毒素', 34, 142, '#c49ae0', fadeIn(lt, .2) * (tox > 0 ? 1 : .3));
  if (tox === 0) tag('溶けた！', 34, 154, '#ffe07a', fadeIn(lt, 2.9));
  tag('ドクドクドク', 132, 30, '#ff8a8a', lt > 1 ? .7 + .3 * Math.sin(t * 20) : 0, 7);
}

// ---------- 場面4：死と三元素の帰還 ----------
function scene4(lt, t) {
  R(0, 0, W, SH, '#0b0a1a'); drawStars(t, .6);
  // 霊界の光
  A(.2 + .1 * Math.sin(t * 3), () => { R(0, 0, W, 10, '#fff1b0'); R(0, 10, W, 6, '#a88a40'); });
  ground();
  const gone = clamp((lt - 1.6) / 1.2);
  const grey = clamp(lt / .8);
  drawBody(mix('#2c2f52', '#3a3a40', grey), mix('#9a90d0', '#6a6a70', grey), 1 - gone);
  lungs(0, (1 - clamp(lt / 1.6)) * (1 - gone), '#3d8bff');
  stomach((1 - gone) * .6);
  heart(0, mix('#ff3b4e', '#6a3a40', grey), 1 - gone);
  // 火素は上へ（霊界）
  for (let k = 0; k < 18; k++) {
    const ph = clamp((lt - .2 - k * .09) / 1.2); if (ph <= 0 || ph >= 1) continue;
    const x = 90 + Math.sin(ph * 9 + k) * (6 + k), y = lerp(96, -2, ease(ph));
    A(1 - ph * .4, () => { P(x, y, "#ffe07a", 2); R(x, y + 2, 2, 3, "#ff7a2e"); });
  }
  // 水素は横へ（空気界）
  for (let k = 0; k < 10; k++) {
    const ph = clamp((lt - .4 - (k >> 1) * .15) / 1.3); if (ph <= 0 || ph >= 1) continue;
    const side = k % 2, x = side ? lerp(100, 186, ph) : lerp(80, -6, ph);
    P(x, 98 + Math.sin(ph * 10 + k) * 5 + (k >> 1) * 3 - 6, '#6cc4ff', 2);
  }
  // 土素は下へ（土）
  if (lt > 1.6) for (let k = 0; k < 14; k++) {
    const ph = (lt * 1.2 + k / 14) % 1; if (lt > 2.7 && ph < .3) continue;
    P(72 + (k * 23) % 38, lerp(70 + (k * 13) % 110, 200, ph), k % 2 ? '#7a5230' : '#9a6a3c', 2);
  }
  const mound = rd(lerp(0, 9, gone));

let start = 0, running = false;
const bar = document.getElementById('barFill'), replay = document.getElementById('replay');
function loop(now) {
  const t = Math.min(DUR, (now - start) / 1000);
  frame(t);
  bar.style.width = (t / DUR * 100) + '%';
  if (t < DUR) requestAnimationFrame(loop);

}

}
