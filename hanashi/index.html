<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="話し方道場">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05040d">
<link rel="apple-touch-icon" href="icon-180.png?v=1">
<link rel="icon" href="icon-180.png?v=1">
<link rel="manifest" href="hanashi.webmanifest?v=1">
<title>まいにち話し方道場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root { --bg:#05040d; --panel:#141026; --fg:#f3ead6; --dim:#a9a3c2; --accent:#d97757; --gold:#f0c070; --line:#2e2750; --ok:#6fe0a0; --rec:#ff6b6b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { font-family: "DotGothic16", sans-serif; line-height: 1.6; padding: calc(10px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); }
  .wrap { width: 100%; max-width: 440px; margin: 0 auto; }
  h1 { font-size: 19px; font-weight: 400; margin: 0 0 8px; letter-spacing: .08em; position: relative; text-align: center; padding: 2px 30px; }
  #ccTitle { position: absolute; left: 0; top: 50%; transform: translateY(-58%); width: 24px; height: 26px; image-rendering: pixelated; }
  h2 { font-size: 17px; font-weight: 400; color: var(--gold); margin: 0 0 6px; }
  h3 { font-size: 14px; font-weight: 400; color: var(--dim); margin: 18px 0 6px; }
  p { margin: 0 0 10px; }
  section[hidden], [hidden] { display: none !important; }
  button { font: inherit; color: var(--fg); background: #1c1930; border: 2px solid #3a3358; border-radius: 8px; padding: 10px 12px; min-height: 44px; cursor: pointer; touch-action: manipulation; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  button:disabled { opacity: .45; cursor: default; }
  .main { display: block; width: 100%; background: var(--accent); border-color: #ffb08f; color: #1a0f0a; font-size: 17px; padding: 13px; margin-top: 10px; }
  .sub { display: block; width: 100%; margin-top: 8px; }
  .row { display: flex; gap: 8px; } .row > button { flex: 1; min-width: 0; }
  .panel { background: var(--panel); border: 2px solid var(--line); border-radius: 10px; padding: 13px; margin-bottom: 10px; }
  .small { font-size: 13px; color: var(--dim); }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 12px; font-size: 11px; text-align: center; color: var(--dim); }
  .steps span { border-top: 4px solid var(--line); padding-top: 3px; white-space: nowrap; }
  .steps span.on { border-color: var(--accent); color: var(--fg); } .steps span.done { border-color: var(--ok); }
  .hero { display: flex; align-items: center; gap: 14px; }
  #charCv { width: 96px; height: 96px; image-rendering: pixelated; flex-shrink: 0; }
  .big { font-size: 28px; color: var(--gold); line-height: 1.15; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal b, .cal i { font-style: normal; font-weight: 400; text-align: center; font-size: 12px; }
  .cal b { color: var(--dim); }
  .cal i { background: #1c1930; border-radius: 4px; padding: 4px 0; color: #77718f; border: 1px solid transparent; }
  .cal i.on { background: var(--accent); color: #1a0f0a; } .cal i.today { border-color: var(--gold); } .cal i.fut { opacity: .3; }
  .line { font-size: 19px; line-height: 1.8; min-height: 104px; }
  .topic { font-size: 20px; color: #ffe1b5; line-height: 1.5; }
  .prep { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; font-size: 14px; margin: 8px 0 0; }
  .prep b { font-weight: 400; color: var(--accent); }
  .time { font-size: 50px; text-align: center; line-height: 1.1; color: var(--fg); font-variant-numeric: tabular-nums; }
  .time.live { color: var(--rec); }
  #meter { display: block; width: 100%; height: 14px; background: #1c1930; border-radius: 4px; margin: 8px 0 2px; image-rendering: pixelated; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .stat { background: #1c1930; border-radius: 6px; padding: 7px 9px; }
  .stat small { display: block; font-size: 12px; color: var(--dim); } .stat span { font-size: 19px; color: var(--gold); }
  .goals { display: grid; gap: 6px; }
  .goals button { text-align: left; padding: 8px 11px; }
  .goals button[aria-pressed="true"] { border-color: var(--ok); background: #123026; }
  .goals small { display: block; color: var(--dim); font-size: 12px; }
  .warn { color: #ffb4a0; font-size: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 5px 4px; border-bottom: 1px solid var(--line); font-weight: 400; text-align: right; }
  th:first-child, td:first-child { text-align: left; color: var(--dim); }
  .hist { border-top: 1px solid var(--line); padding: 8px 0; font-size: 14px; }
  .hist .row button { padding: 5px 8px; min-height: 38px; font-size: 13px; }
  label.opt { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
  label.opt input { width: 20px; height: 20px; margin: 2px 0 0; flex-shrink: 0; accent-color: var(--accent); }
  select { font: inherit; color: var(--fg); background: #1c1930; border: 2px solid #3a3358; border-radius: 8px; padding: 8px; width: 100%; min-height: 44px; }
  a { color: var(--gold); }
  .foot { text-align: center; font-size: 13px; margin-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1><canvas id="ccTitle" width="48" height="52" aria-hidden="true"></canvas>まいにち話し方道場</h1>
  <div class="steps" id="steps" hidden><span>① まねる</span><span>② 話す</span><span>③ 聞く</span><span>④ もう一度</span></div>

  <section id="home">
    <div class="panel hero">
      <canvas id="charCv" width="96" height="96" aria-hidden="true"></canvas>
      <div><div class="small" id="rank"></div><div class="big" id="streak"></div><div class="small" id="total"></div></div>
    </div>
    <div class="panel">
      <h2>きょうのお題</h2>
      <p class="topic" id="homeTopic"></p>
      <p class="small" style="margin:0">まねる → 話す → 聞く → もう一度。5分くらいです。</p>
      <button class="main" id="startBtn">きょうの練習をはじめる</button>
    </div>
    <div class="panel"><h2 id="calTitle">練習した日</h2><div class="cal" id="cal"></div></div>
    <div class="panel">
      <h2>設定</h2>
      <label class="small" for="voiceSel">お手本の声</label>
      <select id="voiceSel"></select>
      <div id="srBox" hidden style="margin-top:10px">
        <label class="opt"><input type="checkbox" id="srOn"><span>話す速さと「えーと」の回数も数える<br><span class="small">オンにすると、文字にするために声がブラウザの会社（Chrome なら Google）へ送られます。回数はだいたいの目安です。</span></span></label>
      </div>
      <p class="small" style="margin:10px 0 0">録音はこの端末の中だけに保存します（新しい30日ぶん）。</p>
    </div>
    <div class="panel" id="histPanel" hidden><h2>前の自分と聞きくらべ</h2><div id="hist"></div></div>
    <p class="foot"><a href="../tana/">◀ 動画棚へ</a></p>
  </section>

  <section id="shadow" hidden>
    <div class="panel">
      <h2>① まねして読む <span class="small" id="lineNum"></span></h2>
      <p class="small">声を聞いたら、同じ速さ・同じ間で、声に出して読みましょう。</p>
      <p class="line" id="lineText"></p>
      <p class="small" id="lineWho" style="margin:0"></p>
    </div>
    <div class="row"><button id="hearBtn">▶ お手本を聞く</button><button id="nextLine">つぎの文へ</button></div>
    <button class="sub" id="skipShadow">とばして「話す」へ</button>
    <button class="sub" data-home>やめる</button>
  </section>

  <section id="speak" hidden>
    <div class="panel">
      <h2 id="spTitle"></h2>
      <p class="topic" id="spTopic"></p>
      <div class="prep" id="prep"><b>1</b><span>言いたいこと（ひとことで）</span><b>2</b><span>そのわけ</span><b>3</b><span>たとえば（あった話）</span><b>4</b><span>もう一度、言いたいこと</span></div>
      <p id="spGoal" style="margin:8px 0 0;color:var(--ok)" hidden></p>
    </div>
    <div class="panel">
      <div class="time" id="time" role="timer">1:00</div>
      <canvas id="meter" width="120" height="7" aria-hidden="true"></canvas>
      <p class="warn" id="micMsg" hidden style="margin:6px 0 0"></p>
      <button class="main" id="recBtn">● 録音をはじめる</button>
      <button class="sub" id="noMicBtn" hidden>録音なしで話す（タイマーだけ）</button>
    </div>
    <button class="sub" id="newTopic">別のお題にする</button>
    <button class="sub" data-home>やめる</button>
  </section>

  <section id="review" hidden>
    <div class="panel">
      <h2>③ 録音を聞く</h2>
      <p class="warn" id="revWarn" hidden></p>
      <button class="main" id="playA">▶ 自分の話を聞く</button>
      <div class="stats" id="statsA" style="margin-top:10px"></div>
    </div>
    <div class="panel">
      <h2>つぎに直すことを 1つだけ</h2>
      <div class="goals" id="goals"></div>
    </div>
    <button class="main" id="toRetry">④ もう一度 話す</button>
    <button class="sub" id="redoA">1回目を やり直す</button>
    <button class="sub" data-home>やめる</button>
  </section>

  <section id="done" hidden>
    <div class="panel" style="text-align:center">
      <h2>きょうの練習、おしまい</h2>
      <div class="big" id="doneStreak"></div>
      <p class="small" id="doneRank" style="margin:4px 0 0"></p>
    </div>
    <div class="panel">
      <h3 style="margin-top:0">聞きくらべ</h3>
      <div class="row"><button id="playDoneA">▶ 1回目</button><button id="playDoneB">▶ 2回目</button></div>
      <div id="cmp" style="margin-top:10px"></div>
      <p class="small" id="doneGoal" style="margin:10px 0 0"></p>
    </div>
    <button class="main" data-home>ホームへ</button>
  </section>
</div>

<script>
// ---------- お手本の文（今までの動画の字幕と、その声）：[フォルダ, 動画の名前, [[字幕の番号, 読む文], ...]] ----------

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dayNum = d => Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5);
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);

// ---------- 記録（数字は localStorage、録音は IndexedDB。使えないときは、開いている間だけ覚える） ----------
const STORE = 'hanashi.v1';
let data = { days: {}, voice: 'mix', sr: false };
try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && s.days) data = Object.assign(data, s); } catch (e) {}
const saveData = () => { try { localStorage.setItem(STORE, JSON.stringify(data)); } catch (e) {} };
const memRec = {};
function db() {
  return new Promise((ok, ng) => {
    try {
      const r = indexedDB.open('hanashi', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('rec');
      r.onsuccess = () => ok(r.result); r.onerror = () => ng(r.error);
    } catch (e) { ng(e); }
  });
}
async function putRec(k, blob) {
  memRec[k] = blob;
  try { const d = await db(); await new Promise((ok, ng) => { const t = d.transaction('rec', 'readwrite'); t.objectStore('rec').put(blob, k); t.oncomplete = ok; t.onerror = () => ng(t.error); }); d.close(); } catch (e) {}
}
async function getRec(k) {
  if (memRec[k]) return memRec[k];
  try { const d = await db(); const b = await new Promise((ok, ng) => { const q = d.transaction('rec').objectStore('rec').get(k); q.onsuccess = () => ok(q.result); q.onerror = () => ng(q.error); }); d.close(); return b || null; } catch (e) { return null; }
}
async function pruneRec() {
  const limit = keyOf(addDays(new Date(), -KEEP_DAYS));
  try {
    const d = await db(), t = d.transaction('rec', 'readwrite'), s = t.objectStore('rec'), q = s.getAllKeys();
    q.onsuccess = () => q.result.forEach(k => { if (String(k).slice(0, 10) < limit) s.delete(k); });
    t.oncomplete = () => d.close();
  } catch (e) {}
}

// ---------- 再生（同時に1つだけ） ----------
let player = null, playerBtn = null, playerLabel = '', playerUrl = null;
function stopPlay() {
  if (player) { player.onended = player.onerror = null; player.pause(); player = null; }
  if (playerBtn) { playerBtn.textContent = playerLabel; playerBtn = null; }
  if (playerUrl) { URL.revokeObjectURL(playerUrl); playerUrl = null; }
}
function playSrc(src, btn, onEnd, onFail) {
  const same = playerBtn === btn;
  stopPlay();
  if (same) return;
  playerBtn = btn; playerLabel = btn.textContent; btn.textContent = '■ 止める';
  if (src instanceof Blob) { playerUrl = URL.createObjectURL(src); src = playerUrl; }
  const a = player = new Audio(src);
  const fail = () => { if (player !== a) return; stopPlay(); if (onFail) onFail(); };
  a.onended = () => { if (player !== a) return; stopPlay(); if (onEnd) onEnd(); };
  a.onerror = fail;
  const p = a.play(); if (p) p.catch(fail);
}

function streakNow() {
  let d = today(), n = 0;
  if (!data.days[keyOf(d)]) d = addDays(d, -1);
  while (data.days[keyOf(d)]) { n++; d = addDays(d, -1); }
  return n;
}
const totalDays = () => Object.keys(data.days).length;
const rankIdx = n => RANKS.reduce((a, r, i) => n >= r[0] ? i : a, 0);

// ---------- ②④ 話す（録音・声の分析はこの端末の中でする） ----------
let R = null;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const mobile = /Android|iPhone|iPad|iPod/.test(navigator.userAgent) || navigator.maxTouchPoints > 1;
const canSR = !!SR && !mobile; // スマホはマイクの取り合いになるので使わない
const FILLER = /えーっと|えっと|えーと|えと|あのー|あの〜|そのー|えー|あー|まあ|なんか/g;

function toSpeak(round) {
  stopPlay(); S.round = round;
  $('spTitle').textContent = round === 'a' ? '② 1分スピーチ' : '④ もう一度 話す';
  $('spTopic').textContent = S.topic;
  $('prep').hidden = round === 'b';
  $('spGoal').hidden = round === 'a';
  if (round === 'b') $('spGoal').textContent = '直すこと：' + GOALS.find(g => g[0] === S.goal)[1];
  $('newTopic').hidden = round === 'b';
  $('time').textContent = clock(LIMIT); $('time').classList.remove('live');
  $('micMsg').hidden = true; $('noMicBtn').hidden = true;
  $('recBtn').textContent = '● 録音をはじめる'; $('recBtn').disabled = false;
  drawMeter(0);
  show('speak', round === 'a' ? 2 : 4);
}
$('newTopic').onclick = () => { S.off++; S.topic = topicOf(S.off); $('spTopic').textContent = S.topic; };

function drawMeter(v) {
  const c = $('meter'), x = c.getContext('2d'); x.clearRect(0, 0, c.width, c.height);
  const n = Math.round(Math.min(1, v) * 30);
  for (let i = 0; i < n; i++) { x.fillStyle = i > 25 ? '#ff6b6b' : i > 18 ? '#f0c070' : '#6fe0a0'; x.fillRect(i * 4, 1, 3, 5); }
}
function analyze(s) {
  if (s.length < 10) return { silent: true };
  const v = s.map(x => x[1]).sort((a, b) => a - b), floor = v[Math.floor(v.length * .1)], peak = v[Math.floor(v.length * .95)];
  if (peak < .006) return { silent: true };
  const thr = Math.max(.004, floor + (peak - floor) * .18);
  let segs = [], cur = null;
  s.forEach(([t, r]) => { if (r >= thr) { if (cur) cur.e = t; else cur = { s: t, e: t }; } else if (cur) { segs.push(cur); cur = null; } });
  if (cur) segs.push(cur);
  const merged = [];
  segs.forEach(g => { const l = merged[merged.length - 1]; if (l && g.s - l.e < .18) l.e = g.e; else merged.push({ ...g }); });
  segs = merged.filter(g => g.e - g.s >= .08);
  if (!segs.length) return { silent: true };
  const gaps = segs.slice(1).map((g, i) => g.s - segs[i].e);
  return { sec: Math.max(1, Math.round(segs[segs.length - 1].e - segs[0].s)), pauses: gaps.filter(g => g >= .35).length,
    longest: Math.round((gaps.length ? Math.max(...gaps) : 0) * 10) / 10 };
}
async function startRec() {
  $('recBtn').disabled = true; $('micMsg').hidden = true;
  let stream;
  try {
    if (!navigator.mediaDevices || !window.MediaRecorder) throw new Error('none');
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch (e) {
    $('micMsg').textContent = e && e.name === 'NotAllowedError' ? 'マイクが許可されていません。ブラウザの設定で許可すると録音できます。' : 'マイクが使えませんでした。';
    $('micMsg').hidden = false; $('noMicBtn').hidden = false; $('recBtn').disabled = false; return;
  }
  if (!S || $('speak').hidden) { stream.getTracks().forEach(t => t.stop()); return; }
  const type = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm'].find(t => MediaRecorder.isTypeSupported(t));
  const mr = new MediaRecorder(stream, type ? { mimeType: type } : undefined), chunks = [];
  mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  const AC = window.AudioContext || window.webkitAudioContext, ac = new AC(), an = ac.createAnalyser();
  an.fftSize = 2048; ac.createMediaStreamSource(stream).connect(an); if (ac.state === 'suspended') ac.resume();
  const buf = new Float32Array(an.fftSize), samples = [], t0 = performance.now();
  R = { stream, mr, ac, chunks, samples, text: '', cancelled: false, sr: null, type: mr.mimeType };
  const me = R;
  R.iv = setInterval(() => {
    const t = (performance.now() - t0) / 1000;
    an.getFloatTimeDomainData(buf);
    let sum = 0; for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
    const rms = Math.sqrt(sum / buf.length); samples.push([t, rms]); drawMeter(rms * 6);
    $('time').textContent = clock(Math.max(0, Math.ceil(LIMIT - t)));
    if (t >= LIMIT) stopRec();
  }, 50);
  mr.onstop = () => finishRec(me);
  mr.start(1000);
  if (canSR && data.sr) startSR(me);
  $('time').classList.add('live');
  $('recBtn').textContent = '■ 話しおわった'; $('recBtn').disabled = false;
}
function startSR(me) {
  const r = new SR(); r.lang = 'ja-JP'; r.continuous = true; r.interimResults = false;
  r.onresult = e => { for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) me.text += e.results[i][0].transcript; };
  r.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'network') me.srDead = true; };
  r.onend = () => { if (R === me && !me.srDead) { try { r.start(); } catch (e) {} } else if (me.srDone) me.srDone(); };
  me.sr = r; try { r.start(); } catch (e) { me.sr = null; }
}
function releaseRec(me) {
  clearInterval(me.iv); me.stream.getTracks().forEach(t => t.stop());
  try { me.ac.close(); } catch (e) {}
}
function stopRec() {
  if (!R || R.stopping) return;
  R.stopping = true; clearInterval(R.iv);
  $('recBtn').disabled = true; $('recBtn').textContent = 'まとめています…';
  if (R.mr.state !== 'inactive') R.mr.stop();
}
function stopAll() { // 録音の途中でやめたとき
  if (!R) return;
  const me = R; me.cancelled = true; R = null;
  if (me.sr) { try { me.sr.abort(); } catch (e) {} }
  if (me.mr.state !== 'inactive') me.mr.stop();
  releaseRec(me);
}
async function finishRec(me) {
  if (me.cancelled) return;
  releaseRec(me);
  if (me.sr) { // 最後の文字が届くのを少しだけ待つ
    await new Promise(ok => { me.srDone = ok; R = null; try { me.sr.stop(); } catch (e) { ok(); } setTimeout(ok, 1500); });
    if (me.cancelled) return;
  }
  R = null;
  const st = analyze(me.samples);
  if (me.sr && !st.silent && !me.srDead && me.text) {
    const txt = me.text.replace(/[\s、。]/g, '');
    st.cpm = Math.round(txt.length / Math.max(5, st.sec) * 60);
    st.fillers = (txt.match(FILLER) || []).length;
  }
  doneTake({ blob: new Blob(me.chunks, { type: me.type || 'audio/webm' }), st });
}
function doneTake(take) {
  if (!S) return;
  S[S.round] = take;
  if (S.round === 'a') toReview(); else finishDay();
}
$('recBtn').onclick = () => { if (R) stopRec(); else startRec(); };
let noMicIv = null;
$('noMicBtn').onclick = () => {
  if (noMicIv) { clearInterval(noMicIv); noMicIv = null; $('noMicBtn').textContent = '録音なしで話す（タイマーだけ）'; doneTake({ blob: null, st: null }); return; }
  const t0 = performance.now(); $('recBtn').disabled = true; $('time').classList.add('live'); $('noMicBtn').textContent = '■ 話しおわった';
  noMicIv = setInterval(() => {
    const t = (performance.now() - t0) / 1000; $('time').textContent = clock(Math.max(0, Math.ceil(LIMIT - t)));
    if ($('speak').hidden || t >= LIMIT) { const go = !$('speak').hidden; clearInterval(noMicIv); noMicIv = null; $('noMicBtn').textContent = '録音なしで話す（タイマーだけ）'; if (go) doneTake({ blob: null, st: null }); }
  }, 200);
};

// ---------- ③ 聞く ----------
function statHtml(st) {
  if (!st || st.silent) return '';
  const items = [['話した長さ', st.sec + '秒'], ['間（ま）の数', st.pauses + '回'], ['いちばん長い間', st.longest + '秒']];
  if (st.cpm != null) items.push(['話す速さ', st.cpm + '字/分'], ['「えーと」など', st.fillers + '回']);
  return items.map(i => `<div class="stat"><small>${i[0]}</small><span>${i[1]}</span></div>`).join('');
}
function suggestGoal(st) {
  if (!st || st.silent) return 'first';
  if (st.fillers >= 3) return 'filler';
  if (st.cpm > 360) return 'slow';
  if (st.sec < 30) return 'long';
  if (st.pauses < 3) return 'short';
  return 'first';
}
function renderGoals() {
  const box = $('goals'); box.innerHTML = '';
  GOALS.forEach(g => {
    const b = document.createElement('button'); b.setAttribute('aria-pressed', g[0] === S.goal);
    b.innerHTML = `${g[1]}<small>${g[2]}</small>`;
    b.onclick = () => { S.goal = g[0]; renderGoals(); };
    box.appendChild(b);
  });
}
function toReview() {
  const { blob, st } = S.a;
  $('playA').hidden = !blob;
  $('statsA').innerHTML = statHtml(st);
  const w = $('revWarn');

  S.goal = suggestGoal(st); renderGoals();
  show('review', 3);
}

$('redoA').onclick = () => toSpeak('a');

function finishDay() {
  const k = keyOf(today()), pack = x => x ? Object.assign({ rec: !!x.blob }, x.st || {}) : null;
  data.days[k] = { topic: S.topic, goal: S.goal, a: pack(S.a), b: pack(S.b) };
  saveData();
  ['a', 'b'].forEach(x => { if (S[x] && S[x].blob) putRec(`${k}-${x}`, S[x].blob); });
  pruneRec();
  const n = totalDays(), r = rankIdx(n);
  $('doneStreak').textContent = streakNow() + '日 連続';
  $('doneRank').textContent = `合計 ${n}日　位：${RANKS[r][1]}`;
  $('playDoneA').disabled = !S.a.blob; $('playDoneB').disabled = !S.b.blob;
  const f = (x, p, u) => x && x[p] != null ? x[p] + u : '—';
  const rows = [['話した長さ', 'sec', '秒'], ['間の数', 'pauses', '回'], ['いちばん長い間', 'longest', '秒'], ['話す速さ', 'cpm', '字/分'], ['「えーと」など', 'fillers', '回']]
    .filter(r => (S.a.st && S.a.st[r[1]] != null) || (S.b.st && S.b.st[r[1]] != null));
  $('cmp').innerHTML = rows.length ? '<table><tr><th></th><th>1回目</th><th>2回目</th></tr>' + rows.map(r => `<tr><td>${r[0]}</td><td>${f(S.a.st, r[1], r[2])}</td><td>${f(S.b.st, r[1], r[2])}</td></tr>`).join('') + '</table>' : '';
  $('doneGoal').textContent = '直したこと：' + GOALS.find(g => g[0] === S.goal)[1] + '。数字より、聞いて「伝わるか」を大事に。';
  show('done', 5);
}

if ($('voiceSel').selectedIndex < 0) $('voiceSel').value = 'mix';

$('srBox').hidden = !canSR; $('srOn').checked = !!data.sr;
$('srOn').onchange = () => { data.sr = $('srOn').checked; saveData(); };

// ---------- キャラクター（練習した日数で、持ち物が増える） ----------
function drawChar(now) {
  const c = $('charCv'), x = c.getContext('2d'), q = 6, t = now / 1000, r = rankIdx(totalDays());
  const R2 = (a, b, w, h, col) => { x.fillStyle = col; x.fillRect(Math.round(a * q), Math.round(b * q), Math.round(w * q), Math.round(h * q)); };
  x.clearRect(0, 0, c.width, c.height);
  const y = 4 + (Math.floor(t * 2) % 2 ? 0 : -.5) + .0, col = r >= 5 ? '#f0c070' : '#d97757', ox = 1;
  [2, 4, 7, 9].forEach(a => R2(ox + a, y + 6, 1, 2, col));
  R2(ox + 2, y, 8, 6, col); R2(ox, y + 2, 2, 2, col); R2(ox + 10, y + 2, 2, 2, col);
  const bl = (t % 3) > 2.85;
  R2(ox + 3, y + 1 + (bl ? .6 : 0), 1, bl ? .4 : 1, '#1a1612'); R2(ox + 8, y + 1 + (bl ? .6 : 0), 1, bl ? .4 : 1, '#1a1612');
  if (r >= 1) { R2(ox + 12, y + .5, 2, 2, '#d8d4e4'); R2(ox + 12.5, y + 2.5, 1, 2, '#78729a'); }  // マイク
  if (r >= 2) R2(ox + 2, y + 3, 8, 1, '#d8443a');                                                  // はちまき
  if (r >= 3 && Math.floor(t * 2) % 2) { R2(0, 1, 1, 1, '#f3ead6'); R2(14, 12, 1, 1, '#f3ead6'); }  // きらきら
  if (r >= 4) { R2(ox + 3, y - 1, 6, 1, '#f0c070'); R2(ox + 3, y - 2, 1, 1, '#f0c070'); R2(ox + 5.5, y - 2, 1, 1, '#f0c070'); R2(ox + 8, y - 2, 1, 1, '#f0c070'); } // 冠
  requestAnimationFrame(drawChar);
}
requestAnimationFrame(drawChar);
(() => {
  const c = $('ccTitle'), x = c.getContext('2d'), q = 4;
  function d(now) {
    const t = now / 1000 / 1.4, f = Math.floor(t * 6) % 4, up = [f === 1, f === 3, f === 3, f === 1], col = '#d97757';
    const r = (a, b, w, h, cc) => { x.fillStyle = cc; x.fillRect(Math.round(a * q), Math.round(b * q), Math.round(w * q), Math.round(h * q)); };
    x.clearRect(0, 0, c.width, c.height);
    const y0 = 3 + (f % 2 ? -1 : 0);
    [2, 4, 7, 9].forEach((a, i) => r(a, 9, 1, up[i] ? 1 : 2, col));
    r(2, y0, 8, 6, col); r(0, y0 + 2, 2, 2, col); r(10, y0 + 2, 2, 2, col);
    const bl = (t % 3) > 2.85;
    r(3, y0 + 1 + (bl ? .6 : 0), 1, bl ? .4 : 1, '#1a1612'); r(8, y0 + 1 + (bl ? .6 : 0), 1, bl ? .4 : 1, '#1a1612');
    requestAnimationFrame(d);
  }
  requestAnimationFrame(d);
})();

renderHome();
</script>
