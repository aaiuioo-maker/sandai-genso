#hint{position:fixed;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:52vw;text-align:right;font-size:13px;line-height:1.5;padding:6px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);pointer-events:none;transition:opacity .6s}

.touch #stick{display:block}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);color:#2f2820;font-size:18px;font-weight:700}
.shot #top,.shot #hint,.shot #stick,.shot #load{display:none!important}
