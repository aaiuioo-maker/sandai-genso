<title>わが家さんぽ 地図つき</title>
<style>

#list .grid button{font-size:17px;padding:13px 6px;border-radius:10px;background:transparent;border:1px solid var(--line)}
#close{width:100%;margin-top:14px;font-size:16px;padding:11px;border-radius:10px;background:transparent;border:1px solid var(--line)}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);color:#2f2820;font-size:18px;font-weight:700}
#right{display:flex;gap:8px;pointer-events:auto}
#timeBtn{font-size:17px;font-weight:700;padding:8px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}

#mapSheet{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;gap:8px;box-sizing:border-box;padding:calc(12px + env(safe-area-inset-top)) 16px calc(12px + env(safe-area-inset-bottom));background:#fffaf0;color:#2f2820}

#mapTabs button.on{background:#b5562b;border-color:#b5562b;color:#fff}
#mapClose{margin-left:auto}
#mapNote{font-size:15px;font-weight:700;text-align:center}
#bigMap{flex:1;min-height:0;cursor:pointer;touch-action:manipulation}
.shot #mini,.shot #mapSheet,.shot #top,.shot #hint,.shot #pad,.shot #load{display:none!important}
</style>
</head>

const VB='0.95 0.25 4.1 8.45',toMapX=x=>x+1.2,toMapY=z=>z+1.4,floorKey=()=>P.y>1.75?'2f':'1f';

let miniF='',miniMe=null,bigF='1f',bigMe=null;

const mapSvg=(f,big)=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${VB}" aria-hidden="true">${MAPS[f]}${big?`<g class="names">${mapLabels(f)}</g>`:''}<g class="me"><circle r=".3"/><path d="M0 -.3L.19 .16L0 .06L-.19 .16Z"/></g></svg>`;
const meAt=(el,k)=>el.setAttribute('transform',`translate(${toMapX(P.x).toFixed(3)} ${toMapY(P.z).toFixed(3)}) rotate(${(-P.yaw*180/Math.PI).toFixed(1)}) scale(${k})`);
function drawMe(){const f=floorKey();if(f!==miniF){miniF=f;miniEl.innerHTML=mapSvg(f,false);miniMe=miniEl.querySelector('.me')}meAt(miniMe,1.7);if(mapSheet.classList.contains('on')&&bigMe){bigMe.style.display=bigF===f?'':'none';meAt(bigMe,1)}}
function showBig(f){bigF=f;bigMap.innerHTML=mapSvg(f,true);bigMe=bigMap.querySelector('.me');document.querySelectorAll('#mapTabs [data-f]').forEach(b=>b.classList.toggle('on',b.dataset.f===f));drawMe()}
const closeMap=()=>mapSheet.classList.remove('on');
miniEl.onclick=()=>{mapSheet.classList.add('on');showBig(floorKey());fadeHint()};
document.querySelectorAll('#mapTabs [data-f]').forEach(b=>b.onclick=()=>showBig(b.dataset.f));
document.getElementById('mapClose').onclick=closeMap;
bigMap.onclick=e=>{const s=bigMap.querySelector('svg');if(!s)return;const q=new DOMPoint(e.clientX,e.clientY).matrixTransform(s.getScreenCTM().inverse());if(goTo(q.x-1.2,q.y-1.4,bigF==='2f'?1:0)){wantFace=true;closeMap()}};

const TIMES=[
 {n:'朝',p:[9,10,12],c:0xffe9cf,s:1.25,h:[0xfff4e6,0xc9b89f,.46],f:1,e:1,bg:0xdcecf5,g:1,env:1},
 {n:'昼',p:[-9,17,11],c:0xffe2bd,s:1.45,h:[0xfff6e8,0xc9b89f,.46],f:1,e:1.02,bg:0xd9e6ee,g:1,env:1},
 {n:'夕',p:[-14,5,6],c:0xff9f55,s:1.6,h:[0xfff0df,0xb89a78,.36],f:.5,e:.96,bg:0xf2c49a,g:.72,env:.75},
 {n:'夜',p:[-5,14,6],c:0x8fa8d8,s:.12,h:[0xffe9c8,0xa8906f,.66],f:0,e:.92,bg:0x18233a,g:.12,env:.22}];
let timeI=1,groundMat=null,envBase=null;const timeBtn=document.getElementById('timeBtn'),groundC=new THREE.Color(0xa9b49a).convertSRGBToLinear();
function setTime(i){timeI=i;const t=TIMES[i];sunL.position.copy(lightC).add(new THREE.Vector3(...t.p).normalize().multiplyScalar(24));sunL.color.set(t.c);sunL.intensity=t.s;hemiL.color.set(t.h[0]);hemiL.groundColor.set(t.h[1]);hemiL.intensity=t.h[2];fillA.intensity=.2*t.f;fillB.intensity=.16*t.f;
 renderer.toneMappingExposure=t.e;renderer.setClearColor(t.bg,1);if(groundMat)groundMat.color.copy(groundC).multiplyScalar(t.g);
 if(!envBase){envBase=new Map();houseMeshes.forEach(e=>{if(!envBase.has(e.material))envBase.set(e.material,e.material.envMapIntensity)})}envBase.forEach((v,m)=>{m.envMapIntensity=v*t.env});
 timeBtn.textContent=t.n;timeBtn.setAttribute('aria-label','時間帯: '+t.n+'（押すと変わります）');renderer.shadowMap.needsUpdate=true;PT.n=0}
timeBtn.onclick=()=>setTime((timeI+1)%TIMES.length);
function update(dt){const x0=P.x,y0=P.y,z0=P.z,yaw0=P.yaw,pitch0=P.pitch,eye0=eyeY;lookHold=Math.max(0,lookHold-dt);
 const fw=hold.f-hold.b+(isKey('KeyW','ArrowUp')?1:0)-(isKey('KeyS','ArrowDown')?1:0),turn=hold.l-hold.r+(isKey('ArrowLeft')?1:0)-(isKey('ArrowRight')?1:0),str=(isKey('KeyD')?1:0)-(isKey('KeyA')?1:0);if(fw||turn||str){path=null;faceYaw=null}if(lookHold)faceYaw=null;if(faceYaw!==null){let df=faceYaw-P.yaw;df=Math.atan2(Math.sin(df),Math.cos(df));if(Math.abs(df)<.01){P.yaw=faceYaw;faceYaw=null}else P.yaw+=df*Math.min(1,dt*3.5)}P.yaw+=turn*1.45*dt;
 const sp=(isKey('ShiftLeft','ShiftRight')?3:1.75)*dt;let dx=0,dz=0;
 const rail=!!(path&&path.length);if(rail){const a=path[Math.min(6,path.length-1)],ax=a.x-P.x,az=a.z-P.z;if(!lookHold&&Math.hypot(ax,az)>.04){const want=Math.atan2(-ax,-az);let df=want-P.yaw;df=Math.atan2(Math.sin(df),Math.cos(df));P.yaw+=df*Math.min(1,dt*5.5);P.pitch+=(-.07-P.pitch)*Math.min(1,dt*2.5)}let left=sp,ty=P.y;while(path.length&&left>0){const w=path[0],wx=w.x-P.x,wz=w.z-P.z,d=Math.hypot(wx,wz);ty=w.y;if(d<=left){P.x=w.x;P.z=w.z;left-=d;path.shift()}else{P.x+=wx/d*left;P.z+=wz/d*left;left=0}}P.vy=0;if(path.length)P.y+=(ty-P.y)*Math.min(1,dt*14);else{P.y=ty;path=null;faceYaw=openYaw()}}
 else{const s=Math.sin(P.yaw),c=Math.cos(P.yaw),l=Math.max(1,Math.hypot(fw,str));dx=(c*str-s*fw)/l*sp;dz=(-s*str-c*fw)/l*sp}
 moveAxis('x',dx);moveAxis('z',dz);if(path&&(dx||dz)){if(Math.hypot(P.x-x0,P.z-z0)<sp*.2){stuck+=dt;if(stuck>.6)path=null}else stuck=0}
 if(!rail){P.vy=Math.max(-7,P.vy-11*dt);const ny=P.y+P.vy*dt,sh=stairH(P.x,P.z);if(sh!==null&&ny<=sh+.12&&P.y>=sh-.8){P.y=sh;P.vy=0}else if(hit(P.x,ny,P.z)){if(P.vy<0)P.y=Math.max(P.y,O[1]+(cellOf(ny+.02,1)+1)*V-.019);P.vy=0}else P.y=ny}
 const tg=P.y+EYE;eyeY+=(tg-eyeY)*Math.min(1,dt*12);if(Math.abs(tg-eyeY)<.002)eyeY=tg;updateRoom();applyCast();return x0!==P.x||z0!==P.z||Math.abs(y0-P.y)>.0005||yaw0!==P.yaw||pitch0!==P.pitch||eye0!==eyeY}
let last=0,moveT=0;function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;if(update(dt))PT.n=0;if(PT.n===0)present();requestAnimationFrame(loop)}
