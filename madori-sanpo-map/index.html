<style>

#close{width:100%;margin-top:14px;font-size:16px;padding:11px;border-radius:10px;background:transparent;border:1px solid var(--line)}

#mapClose{margin-left:auto}
#mapNote{font-size:15px;font-weight:700;text-align:center}
#bigMap{flex:1;min-height:0;cursor:pointer;touch-action:manipulation}
.shot #mini,.shot #mapSheet,.shot #top,.shot #hint,.shot #pad,.shot #load{display:none!important}

 const fw=hold.f-hold.b+(isKey('KeyW','ArrowUp')?1:0)-(isKey('KeyS','ArrowDown')?1:0),turn=hold.l-hold.r+(isKey('ArrowLeft')?1:0)-(isKey('ArrowRight')?1:0),str=(isKey('KeyD')?1:0)-(isKey('KeyA')?1:0);if(fw||turn||str){path=null;faceYaw=null}if(lookHold)faceYaw=null;if(faceYaw!==null){let df=faceYaw-P.yaw;df=Math.atan2(Math.sin(df),Math.cos(df));if(Math.abs(df)<.01){P.yaw=faceYaw;faceYaw=null}else P.yaw+=df*Math.min(1,dt*3.5)}P.yaw+=turn*1.45*dt;
 const sp=(isKey('ShiftLeft','ShiftRight')?3:1.75)*dt;let dx=0,dz=0;
 const rail=!!(path&&path.length);if(rail){const a=path[Math.min(6,path.length-1)],ax=a.x-P.x,az=a.z-P.z;if(!lookHold&&Math.hypot(ax,az)>.04){const want=Math.atan2(-ax,-az);let df=want-P.yaw;df=Math.atan2(Math.sin(df),Math.cos(df));P.yaw+=df*Math.min(1,dt*5.5);P.pitch+=(-.07-P.pitch)*Math.min(1,dt*2.5)}let left=sp,ty=P.y;while(path.length&&left>0){const w=path[0],wx=w.x-P.x,wz=w.z-P.z,d=Math.hypot(wx,wz);ty=w.y;if(d<=left){P.x=w.x;P.z=w.z;left-=d;path.shift()}else{P.x+=wx/d*left;P.z+=wz/d*left;left=0}}P.vy=0;if(path.length)P.y+=(ty-P.y)*Math.min(1,dt*14);else{P.y=ty;path=null;faceYaw=openYaw()}}
 else{const s=Math.sin(P.yaw),c=Math.cos(P.yaw),l=Math.max(1,Math.hypot(fw,str));dx=(c*str-s*fw)/l*sp;dz=(-s*str-c*fw)/l*sp}
 moveAxis('x',dx);moveAxis('z',dz);if(path&&(dx||dz)){if(Math.hypot(P.x-x0,P.z-z0)<sp*.2){stuck+=dt;if(stuck>.6)path=null}else stuck=0}
 if(!rail){P.vy=Math.max(-7,P.vy-11*dt);const ny=P.y+P.vy*dt,sh=stairH(P.x,P.z);if(sh!==null&&ny<=sh+.12&&P.y>=sh-.8){P.y=sh;P.vy=0}else if(hit(P.x,ny,P.z)){if(P.vy<0)P.y=Math.max(P.y,O[1]+(cellOf(ny+.02,1)+1)*V-.019);P.vy=0}else P.y=ny}
 const tg=P.y+EYE;eyeY+=(tg-eyeY)*Math.min(1,dt*12);if(Math.abs(tg-eyeY)<.002)eyeY=tg;updateRoom();applyCast();return x0!==P.x||z0!==P.z||Math.abs(y0-P.y)>.0005||yaw0!==P.yaw||pitch0!==P.pitch||eye0!==eyeY}
let last=0,moveT=0;function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;if(update(dt))PT.n=0;if(PT.n===0)present();requestAnimationFrame(loop)}
setTimeout(()=>{buildHouse();buildNav();setTime(1);document.getElementById('load').style.display='none';resize();
 if(shotM){const a=shotM[1].split(',').map(Number);P.x=a[0];P.y=a[1];P.z=a[2];P.yaw=a[3]||0;P.pitch=a[4]||0;eyeY=P.y+EYE;applyCast();present()}else{for(let i=0;i<20;i++)update(1/30);eyeY=P.y+EYE;requestAnimationFrame(loop)}},30);
</script>
