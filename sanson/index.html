  .list img { width: 56px; height: 56px; image-rendering: pixelated; border-radius: 10px; flex-shrink: 0; }

</div>

<script>
// ---------- タイトルの左のオレンジのキャラクター（歩く） ----------
(function titleMascot() {
  const c = document.getElementById('ccTitle'), g = c.getContext('2d'), q = 4, oy = 5;
  function draw(now) {
    const t = now / 1000 / 1.4;
    const R = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(Math.round(x * q), Math.round(y * q), Math.round(w * q), Math.round(h * q)); };
    g.clearRect(0, 0, c.width, c.height);
    const col = '#d97757', f = Math.floor(t * 6) % 4, hop = f % 2 ? -1 : 0;
    const up = [f === 1, f === 3, f === 3, f === 1];
    [2, 4, 7, 9].forEach((x, i) => R(x, oy + 6, 1, up[i] ? 1 : 2, col));
    const y0 = oy + hop;
    R(2, y0, 8, 6, col); R(0, y0 + 2, 2, 2, col); R(10, y0 + 2, 2, 2, col);
    const blink = (t % 3) > 2.85;
    R(3, y0 + 1 + (blink ? .6 : 0), 1, blink ? .4 : 1, '#1a1612'); R(8, y0 + 1 + (blink ? .6 : 0), 1, blink ? .4 : 1, '#1a1612');
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
<!-- 更新した日時（GitHub に反映した日時が自動で出る）。画面のいちばん下に小さく出す -->

e.style.cssText='display:block;width:100%;text-align:center;font:11px/1.4 sans-serif;color:inherit;opacity:.6;margin-top:10px;pointer-events:none;';
document.body.appendChild(e);})();</script>
