<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="三尊の弥陀">
<title>三尊の弥陀</title>
<link rel="apple-touch-icon" href="icon-180.png?v=1">
<link rel="manifest" href="zenbu.webmanifest?v=1">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05040d">
<link rel="icon" href="icon-180.png?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&text=%E4%B8%89%E5%B0%8A%E4%BD%8D%E4%B8%80%E4%BD%93%E6%97%A5%E6%9C%88%E5%9C%B0%E6%B3%95%E5%A0%B1%E5%BF%9C%E8%BA%AB%E7%9C%9F%E7%B4%94%E9%87%91&display=swap" rel="stylesheet">
<style>
  :root { --bg:#05040d; --fg:#f3ead6; --accent:#d97757; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font-family: "DotGothic16", sans-serif; display: flex; flex-direction: column; align-items: center;
         padding: calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); min-height: 100vh; }
  /* タイトルは真ん中。オレンジのキャラクターは左はしに小さく */
  h1 { font-size: 18px; font-weight: 400; margin: 0 0 4px; letter-spacing: .08em; position: relative; width: 100%; max-width: 480px; text-align: center; }
  #ccTitle { position: absolute; left: 36px; top: 50%; transform: translateY(-58%); width: 24px; height: 26px; image-rendering: pixelated; border: none; border-radius: 0; background: transparent; }
  .sub { font-size: 11px; opacity: .6; margin: 0 0 10px; }
  .stage { width: 100%; max-width: 480px; position: relative; }
  canvas { width: 100%; display: block; image-rendering: pixelated; border: 2px solid #2a2540; border-radius: 6px; background: #000; }
  .panel { margin-top: 10px; background: #12101f; border: 2px solid #2a2540; border-radius: 6px; padding: 10px 12px; }
  .seek { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .seek span { width: 40px; flex-shrink: 0; text-align: center; color: #ffcf8a; }
  .seek span:last-child { color: #8a84a8; }
  .seek input { flex: 1; min-width: 0; accent-color: var(--accent); height: 22px; }
  /* 左から「最初から・再生・声と音」を横一列に。画面の幅に合わせて文字の大きさを変える */
  .btns { display: flex; flex-wrap: nowrap; gap: 6px; margin-top: 8px; }
  .btns button { flex: 1 1 0; min-width: 0; white-space: nowrap; font-size: clamp(11px, 3.3vw, 14px); padding: 7px 2px; border-color: #5a5478; }
  .btns .snd { color: #6fe0a0; flex-grow: 1.25; }
  .btns .snd.off { color: #8a84a8; }
  /* 声の選びかた */
  .voices { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; }
  .voices span { flex-shrink: 0; color: #8a84a8; }
  .voices button { flex: 1 1 0; min-width: 0; white-space: nowrap; font-size: clamp(11px, 3.3vw, 14px); padding: 5px 2px; border-color: #3a3358; color: #8a84a8; }
  .voices button.on { border-color: var(--accent); color: var(--fg); }
  /* VOICEVOX・AivisSpeech・ランダム：文字の長さに合わせて幅を分ける（AivisSpeech がはみ出さないように） */
  #engRow button { flex: 1 1 auto; font-size: clamp(10px, 3vw, 14px); padding: 5px 1px; }
  /* 順番・人の名前の段は 左はしから並べる */
  #nameRow span { display: none; }
  button { font-family: inherit; font-size: 15px; color: var(--fg); background: #1c1930; border: 2px solid var(--accent);
           border-radius: 6px; padding: 8px 18px; cursor: pointer; }
  button:active { transform: translateY(1px); }
  .start { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .start button { font-size: 18px; padding: 12px 26px; background: rgba(28,25,48,.9); }
  .hide { display: none !important; }
  .back { display: block; margin-top: 12px; font-size: 13px; color: #ffcf8a; text-decoration: none; }
</style>
</head>
<body>
<h1><canvas id="ccTitle" width="48" height="52" aria-hidden="true"></canvas>三尊の弥陀</h1>
<p class="sub">観音・阿弥陀・釈迦は三位一体（全部まとめて・約3分・声と音が出ます）<br><span id="credit">声：VOICEVOX:四国めたん</span></p>
<div class="stage">
  <canvas id="cv"></canvas>
  <div class="start" id="startBox"><button id="startBtn">▶ 再生する</button></div>
</div>
<div class="stage panel">
  <div class="seek"><span id="curT">00:00</span><input type="range" id="seekBar" min="0" max="85" step="0.1" value="0" aria-label="再生位置"><span id="totT">00:00</span></div>
  <div class="btns">
    <button id="rsBtn">🔄 最初から</button>
    <button id="ppBtn">▶ 再生</button>
    <button id="sndBtn" class="snd">🔊 声・音 ON</button>
  </div>
  <div class="voices" id="engRow"><span>声</span>
    <button data-e="0" class="on">VOICEVOX</button>
    <button data-e="1">AivisSpeech</button>
    <button data-e="2">ランダム</button>
  </div>
  <div class="voices" id="nameRow"><span>　　</span></div>
</div>
<a class="back" href="../">◀ 三尊の弥陀 メニューへ</a>

<script src="../douga.js?v=3"></script>
<!-- 更新した日時（GitHub に反映した日時が自動で出る）。画面のいちばん下（操作パネルの下）に小さく出す -->
<script>(function(){var d=new Date(document.lastModified);if(isNaN(d)||Math.abs(Date.now()-d)<5000)return;function p(n){return('0'+n).slice(-2);}
var e=document.createElement('div');e.id='appVer';e.textContent='更新 '+d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
e.style.cssText='display:block;width:100%;text-align:center;font:11px/1.4 sans-serif;color:inherit;opacity:.6;margin-top:10px;pointer-events:none;';
document.body.appendChild(e);})();</script>
</body>
</html>
