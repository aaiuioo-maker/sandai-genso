<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ハンター×ハンターごっこ">
<title>ハンター×ハンターごっこ</title>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05040d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root { --bg:#05040d; --fg:#f3ead6; --accent:#d97757; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font-family: "DotGothic16", sans-serif; display: flex; flex-direction: column; align-items: center;
         padding: calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); min-height: 100vh; }
  h1 { font-size: 18px; font-weight: 400; margin: 0 0 4px; letter-spacing: .08em; }
  .sub { font-size: 11px; opacity: .6; margin: 0 0 10px; text-align: center; }
  .wrap { width: 100%; max-width: 480px; }
  .stage { position: relative; background: #0f1028; border: 2px solid #2a2540; border-radius: 6px; overflow: hidden; }
  #cv { width: 100%; display: block; image-rendering: pixelated; }
  .bar { height: 4px; background: #1c1930; margin-top: 6px; border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); }
  .btns { display: flex; gap: 6px; margin-top: 8px; }
  button, .btns a { flex: 1 1 0; font-family: inherit; font-size: 14px; color: var(--fg); background: #1c1930; border: 2px solid #3a3358;
           border-radius: 6px; cursor: pointer; padding: 8px 2px; text-align: center; text-decoration: none; }
  button.on { border-color: var(--accent); }
  button:active { transform: translateY(1px); }
</style>
</head>
<body>
<h1>ハンター×ハンターごっこ</h1>
<p class="sub">オレンジのキャラクターが 7人に変身（約80秒・音が出ます）</p>
<div class="wrap">
  <div class="stage"><canvas id="cv"></canvas></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="btns">
    <button id="playBtn" class="on">▶ 再生</button>
    <a href="./">変身図鑑へ</a>
  </div>
</div>

<script src="cos.js?v=1"></script>
<script>
const { drawChar, COS } = ccHenshin;
const who = n => COS.find(c => c.who === n);
const GON = who('ゴン'), KIL = who('キルア'), HIS = who('ヒソカ'), PIT = who('ネフェルピトー'), NET = who('ネテロ'), MER = who('メルエム');
const PLAIN = {};

// ツェリードニヒ（変身図鑑の30人にはいないので、ここだけで描く）：なでつけた金髪・むらさきの王子の服と金のかざり・赤いネクタイ
const TSE = {
  back(d) { d.b(1.4, 3, 9.2, 4.2, '#3a1a52'); },                                   // 長い上着のすそ
  front(d) {
    d.b(1.6, -1.6, 8.8, 2, '#f2d060'); d.b(1.6, -2.3, 6.4, .8, '#f2d060'); d.b(6.8, -2.8, 3.8, 1.2, '#fae69a');
    d.b(1.6, 0, .7, 1.4, '#f2d060'); d.b(9.7, 0, .7, 1.1, '#f2d060');
    d.b(2, 3, 8, 3, '#5a2a7a'); d.b(4.4, 3, 3.2, 3, '#f4f0e8'); d.b(5.6, 3.2, .8, 2.4, '#c0262c');
    d.b(4.1, 3, .3, 3, '#e8c040'); d.b(7.6, 3, .3, 3, '#e8c040');
    d.b(1.5, 2.6, 2.7, .7, '#e8c040'); d.b(7.8, 2.6, 2.7, .7, '#e8c040');
    d.b(1, 2 + d.la, 1, 2, '#5a2a7a'); d.b(10, 2 + d.ra, 1, 2, '#5a2a7a');
  },
  eye: '#4a2a6a',
  leg: () => '#2a1238',
};
// 目をとじた ツェリードニヒ（「絶」）
const TSE_ZETSU = { ...TSE, eye: '#d97757', front(d) { TSE.front(d); d.b(2.8, 1.6, 1.4, .3, '#1a1612'); d.b(7.8, 1.6, 1.4, .3, '#1a1612'); } };

// ---------- 画面 ----------
// 上の舞台（32×21マス・1マス＝15画素）と、下の字幕の帯
const W = 480, SH = 320, HH = 400, U = 15;
const cv = document.getElementById('cv'); cv.width = W; cv.height = HH;
const g = cv.getContext('2d');
const X0 = 10, Y0 = 10, FEET = 18;           // キャラクターの左上（体）と 足もと（マス）
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = k => (k = cl(k)) * k * (3 - 2 * k);
const hash = (a, b = 0, c = 0) => { const x = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453; return x - Math.floor(x); };

function R(x, y, w, h, c, a = 1) {
  g.globalAlpha = cl(a); g.fillStyle = c;
  const X = Math.round(x * U), Y = Math.round(y * U);
  g.fillRect(X, Y, Math.max(1, Math.round((x + w) * U) - X), Math.max(1, Math.round((y + h) * U) - Y));
  g.globalAlpha = 1;
}
function txt(s, x, y, size, col, a = 1) {   // x・y はマス
  g.globalAlpha = cl(a);
  g.font = `${size}px "DotGothic16", monospace`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineWidth = Math.max(4, size / 5); g.lineJoin = 'round'; g.strokeStyle = '#000'; g.strokeText(s, x * U, y * U);
  g.fillStyle = col; g.fillText(s, x * U, y * U); g.globalAlpha = 1;
}
// キャラクター（x・y は体の左上のマス、s は大きさ、a はうすさ）
function C(cos, x, y, t, mode = 'stand', s = 1, a = 1) {
  g.globalAlpha = a; drawChar(g, U * s, x / s, y / s, t, mode, cos); g.globalAlpha = 1;
}
function line(x0, y0, x1, y1, col, w = .4, a = 1) {
  const n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / .25));
  for (let i = 0; i <= n; i++) { const k = i / n; R(x0 + (x1 - x0) * k - w / 2, y0 + (y1 - y0) * k - w / 2, w, w, col, a); }
}
function bolt(x0, y0, x1, y1, sd, col = '#bfe8ff', w = .4) {
  let px = x0, py = y0; const n = 6;
  for (let i = 1; i <= n; i++) {
    const k = i / n, j = i < n ? (hash(sd, i) - .5) * 2.4 : 0;
    const nx = x0 + (x1 - x0) * k + j * (y1 - y0 ? 1 : 0), ny = y0 + (y1 - y0) * k + j * (x1 - x0 ? 1 : 0) * .6;
    line(px, py, nx, ny, col, w); px = nx; py = ny;
  }
}
function oval(cx, cy, rx, ry, col, a = 1) {
  for (let yy = -ry; yy < ry; yy += .5) { const w = rx * Math.sqrt(Math.max(0, 1 - ((yy + .25) / ry) ** 2)); R(cx - w, cy + yy, w * 2, .5, col, a); }
}
function ring(cx, cy, r, col, a = 1, ry = r) {
  const n = Math.max(12, r * 6 | 0);
  for (let i = 0; i < n; i++) { const an = i / n * 6.283; R(cx + Math.cos(an) * r - .25, cy + Math.sin(an) * ry - .25, .5, .5, col, a); }
}
function burst(cx, cy, k, c1 = '#ffffff', c2 = '#ffd84a', size = 1) {
  const a = 1 - k * 1.4, r = (2 + k * 12) * size;
  for (let i = 0; i < 12; i++) { const an = i * Math.PI / 6; R(cx + Math.cos(an) * r * .6 - 1, cy + Math.sin(an) * r * .5 - 1, 2.2, 2.2, c1, a); }
  for (let i = 0; i < 8; i++) { const an = i * Math.PI / 4 + .4; R(cx + Math.cos(an) * r - .5, cy + Math.sin(an) * r * .7 - .5, 1, 1, c2, a); }
}
// オーラ：体のまわりで ゆらゆら 上にのぼる四角
function aura(cx, cy, rx, ry, col, t, a) {
  const fr = Math.floor(t * 12);
  for (let i = 0; i < 46; i++) {
    const an = i / 46 * 6.283, j = hash(i, fr) * 1.4, up = ((t * 3 + hash(i)) % 1) * 2.4;
    R(cx + Math.cos(an) * (rx + j) - .35, cy + Math.sin(an) * (ry + j) - up - .35, .7, .7, col, a * (1 - up / 3));
  }
  oval(cx, cy, rx, ry, col, a * .18);
}
function card(x, y, col, a = 1) { R(x, y, .9, 1.3, '#f4f4f4', a); R(x + .2, y + .4, .5, .5, col, a); }
function flash(a, col = '#ffffff') { g.globalAlpha = cl(a); g.fillStyle = col; g.fillRect(0, 0, W, SH); g.globalAlpha = 1; }
function sky(c1, c2) { const gr = g.createLinearGradient(0, 0, 0, SH); gr.addColorStop(0, c1); gr.addColorStop(1, c2); g.fillStyle = gr; g.fillRect(0, 0, W, SH); }
function stars(t, col = '#ffffff', n = 30, seed = 1) {
  for (let i = 0; i < n; i++) R(hash(i, seed) * 32, hash(i, seed, 2) * 14, .3, .3, col, .3 + .5 * Math.abs(Math.sin(t * 1.5 + i)));
}
function ground(col, edge) { R(0, FEET, 32, 4, col); R(0, FEET, 32, .3, edge); }
function hop(t) { return Math.floor(t * 6) % 4 % 2 ? -1 : 0; }   // drawChar の「立つ」ときの上下（目や手の位置合わせ用）

// ---------- 場面 ----------
// 1人の場面：はじめは もとのオレンジのキャラクター → 「！」→ ぽん！と変身 → 名前 → その人の技
// caps：[秒, 字幕]、snd：[秒, 高さ, 長さ, 音色, 大きさ, 終わりの高さ]（音色 'noise' は ザーッという音）
function person(o) {
  return {
    dur: o.dur, caps: o.caps,
    snd: [[.1, 880, .08, 'square', .04], [.2, 1320, .1, 'square', .04], [.55, 150, .3, 'triangle', .14, 60],
          ...[784, 988, 1175, 1568].map((f, i) => [.6 + i * .08, f, .3, 'triangle', .05]), ...o.snd],
    shake: o.shake,
    draw(s, t) {
      o.bg(s, t);
      if (s < .62) {
        C(PLAIN, X0, Y0, t, 'stand');
        if (s > .08) txt('！', X0 + 6, Y0 - 1.6, 30, '#ffe14a', 1 - cl((s - .45) / .15));
      } else o.draw(s, t);
      if (s > .3 && s < 1.2) burst(X0 + 6, Y0 + 3, (s - .3) / .9);
      if (s > .9) {                                                            // 名前の札（左上）
        g.font = '16px "DotGothic16", monospace'; g.textAlign = 'left'; g.textBaseline = 'middle';
        const bw = g.measureText(o.name).width / U + 1.4, k = ease((s - .9) / .3), x = -bw + k * (bw + .4);
        R(x, .3, bw, 1.9, '#000000', .7); R(x, .3, .3, 1.9, o.col);
        g.globalAlpha = k; g.font = '16px "DotGothic16", monospace'; g.textAlign = 'left'; g.textBaseline = 'middle';
        g.fillStyle = o.col; g.fillText(o.name, (x + .7) * U, 1.25 * U); g.globalAlpha = 1;
      }
    },
  };
}

const SC = [
  // ---- はじまり ----
  { dur: 5, caps: [[0, 'オレンジのキャラクターが'], [1.6, 'ハンター×ハンターの 7人に変身するよ！']],
    snd: [[.2, 523, .15, 'square', .04], [.4, 659, .15, 'square', .04], [.6, 784, .15, 'square', .04], [1.6, 1047, .5, 'triangle', .07],
          [1.6, 262, .6, 'triangle', .08], [2.2, 784, .12, 'square', .04], [2.35, 988, .12, 'square', .04], [2.5, 1175, .4, 'square', .05]],
    draw(s, t) {
      sky('#071a10', '#123a22'); stars(t, '#b8ffcf', 34);
      ground('#0a2414', '#2f8a4a');
      const x = -12 + ease(s / 2.4) * (X0 + 12);
      C(PLAIN, x, Y0, t, s < 2.4 ? 'walk' : 'talk');
      const k = ease((s - 1.4) / .5);
      txt('HUNTER×HUNTER', 16, 3 + (1 - k) * -3, 34, '#7cf09a', k);
      txt('ごっこ', 16, 5.6, 26, '#ffcf8a', ease((s - 2) / .4));
    } },

  // ---- ゴン ----
  person({ dur: 9, name: 'ゴン＝フリークス・強化系', col: '#7cf09a',
    caps: [[0, ''], [.9, 'ぼく、ゴン！ くじら島から来たんだ'], [2.5, 'オーラを こぶしに ぜんぶ集めて…'], [5.6, '必殺の ジャジャン拳！']],
    snd: [[2.5, 392, .25, 'square', .05], [3.5, 440, .25, 'square', .05], [4.5, 494, .25, 'square', .05],
          [2.5, 60, 3.1, 'sawtooth', .025, 220], [5.6, 'noise', .9, 'noise', .25], [5.6, 120, .6, 'triangle', .2, 40], [5.62, 1568, .3, 'square', .04, 600]],
    shake: s => s > 5.6 && s < 6.3 ? (6.3 - s) * 1.2 : s > 2.5 && s < 5.6 ? (s - 2.5) * .05 : 0,
    bg(s, t) { sky('#5ab8e8', '#cfeefa'); R(0, 13, 32, 5, '#2f8a4a'); R(3, 11, 6, 2, '#3aa058'); R(20, 12, 9, 1, '#3aa058'); ground('#6a4a2a', '#8ac04a'); },
    draw(s, t) {
      const charge = s > 2.5 && s < 5.6, k = cl((s - 2.5) / 3.1);
      const x = s >= 5.6 ? X0 + ease((s - 5.6) / .12) * 3 : X0;
      if (charge) aura(x + 6, Y0 + 2.5, 6.5 + k * 2, 6 + k * 2, '#ffe14a', t, .35 + k * .5);
      C(GON, x, Y0, t, s < 2.5 ? 'talk' : 'stand');
      const fx = x + 12.6, fy = Y0 + 3 + hop(t);
      if (charge) { const r = .5 + k * 1.6; oval(fx, fy, r + .6, r + .6, '#ffe14a', .4); oval(fx, fy, r, r, '#fffbd0'); }
      if (charge) txt(s < 3.5 ? '最初は グー' : s < 4.5 ? 'ジャン…' : 'ケン…', 16, 3.3, 28, '#ffe14a');
      if (s >= 5.6) {
        const p = s - 5.6;
        burst(fx + 2, fy, p / 1.2, '#fffbd0', '#ffb030', 1.6);
        if (p < .25) flash(.8 - p * 3);
        txt('グー！！', 16, 3.3, 40 + Math.max(0, .3 - p) * 40, '#ffcf3a');
      }
    } }),

  // ---- キルア ----
  person({ dur: 9, name: 'キルア＝ゾルディック・変化系', col: '#9ad8ff',
    caps: [[0, ''], [.9, 'おれは キルア。殺し屋の家に 生まれたんだ'], [2.5, 'オーラを 電気に変えて…'], [4, '神速（カンムル）！ 目にも とまらない速さ']],
    snd: [...[2.5, 2.8, 3.1, 3.4, 3.7].map(T => [T, 'noise', .08, 'noise', .07]),
          ...[4, 4.55, 5.1, 5.65, 6.2, 6.75, 7.3].map(T => [T, 2400, .12, 'sawtooth', .04, 300]),
          ...[4, 4.55, 5.1, 5.65, 6.2, 6.75, 7.3].map(T => [T, 'noise', .12, 'noise', .08])],
    shake: s => s > 4 ? .15 : 0,
    bg(s, t) {
      sky('#0a0f2a', '#1e2a5a'); stars(t, '#bfe8ff', 26, 3); ground('#141a3a', '#3a6ad8');
      if (s > 2.5 && Math.floor(s * 7) % 9 === 0) flash(.15, '#bfe8ff');
    },
    draw(s, t) {
      const P = [X0, 2, 19, 5, 18, 3, 20, X0];
      if (s < 4) {
        C(KIL, X0, Y0, t, s < 2.5 ? 'talk' : 'stand');
        if (s > 2.5) for (let i = 0; i < 3; i++) { const sd = Math.floor(t * 14) * 3 + i, a = hash(sd) * 6.28; bolt(X0 + 6, Y0 + 3, X0 + 6 + Math.cos(a) * 7, Y0 + 3 + Math.sin(a) * 6, sd); }
        return;
      }
      const st = Math.min(P.length - 2, Math.floor((s - 4) / .55)), p = ((s - 4) % .55) / .55;
      const a = P[st], b = P[st + 1];
      for (let i = Math.max(0, st - 2); i <= st; i++) C(KIL, P[i], Y0, t, 'stand', 1, .18 + (i - st + 2) * .08);   // 残像
      if (p < .2) {                                                            // ビュン！
        for (let i = 0; i < 4; i++) bolt(a + 6, Y0 + 1 + i * 1.8, b + 6, Y0 + 1 + i * 1.8, st * 9 + i + Math.floor(t * 20), i % 2 ? '#ffffff' : '#9ad8ff', .5);
      } else {
        C(KIL, b, Y0, t, 'stand');
        const sd = Math.floor(t * 14); bolt(b + 6, Y0 - 2, b + 6 + (hash(sd) - .5) * 10, Y0 + 7, sd);
      }
      txt('神速（カンムル）！', 16, 3.3, 30, '#bfe8ff');
    } }),

  // ---- ヒソカ ----
  person({ dur: 9, name: 'ヒソカ・変化系', col: '#ff8ac8',
    caps: [[0, ''], [.9, 'ボクは ヒソカ。強い人と 戦うのが 大好き♥'], [2.5, 'バンジーガム♠ ガムとゴム 両方の 性質を もつ'], [5.2, 'トランプも 武器になるのさ♦'], [7.6, 'くっくっく…♣']],
    snd: [[2.6, 300, .7, 'sine', .06, 900], [3.8, 900, .5, 'sine', .06, 250], [4.6, 1760, .1, 'square', .04],
          ...[5.2, 5.6, 6, 6.4, 6.8].map(T => [T, 3000, .1, 'square', .03, 1500]), [7.6, 220, .15, 'square', .04], [7.8, 196, .15, 'square', .04], [8, 175, .3, 'square', .04]],
    bg(s, t) {
      sky('#2a0a3a', '#5a1a5a'); ground('#2a1030', '#ff8ac8');
      for (let i = 0; i < 6; i++) txt('♠♥♦♣'[i % 4], 2 + i * 5.6, 3 + Math.sin(t + i) * 1.2 + 5, 20, i % 2 ? '#ff5a8a' : '#7a4aa8', .25);
    },
    draw(s, t) {
      C(HIS, X0, Y0, t, s < 2.5 || s > 7.6 ? 'talk' : 'stand');
      const hx = X0 + 12.2, hy = Y0 + 3 + hop(t);
      if (s > 2.5 && s < 5.2) {
        let cx = 27, cy = 6;
        const out = ease((s - 2.5) / .8), pull = ease((s - 3.8) / .8);
        if (s > 3.8) { cx = 27 + (hx - 27) * pull; cy = 6 + (hy - 1 - 6) * pull; }
        const ex = hx + (cx - hx) * (s < 3.8 ? out : 1), ey = hy + (cy - hy) * (s < 3.8 ? out : 1);
        for (let i = 0; i <= 30; i++) { const k = i / 30; R(hx + (ex - hx) * k - .2, hy + (ey - hy) * k + Math.sin(k * 9 + t * 8) * .6 * (1 - pull) - .2, .45, .45, '#ff8ac8'); }
        card(cx, cy - .6, '#1a1a1a');
        if (s < 5) txt('伸縮自在の愛（バンジーガム）', 16, 3.3, 22, '#ff8ac8');
      }
      if (s >= 5.2 && s < 7.6) {
        for (let i = 0; i < 5; i++) {
          const p = (s - 5.2 - i * .4) / .6; if (p < 0 || p > 1) continue;
          const x = hx + p * 22, y = hy - 1 - Math.sin(p * 3.14) * 2;
          if (Math.floor(t * 16) % 2) card(x, y, i % 2 ? '#e02a3a' : '#1a1a1a'); else R(x, y + .4, 1.3, .5, '#f4f4f4');
        }
        txt('♠ ♥ ♦ ♣', 16, 3.3, 30, '#ffcf3a');
      }
      if (s >= 7.6) txt('くっくっく…', 16, 3.3, 26, '#ff8ac8');
    } }),

  // ---- ネフェルピトー ----
  person({ dur: 9, name: 'ネフェルピトー・特質系', col: '#f0f0ff',
    caps: [[0, ''], [.9, 'ボクは ネフェルピトー。王の 護衛軍だニャ'], [2.5, 'ねこみたいに びょーんと とびかかる！'], [5, 'ピトーの「円」は とっても 広い…']],
    snd: [[.95, 700, .25, 'triangle', .05, 1100], [1.2, 1100, .3, 'triangle', .05, 700], [3.1, 300, .5, 'square', .05, 1400], [3.9, 100, .25, 'triangle', .14, 50],
          [4.4, 300, .35, 'square', .04, 1000], [4.85, 100, .2, 'triangle', .12, 50], [5, 80, 3.6, 'sine', .08, 40],
          ...[5, 5.9, 6.8, 7.7].map(T => [T, 220, .8, 'sine', .05, 110])],
    bg(s, t) {
      sky('#061410', '#14301e'); stars(t, '#d0ffe0', 20, 5);
      for (let i = 0; i < 5; i++) { R(1 + i * 7, 7, 1.2, 11, '#0a2014'); oval(1.6 + i * 7, 7, 3, 2.5, '#0e2a1a'); }
      ground('#0a1e12', '#4a8a5a');
    },
    draw(s, t) {
      let x = X0, y = Y0, mode = s < 2.5 ? 'talk' : 'stand';
      if (s > 2.6 && s < 3.1) y = Y0 + 1;
      if (s >= 3.1 && s < 3.9) { const p = (s - 3.1) / .8; x = X0 + p * 9; y = Y0 - Math.sin(p * 3.14) * 6; mode = 'jump'; }
      if (s >= 3.9 && s < 4.4) x = X0 + 9;

// ---------- 1コマ描く（T：はじめからの秒） ----------
function render(T) {
  T = cl(T, 0, TOTAL - .001);
  let i = 0; while (i < SC.length - 1 && T >= SC[i].t0 + SC[i].dur) i++;
  const sc = SC[i], s = T - sc.t0;

  const sh = sc.shake ? sc.shake(s) : 0;
  if (sh) g.translate(Math.round((hash(Math.floor(T * 30)) - .5) * sh * 12), Math.round((hash(Math.floor(T * 30), 1) - .5) * sh * 8));
  sc.draw(s, T);
  if (s < .25 && i > 0) flash(1 - s / .25, '#000000');                         // 場面の切りかえ
  g.restore();
  // 字幕の帯
  g.fillStyle = '#05040d'; g.fillRect(0, SH, W, HH - SH); g.fillStyle = '#2a2540'; g.fillRect(0, SH, W, 2);

// ---------- 音（その場で鳴らす・録画用に書き出す の両方で使う） ----------
function schedule(ac, out, at0) {
  const nb = ac.createBuffer(1, ac.sampleRate, ac.sampleRate), nd = nb.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = hash(i, 9) * 2 - 1;
  SC.forEach(sc => sc.snd.forEach(([T, f, dur, type, vol, f2]) => {
    const s = at0 + sc.t0 + T, gn = ac.createGain();
    gn.gain.setValueAtTime(vol, s); gn.gain.exponentialRampToValueAtTime(.0001, s + dur);
    let src;
    if (type === 'noise') { src = ac.createBufferSource(); src.buffer = nb; src.loop = true; }
    else { src = ac.createOscillator(); src.type = type; src.frequency.setValueAtTime(f, s); if (f2) src.frequency.exponentialRampToValueAtTime(f2, s + dur); }
    src.connect(gn).connect(out); src.start(s); src.stop(s + dur + .02);
  }));
}
// 録画用：音を WAV（base64）にして返す
window.renderWav = async function () {
  const rate = 44100, ac = new OfflineAudioContext(1, Math.ceil(rate * TOTAL), rate);

  const buf = new DataView(new ArrayBuffer(44 + d.length * 2)), ws = (o, s) => [...s].forEach((c, i) => buf.setUint8(o + i, c.charCodeAt(0)));
  ws(0, 'RIFF'); buf.setUint32(4, 36 + d.length * 2, true); ws(8, 'WAVEfmt '); buf.setUint32(16, 16, true); buf.setUint16(20, 1, true); buf.setUint16(22, 1, true);
  buf.setUint32(24, rate, true); buf.setUint32(28, rate * 2, true); buf.setUint16(32, 2, true); buf.setUint16(34, 16, true); ws(36, 'data'); buf.setUint32(40, d.length * 2, true);
  for (let i = 0; i < d.length; i++) buf.setInt16(44 + i * 2, cl(d[i], -1, 1) * 32767, true);
  let bin = ''; const u8 = new Uint8Array(buf.buffer);
  for (let i = 0; i < u8.length; i += 32768) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 32768));
  return btoa(bin);
};

// ---------- 再生 ----------
const playBtn = document.getElementById('playBtn'), bar = document.getElementById('bar');
let ac = null, bus = null, start = -1;
function stop() {
  start = -1; playBtn.textContent = '▶ 再生';
  if (bus) { const b = bus; b.gain.setTargetAtTime(0, ac.currentTime, .02); setTimeout(() => b.disconnect(), 200); bus = null; }
}
playBtn.addEventListener('click', () => {
  if (start >= 0) { stop(); return; }
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume();
    bus = ac.createGain(); bus.connect(ac.destination);
    start = ac.currentTime + .1; schedule(ac, bus, start);
  } catch (e) { ac = null; start = performance.now() / 1000; }
  playBtn.textContent = '■ とめる';
});
const now = () => ac ? ac.currentTime : performance.now() / 1000;
function loop() {
  const T = start >= 0 ? now() - start : 0;
  if (start >= 0 && T >= TOTAL) stop();
  render(start >= 0 ? Math.max(0, T) : 1.6 + (performance.now() / 1000 % 3.4));
  bar.style.width = `${start >= 0 ? cl(T / TOTAL) * 100 : 0}%`;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
