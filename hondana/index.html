<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="講話の本棚">
<title>講話の本棚</title>
<meta name="description" content="講話や録音の要点を、アイコンを押してすぐ読める本棚">
<link rel="apple-touch-icon" href="icon-180.png?v=1">
<link rel="manifest" href="hondana.webmanifest?v=1">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f8f4ee">
<link rel="icon" href="icon-180.png?v=1">
<style>
  :root { --bg:#f8f4ee; --card:#ffffff; --line:#eadfce; --fg:#2b2622; --sub:#7a7068; --accent:#b8682a; --soft:#f2e4d6; --wood:#8a5a32; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
         padding: calc(14px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); min-height: 100vh; }
  .wrap { max-width: 480px; margin: 0 auto; }
  button { font-family: inherit; color: var(--fg); cursor: pointer; }
  h1 { font-size: 20px; font-weight: 700; margin: 0 0 4px; letter-spacing: .06em; position: relative; text-align: center; }
  #ccTitle { position: absolute; left: 26px; top: 50%; transform: translateY(-58%); width: 24px; height: 26px; image-rendering: pixelated; }
  .sub { font-size: 12px; color: var(--sub); margin: 0 0 8px; text-align: center; }
  .links { margin: 0 0 12px; text-align: center; }
  .links a { font-size: 13px; color: var(--accent); text-decoration: none; }
  h2 { font-size: 13px; font-weight: 700; color: var(--sub); margin: 18px 0 8px; letter-spacing: .06em; }
  .hero { display: flex; gap: 14px; align-items: center; width: 100%; padding: 14px; text-align: left; background: var(--card); border: 2px solid var(--accent); border-radius: 12px; }
  .hero img { width: 84px; height: 84px; border-radius: 18px; flex-shrink: 0; }
  .hero div { min-width: 0; }
  .hero b { display: block; font-size: 17px; line-height: 1.4; margin-bottom: 3px; }
  .hero span { display: block; font-size: 12px; line-height: 1.6; color: var(--sub); }
  .hero em { display: inline-block; margin-top: 7px; font-style: normal; font-size: 13px; color: #fff; background: var(--accent); border-radius: 99px; padding: 4px 16px; }
  .shelf { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 8px; padding: 14px 8px 12px; background: var(--card); border: 1px solid var(--line); border-bottom: 6px solid var(--wood); border-radius: 12px 12px 4px 4px; }
  .book { display: flex; flex-direction: column; align-items: center; gap: 5px; background: none; border: none; padding: 0; min-width: 0; position: relative; }
  .book img { width: 100%; max-width: 68px; aspect-ratio: 1; border-radius: 16px; box-shadow: 0 2px 4px rgba(90, 60, 30, .3); }
  .book:active img { transform: scale(.94); }
  .book .n { font-size: 11px; line-height: 1.25; text-align: center; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .book .dot { position: absolute; top: -3px; right: calc(50% - 38px); width: 12px; height: 12px; border-radius: 50%; background: #e0523f; border: 2px solid var(--card); }
  .note { font-size: 11px; color: var(--sub); text-align: center; margin: 8px 0 0; }
  .reader { position: fixed; inset: 0; background: var(--bg); z-index: 20; display: none; flex-direction: column; }
  .reader.on { display: flex; }
  .reader .bar { display: flex; align-items: center; gap: 8px; padding: calc(6px + env(safe-area-inset-top)) 10px 6px; border-bottom: 1px solid var(--line); background: var(--card); }
  .reader .bar button { background: var(--soft); border: 1.5px solid var(--accent); border-radius: 8px; padding: 6px 12px; font-size: 13px; flex-shrink: 0; }
  .reader .bar span { flex: 1; min-width: 0; font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reader iframe { flex: 1; width: 100%; border: none; background: var(--bg); }
</style>
</head>
<body>
<div class="wrap">
  <h1><canvas id="ccTitle" width="48" height="52" aria-hidden="true"></canvas>講話の本棚</h1>
  <p class="sub">アイコンを押すと、すぐ読めます</p>
  <p class="links"><a href="../tana/">🎬 動画棚へ</a></p>

  <h2>新着</h2>
  <div id="hero"></div>

  <h2>本棚</h2>
  <div class="shelf" id="shelf"></div>
  <p class="note">赤い点：まだ読んでいない本</p>
</div>

<div class="reader" id="reader">
  <div class="bar"><button id="backBtn">◀ 本棚にもどる</button><span id="readTitle"></span></div>
  <iframe id="frame" title="本"></iframe>
</div>

<script>
// ---------- 本棚に並べるもの（作った順。新しい本を作ったら、いちばん下に1行足す） ----------
// [場所, 名前, アイコンの下の短い名前, ひとこと, アイコン]
const BOOKS = [
  ['https://aaiuioo-maker.github.io/kouwa/', '地上天国の建設と「真の感謝」', '講話の要点', '信仰の本当の目的と実践を呼びかけた講話', 'kouwa.png?v=1'],
  ['../heiwa/', '広島平和美術館と新文明', '平和美術館', '新しい文明への歩みをまとめた録音の要点', 'heiwa.png?v=1'],
];

const KEY = 'hondanaRead';
let read = [];
try { read = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function render() {
  const n = BOOKS[BOOKS.length - 1];
  document.getElementById('hero').innerHTML = `<button class="hero" data-i="${BOOKS.length - 1}"><img src="${n[4]}" alt=""><div><b>${esc(n[1])}</b><span>${esc(n[3])}</span><em>読む</em></div></button>`;
  document.getElementById('shelf').innerHTML = BOOKS.map((b, i) =>
    `<button class="book" data-i="${i}" aria-label="${esc(b[1])}"><img src="${b[4]}" alt=""><span class="n">${esc(b[2])}</span>${read.includes(b[0]) ? '' : '<i class="dot"></i>'}</button>`).join('');
}

const reader = document.getElementById('reader'), frame = document.getElementById('frame');
function openBook(b) {
  if (!read.includes(b[0])) { read.push(b[0]); try { localStorage.setItem(KEY, JSON.stringify(read)); } catch (e) {} render(); }
  document.getElementById('readTitle').textContent = b[1];
  frame.src = b[0];
  reader.classList.add('on'); document.body.style.overflow = 'hidden';
  try { history.pushState({ read: 1 }, ''); } catch (e) {}
}
function closeBook() { reader.classList.remove('on'); document.body.style.overflow = ''; frame.removeAttribute('src'); }
document.addEventListener('click', e => { const t = e.target.closest('[data-i]'); if (t) openBook(BOOKS[+t.dataset.i]); });
document.getElementById('backBtn').onclick = () => { if (history.state && history.state.read) history.back(); else closeBook(); };
window.addEventListener('popstate', () => { if (reader.classList.contains('on')) closeBook(); });
render();

// ---------- タイトルの左のオレンジのキャラクター（歩く） ----------
(function titleMascot() {
  const c = document.getElementById('ccTitle'), g = c.getContext('2d'), q = 4, oy = 5;
  function draw(now) {
    const t = now / 1000 / 1.4;
    const R = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(Math.round(x * q), Math.round(y * q), Math.round(w * q), Math.round(h * q)); };
    g.clearRect(0, 0, c.width, c.height);
    const col = '#d97757', f = Math.floor(t * 6) % 4, hop = f % 2 ? -1 : 0;
    const up = [f === 1, f === 3, f === 3, f === 1];
    [2, 4, 7, 9].forEach((x, i) => R(x, oy + 6, 1, up[i] ? 1 : 2, col));
    const y0 = oy + hop;
    R(2, y0, 8, 6, col); R(0, y0 + 2, 2, 2, col); R(10, y0 + 2, 2, 2, col);
    const blink = (t % 3) > 2.85;
    R(3, y0 + 1 + (blink ? .6 : 0), 1, blink ? .4 : 1, '#1a1612'); R(8, y0 + 1 + (blink ? .6 : 0), 1, blink ? .4 : 1, '#1a1612');
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
