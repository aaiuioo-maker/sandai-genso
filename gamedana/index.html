<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ゲーム棚">
<title>ゲーム棚</title>
<meta name="description" content="ゲームや楽しいアプリを、アイコンを押してすぐ開ける棚">
<link rel="apple-touch-icon" href="icon-180.png?v=1">
<link rel="manifest" href="gamedana.webmanifest?v=1">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f8f4ee">
<link rel="icon" href="icon-180.png?v=1">
<style>
  :root { --bg:#f8f4ee; --card:#ffffff; --line:#eadfce; --fg:#2b2622; --sub:#7a7068; --accent:#b8682a; --soft:#f2e4d6; --wood:#8a5a32; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
         padding: calc(14px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); min-height: 100vh; }
  .wrap { max-width: 480px; margin: 0 auto; }
  button { font-family: inherit; color: var(--fg); cursor: pointer; }
  h1 { font-size: 20px; font-weight: 700; margin: 0 0 4px; letter-spacing: .06em; position: relative; text-align: center; }
  #ccTitle { position: absolute; left: 26px; top: 50%; transform: translateY(-58%); width: 24px; height: 26px; image-rendering: pixelated; }
  .sub { font-size: 12px; color: var(--sub); margin: 0 0 16px; text-align: center; }
  .shelf { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px 8px; padding: 16px 8px 14px; background: var(--card); border: 1px solid var(--line); border-bottom: 6px solid var(--wood); border-radius: 12px 12px 4px 4px; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: none; padding: 0; min-width: 0; }
  .app img { width: 100%; max-width: 68px; aspect-ratio: 1; border-radius: 16px; box-shadow: 0 2px 4px rgba(90, 60, 30, .3); background: var(--soft); }
  .app:active img { transform: scale(.94); }
  .app .n { font-size: 11px; line-height: 1.25; text-align: center; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player { position: fixed; inset: 0; background: var(--bg); z-index: 20; display: none; flex-direction: column; }
  .player.on { display: flex; }
  .player .bar { display: flex; align-items: center; gap: 8px; padding: calc(6px + env(safe-area-inset-top)) 10px 6px; border-bottom: 1px solid var(--line); background: var(--card); }
  .player .bar button { background: var(--soft); border: 1.5px solid var(--accent); border-radius: 8px; padding: 6px 12px; font-size: 13px; flex-shrink: 0; }
  .player .bar span { flex: 1; min-width: 0; font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player iframe { flex: 1; width: 100%; border: none; background: var(--bg); }
</style>
</head>
<body>
<div class="wrap">
  <h1><canvas id="ccTitle" width="48" height="52" aria-hidden="true"></canvas>ゲーム棚</h1>
  <p class="sub">アイコンを押すと、すぐ開きます</p>
  <div class="shelf" id="shelf"></div>
</div>

<div class="player" id="player">
  <div class="bar"><button id="backBtn">◀ 棚にもどる</button><span id="appTitle"></span></div>
</div>

<script>
// ---------- 棚に並べるもの（新しいアプリを入れるときは、いちばん下に1行足す） ----------
// [場所, 名前, アイコン]
const APPS = [
  ['../madori-3d/', '間取り3D', '../madori-3d/icon-180.png'],
  ['../madori-kirei/', '間取りきれい版', '../madori-kirei/icon-180.png'],
  ['../madori-shashin/', '間取り写真版', '../madori-shashin/icon-180.png'],
  ['../madori-aruku/', '歩ける間取り', '../madori-aruku/icon-180.png'],
  ['../madori-sanpo/', 'わが家さんぽ', '../madori-sanpo/icon-180.png'],
  ['../seiyu/', '声の一覧', '../seiyu/icon-180.png'],
  ['../henji/', 'お返事', '../henji/icon-180.png'],
  ['../hitokoto/', '今日の一言', '../hitokoto/icon-180.png'],
  ['../mitama/', 'みたまのぼり', '../mitama/icon-180.png'],
  ['../inochi/', 'いのちの花', '../inochi/icon-180.png'],
  ['https://aaiuioo-maker.github.io/kinmu-shitei/ugoki-check.html', '動きの確認', 'https://aaiuioo-maker.github.io/kinmu-shitei/ugoki-app-180.png'],
  ['../hanashi/', '話し方道場', '../hanashi/icon-180.png'],
];

const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
document.getElementById('shelf').innerHTML = APPS.map((a, i) =>
  `<button class="app" data-i="${i}" aria-label="${esc(a[1])}"><img src="${a[2]}" alt=""><span class="n">${esc(a[1])}</span></button>`).join('');

const player = document.getElementById('player');
let frame = null;
function openApp(a) {
  document.getElementById('appTitle').textContent = a[1];
  // 開くたびに iframe を作り直す（話し方道場の録音が使えるようにマイクも許可する）
  if (frame) frame.remove();
  frame = document.createElement('iframe');
  frame.title = a[1];
  frame.allow = 'autoplay; microphone; fullscreen';
  frame.src = a[0];
  player.appendChild(frame);
  player.classList.add('on'); document.body.style.overflow = 'hidden';
  try { history.pushState({ app: 1 }, ''); } catch (e) {}
}
function closeApp() { player.classList.remove('on'); document.body.style.overflow = ''; if (frame) { frame.remove(); frame = null; } }
document.getElementById('shelf').addEventListener('click', e => { const t = e.target.closest('[data-i]'); if (t) openApp(APPS[+t.dataset.i]); });
document.getElementById('backBtn').onclick = closeApp;
window.addEventListener('popstate', () => { if (player.classList.contains('on')) closeApp(); });

// ---------- タイトルの左のオレンジのキャラクター（歩く） ----------
(function titleMascot() {
  const c = document.getElementById('ccTitle'), g = c.getContext('2d'), q = 4, oy = 5;
  function draw(now) {
    const t = now / 1000 / 1.4;
    const R = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(Math.round(x * q), Math.round(y * q), Math.round(w * q), Math.round(h * q)); };
    g.clearRect(0, 0, c.width, c.height);
    const col = '#d97757', f = Math.floor(t * 6) % 4, hop = f % 2 ? -1 : 0;
    const up = [f === 1, f === 3, f === 3, f === 1];
    [2, 4, 7, 9].forEach((x, i) => R(x, oy + 6, 1, up[i] ? 1 : 2, col));
    const y0 = oy + hop;
    R(2, y0, 8, 6, col); R(0, y0 + 2, 2, 2, col); R(10, y0 + 2, 2, 2, col);
    const blink = (t % 3) > 2.85;
    R(3, y0 + 1 + (blink ? .6 : 0), 1, blink ? .4 : 1, '#1a1612'); R(8, y0 + 1 + (blink ? .6 : 0), 1, blink ? .4 : 1, '#1a1612');
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
