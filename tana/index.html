<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="動画棚">
<title>動画棚</title>
<link rel="apple-touch-icon" href="icon-180.png?v=1">
<link rel="manifest" href="tana.webmanifest?v=1">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05040d">
<link rel="icon" href="icon-180.png?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root { --bg:#05040d; --fg:#f3ead6; --accent:#d97757; --card:#12101f; --line:#2a2540; --dim:#b0a8c8; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  /* iPhone で ほかの画面から戻ったときなどに、文字が勝手に大きくならないようにする */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { font-family: "DotGothic16", sans-serif; padding: calc(12px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom)); min-height: 100vh; }
  .wrap { max-width: 480px; margin: 0 auto; }
  button { font-family: inherit; color: var(--fg); cursor: pointer; }
  /* タイトルは真ん中。オレンジのキャラクターは左はしに小さく（動画と同じ） */
  h1 { font-size: 18px; font-weight: 400; margin: 0 0 4px; letter-spacing: .08em; position: relative; text-align: center; }
  #ccTitle { position: absolute; left: 36px; top: 50%; transform: translateY(-58%); width: 24px; height: 26px; image-rendering: pixelated; }
  .sub { font-size: 11px; opacity: .6; margin: 0 0 14px; text-align: center; }
  h2 { font-size: 13px; font-weight: 400; color: #8a84a8; margin: 18px 0 8px; letter-spacing: .08em; }
  /* 新着：いちばん新しい動画を大きく */
  .hero { display: flex; gap: 14px; align-items: center; padding: 14px; background: linear-gradient(135deg, #2a1a30, #12101f); border: 2px solid var(--accent); border-radius: 10px; }
  .hero img { width: 84px; height: 84px; border-radius: 18px; image-rendering: pixelated; flex-shrink: 0; }
  .hero .k { font-size: 11px; color: var(--accent); }
  .hero b { display: block; font-weight: 400; font-size: 17px; color: #ffcf8a; margin: 2px 0 4px; }
  .hero span { display: block; font-size: 11px; color: var(--dim); }
  .hero .play { margin-top: 8px; }
  .play { font-size: 14px; background: var(--accent); color: #05040d; border: none; border-radius: 99px; padding: 6px 18px; }
  .play:active { transform: translateY(1px); }
  /* 棚：アイコンを4つずつ並べる */
  .shelf { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 8px; padding: 14px 8px 10px; background: var(--card); border: 2px solid var(--line); border-radius: 10px; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 5px; background: none; border: none; padding: 0; min-width: 0; position: relative; }
  .app img { width: 100%; max-width: 68px; aspect-ratio: 1; border-radius: 16px; image-rendering: pixelated; box-shadow: 0 2px 0 #000; }
  .app:active img { transform: scale(.94); }
  .app .n { font-size: 10.5px; line-height: 1.25; text-align: center; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .app .dot { position: absolute; top: -3px; right: calc(50% - 38px); min-width: 10px; height: 10px; border-radius: 99px; background: #ff5a5a; border: 2px solid var(--card); }
  .app .dot.newl { height: auto; font-size: 8px; color: #fff; padding: 1px 4px; background: var(--accent); }
  .note { font-size: 10px; color: #8a84a8; text-align: center; margin-top: 8px; }
  /* 並べかえ */
  .head { display: flex; align-items: center; justify-content: space-between; margin: 18px 0 8px; }
  .head h2 { margin: 0; }
  .head button { font-size: 12px; background: #1c1930; border: 2px solid #3a3358; border-radius: 6px; padding: 3px 10px; color: var(--dim); }
  .head button.on { border-color: var(--accent); color: var(--fg); }
  .playrow { display: flex; gap: 6px; margin: -2px 0 10px; }
  .playrow button { flex: 1; min-width: 0; font-size: 12px; background: #1c1930; border: 2px solid var(--accent); border-radius: 6px; padding: 5px 4px; white-space: nowrap; }
  .playrow.hide { display: none; }
  .sortbox { display: none; flex-direction: column; gap: 6px; }
  .sortbox.on { display: flex; }
  .sortbox .row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: var(--card); border: 2px solid var(--line); border-radius: 8px; font-size: 13px; }
  .sortbox .row.moved { border-color: var(--accent); }
  .sortbox .row img { width: 36px; height: 36px; border-radius: 8px; image-rendering: pixelated; }
  .sortbox .row span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sortbox .row button { width: 36px; height: 32px; font-size: 14px; background: #1c1930; border: 2px solid #5a5478; border-radius: 6px; padding: 0; flex-shrink: 0; }
  .sortbox .row button:disabled { opacity: .3; }
  .sortbox .row button.rm { border-color: #8a3a3a; }
  .sortbox .reset { font-size: 12px; background: none; border: 2px dashed #3a3358; border-radius: 8px; padding: 6px; color: var(--dim); }
  .shelf.hide { display: none; }
  /* 削除 */
  .sheet .del { display: block; width: 100%; margin-top: 14px; padding: 8px; background: none; border: 2px solid #8a3a3a; border-radius: 8px; font-size: 13px; color: #ff8a8a; }
  .trash { display: block; margin: 10px auto 0; font-size: 12px; background: none; border: 2px dashed #3a3358; border-radius: 8px; padding: 5px 12px; color: var(--dim); }
  .trash.hide { display: none; }
  .sheet .hrow { display: flex; align-items: center; gap: 10px; padding: 6px 8px; background: var(--card); border: 2px solid var(--line); border-radius: 8px; font-size: 13px; margin-top: 8px; }
  .sheet .hrow img { width: 36px; height: 36px; border-radius: 8px; image-rendering: pixelated; }
  .sheet .hrow span { flex: 1; min-width: 0; }
  .sheet .hrow button, .sheet .allback { background: #1c1930; border: 2px solid var(--accent); border-radius: 6px; padding: 4px 10px; font-size: 12px; }
  .sheet .allback { display: block; width: 100%; margin-top: 12px; padding: 7px; }
  .sheet h3 { font-weight: 400; font-size: 15px; color: #ffcf8a; margin: 0 0 4px; }
  .sheet .hint { font-size: 11px; color: var(--dim); margin: 0; }
  /* 説明のシート（下から出る） */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
  .sheet-bg.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 480px; background: #16132a; border: 2px solid var(--line); border-bottom: none;
           border-radius: 16px 16px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .25s; z-index: 11; max-height: 85vh; overflow-y: auto; }
  .sheet.on { transform: none; }
  .sheet .top { display: flex; gap: 14px; align-items: center; }
  .sheet .top img { width: 96px; height: 96px; border-radius: 20px; image-rendering: pixelated; flex-shrink: 0; }
  .sheet .top b { display: block; font-weight: 400; font-size: 18px; color: #ffcf8a; }
  .sheet .top span { display: block; font-size: 11px; color: var(--dim); margin: 3px 0 8px; }
  .sheet .desc { font-size: 13px; line-height: 1.6; margin: 14px 0 6px; }
  .sheet .facts { display: flex; border: 2px solid var(--line); border-radius: 8px; margin-top: 10px; }
  .sheet .facts div { flex: 1; text-align: center; padding: 6px 2px; font-size: 10px; color: #8a84a8; }
  .sheet .facts div + div { border-left: 2px solid var(--line); }
  .sheet .facts em { display: block; font-style: normal; font-size: 13px; color: var(--fg); margin-top: 2px; }
  .sheet .parts { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .sheet .parts button { display: flex; align-items: center; gap: 10px; text-align: left; padding: 8px 10px; background: var(--card); border: 2px solid var(--line); border-radius: 8px; font-size: 13px; }
  .sheet .parts img { width: 40px; height: 40px; border-radius: 9px; image-rendering: pixelated; }
  .sheet .parts small { display: block; font-size: 10px; color: var(--dim); }
  .sheet .close { display: block; width: 100%; margin-top: 14px; padding: 8px; background: #1c1930; border: 2px solid #3a3358; border-radius: 8px; font-size: 13px; color: var(--dim); }
  /* 再生の画面：棚の中で動画を開く */
  .player { position: fixed; inset: 0; background: var(--bg); z-index: 20; display: none; flex-direction: column; }
  .player.on { display: flex; }
  .player .bar { display: flex; align-items: center; gap: 8px; padding: calc(6px + env(safe-area-inset-top)) 10px 6px; border-bottom: 2px solid var(--line); background: #0d0b18; }
  .player .bar button { background: #1c1930; border: 2px solid var(--accent); border-radius: 6px; padding: 5px 12px; font-size: 13px; flex-shrink: 0; }
  .player .bar span { flex: 1; min-width: 0; font-size: 13px; color: #ffcf8a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player .bar .cont { border-color: #3a3358; color: #8a84a8; }
  .player .bar .cont.on { border-color: #6fe0a0; color: #6fe0a0; }
  .player iframe { flex: 1; width: 100%; border: none; background: var(--bg); }
</style>
</head>
<body>
<div class="wrap">
  <h1><canvas id="ccTitle" width="48" height="52" aria-hidden="true"></canvas>動画棚</h1>
  <p class="sub">ドット絵の動画を えらんで再生（声と音が出ます）</p>

  <div id="heroArea"><h2>新着</h2>
  <div id="hero"></div></div>

  <div class="head"><h2>動画</h2><button id="sortBtn">⇅ 並べかえ・削除</button></div>
  <div class="playrow" id="playRow"><button id="allBtn">▶ 全部 続けて</button><button id="rndBtn">🔀 ランダム</button><button id="newBtn">🆕 新しい順</button></div>
  <div class="shelf" id="shelf"></div>
  <div class="sortbox" id="sortBox"></div>
  <p class="note" id="note">赤い点：まだ見ていない動画</p>
  <button class="trash" id="trashBtn"></button>

</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

<div class="player" id="player">
  <div class="bar"><button id="backBtn">◀ 棚にもどる</button><span id="playTitle"></span><button id="contBtn" class="cont">🔁 連続</button></div>
  <iframe id="frame" title="動画" allow="autoplay"></iframe>
</div>

<script>
// ---------- 棚に並べるもの（作った順。新しい動画を作ったら、いちばん下に1行足す） ----------
// [場所, 名前, アイコンの下の短い名前, ひとこと, 説明, 長さ, 作った日]
const APPS = [
  ['../', '三大元素といのち', '三大元素', '火素・水素・土素', '火・水・土の三つの元素と、いのちのはたらき。', '約1分半', '10/22'],
  ['../shuchaku/', '我と執着', '我と執着', '争いのもと・霊的成長・機を待つ', '我（が）と執着が争いのもとになること、執着を離れて霊的に成長し、機を待つこと。', '約1分半', '10/23'],
  ['../hodo/', '程（ほど）', '程', '人間万事 この一字にあり', '何事も「程」が大切。山岡鉄舟の額の書「程」とともに。', '約1分半', '10/23'],
  ['../taiyo/', '太陽の救い', '太陽の救い', '常識と自由の「超宗教」', '迷惑な信仰・信仰地獄・常識と超宗教・天国的信仰・太陽の救い の5つの場面。', '約1分半', '10/24'],
  ['../jiki/', '時期を待て', '時期を待て', '時節には 神も敵わぬぞよ', 'あせらず、時期を待つことの大切さ。', '約3分', '10/25'],
  ['../sonen/', '人間は想念次第', '想念次第', '喜べば 喜び事が来る', '人間の運命は想念しだい。喜べば喜び事が来る。', '約3分', '10/25'],
  ['../sanson/', '三尊の弥陀', '三尊の弥陀', '観音・阿弥陀・釈迦の 三位一体', '観音・阿弥陀・釈迦の三尊が三位一体であること。3つの動画に分かれていて、全部まとめても見られます。', '約3分', '10/25', [
    ['../sanson/bunrui/', '① 三尊の分類', '日本・西洋・東洋／日・月・地／火・水・土（約1分）'],
    ['../sanson/sugata/', '② 三尊のお姿', '直毛と縮れ毛・王冠と白布・純金と唐銅（約1分）'],
    ['../sanson/sanjin/', '③ 三尊と三身', '法身は阿弥陀・報身は釈迦・応身は観音（約1分）'],
    ['../sanson/zenbu/', '①②③ 全部まとめて', '3つを続けて見る（約3分）'],
  ]],
  ['../shu/', '主の字', '主の字', '万物の 正しい順序', '「主」の字が表す、万物の正しい順序。', '約2分半', '10/25'],
  ['../kannon/', '観音力とは何ぞや', '観音力', '火と水の十字・五六七・十八', '火と水の十字、五六七（ミロク）、十八 から観音力を説く。', '約3分', '10/25'],
  ['../shugo/', '守護神', '守護神', '本守護神・副守護神・正守護神', '本守護神・副守護神・正守護神と、心の善悪のしくみ。', '約3分', '10/26'],
  ['../jinzo/', '本医術の施法', '本医術', '腎臓の毒を溶かし 全身を浄化', '腎臓の毒結を溶かして尿として出し、全身を浄化する「腎臓医術」。', '約3分', '10/26'],
  ['../meishin/', '三大迷信とは何か', '三大迷信', '薬剤・肥料・法律の 三つの迷信', '薬剤迷信・肥料迷信・法律迷信。誤りだらけの文明を正し、新しい文明を創る。', '約3分半', '10/26'],
  ['../saijoka/', '信仰の合理性と再浄化', '再浄化', '感謝を 行動で示す 合理的な信仰', '病が治ったあとの「再浄化」のわけ、神様への借金と督促状、救われた命は神有物、信仰の筋道と正しい順序。', '約4分半', '10/28'],
  ['../risshun/', '立春と国常立尊', '立春', '押し込められた神が 世に出る日', '立春の意義、押し込められた国常立尊（艮の金神）と閻魔大王・観世音菩薩、夜昼転換と最後の審判、節分の「鬼は外」はあべこべ。', '約11分半', '10/28'],
  ['../sandoku/', '三毒とは', '三毒', '然毒・尿毒・薬毒 の三つの毒', '先祖から受け継ぐ然毒（天然痘・遺伝梅毒の誤認）、腎臓から出きらない余剰尿の尿毒（溜結・歯槽膿漏）、薬が生む薬毒（発熱・痛み・洋薬と漢方薬の痛みのちがい）。', '約3分', '10/28'],
  ['../toho/', '東方の光', '東方の光', '東の東に生まれ 西へ西へ', '西から東へ伝わった文化の限界、日蓮と鋸山の神事という霊的な夜明け、東京・浅草橋場に生まれ西へ十回移った著者の歩み、九州・支那を経てエルサレムに地上天国を築き世界を統一する予言、濁水を押し返す水晶世界。（一）（二）をまとめて1つに。', '約4分', '10/29'],
  ['../yakudoku/', '薬毒', '薬毒', '病気は浄化・薬は毒', '病気は毒を出す浄化作用、薬はそれを止める毒。薬を絶てば病人は半減し天寿を全うできる。著者の断薬の体験と、薬毒の三つの悪影響（不快感・頭脳が鈍る・動作が緩慢）。', '約3分半', '10/29'],
  ['../anshin/', '安心立命', '安心立命', '病なく 貧なく 争いなし', '真の安心立命は精神だけでなく、病気・貧乏・争いの三つの災厄がない状態。細菌の恐怖に縛られた現代社会、貧乏や争いの根本にある病気、そして病気を克服し世を救うために現れた救世教。', '約2分半', '10/29'],
  ['../reisen/', '霊線に就いて', '霊線', '目に見えない 魂の糸', '人と人、霊界、神仏、物までを結ぶ見えない糸「霊線」。関係の深さと感情で変わる太さ、霊線を通じて伝わる想いと情念、守護霊の危険信号、指導者の魂が多くの人に及ぼす影響。だから常に魂を清らかに。', '約3分半', '10/29'],
  ['../omakase/', '御任せする', '御任せ', '心配を手放し 神様に委ねる', '心配も一種の「執着」。欲望や恨み、取り越し苦労や後悔も執着で、神様の御守護の邪魔になる。欲しい時は手に入らず、生に執着すると病は悪化し、熱烈すぎると相手は冷める「皮肉の皮肉」。執着を捨てて頼り切れば、神様は責任を持って助けてくださる。', '約3分', '10/30'],
];

// ---------- 見た動画を覚えておく（この端末だけ） ----------
let seen = {};
try { seen = JSON.parse(localStorage.getItem('tanaSeen') || '{}') || {}; } catch (e) {}
function markSeen(h) { seen[h] = 1; try { localStorage.setItem('tanaSeen', JSON.stringify(seen)); } catch (e) {} }

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const icon = h => h + 'icon-180.png';
const NEWEST = APPS[APPS.length - 1];

// ---------- 棚から削除した動画（この端末だけ。あとで もどせる） ----------
let hidden = [];
try { hidden = JSON.parse(localStorage.getItem('tanaHidden') || '[]') || []; } catch (e) {}
function saveHidden() { try { localStorage.setItem('tanaHidden', JSON.stringify(hidden)); } catch (e) {} }
const isHidden = a => hidden.includes(a[0]);

// ---------- 棚をつくる ----------
// ---------- 並び順（並べかえた順番をこの端末で覚える。新しく足した動画は最後に入る） ----------
let order = [];
try { order = JSON.parse(localStorage.getItem('tanaOrder') || '[]') || []; } catch (e) {}
function ordered() {
  const by = h => APPS.find(a => a[0] === h);
  const list = [...new Set(order)].map(by).filter(Boolean);
  APPS.forEach(a => { if (!list.includes(a)) list.push(a); });
  return list.filter(a => !isHidden(a));
}
function saveOrder(list) { order = list.map(a => a[0]).concat(order.filter(h => hidden.includes(h))); try { localStorage.setItem('tanaOrder', JSON.stringify(order)); } catch (e) {} }
let shown = [];
function renderShelf(id, list) {
  shown = list;
  document.getElementById(id).innerHTML = list.map((a, i) => {
    const dot = seen[a[0]] ? '' : a === NEWEST ? '<i class="dot newl">NEW</i>' : '<i class="dot"></i>';
    return `<button class="app" data-i="${i}"><img src="${icon(a[0])}" alt="">${dot}<span class="n">${esc(a[2])}</span></button>`;
  }).join('');
}
function renderAll() {
  renderShelf('shelf', ordered());
  // 新着：削除していない中で いちばん新しい動画
  const top = [...APPS].reverse().find(a => !isHidden(a));
  document.getElementById('heroArea').style.display = top ? '' : 'none';
  if (top) {
    document.getElementById('hero').innerHTML =
      `<div class="hero"><img src="${icon(top[0])}" alt=""><div><span class="k">いちばん新しい動画</span><b>${esc(top[1])}</b><span>${esc(top[3])}（${esc(top[5])}）</span><button class="play" id="heroPlay">▶ 再生</button></div></div>`;
    document.getElementById('heroPlay').onclick = () => { queue = null; rndVoice = false; play(top[0], top[1]); };
  }
  if (!ordered().length) document.getElementById('shelf').innerHTML = '<p class="note" style="grid-column:1/-1">棚に動画がありません</p>';
  const tb = document.getElementById('trashBtn');
  tb.textContent = `🗑 削除した動画（${hidden.length}本）を もどす`; tb.classList.toggle('hide', !hidden.length);
}
renderAll();
document.querySelectorAll('.shelf').forEach(s => s.addEventListener('click', e => {
  const b = e.target.closest('.app'); if (!b) return;
  const a = shown[+b.dataset.i];
  if (a[7]) openSheet(a); else { queue = null; rndVoice = false; play(a[0], a[1]); }
}));

// ---------- 並べかえ：▲▼ で1つずつ動かす ----------
const sortBtn = document.getElementById('sortBtn'), sortBox = document.getElementById('sortBox');
let sorting = false, lastMoved = '';
function renderSort() {
  const list = ordered();
  sortBox.innerHTML = list.map((a, i) =>
    `<div class="row${a[0] === lastMoved ? ' moved' : ''}"><img src="${icon(a[0])}" alt=""><span>${i + 1}. ${esc(a[1])}</span>` +
    `<button data-m="${i}" data-d="-1" ${i === 0 ? 'disabled' : ''} aria-label="上へ">▲</button><button data-m="${i}" data-d="1" ${i === list.length - 1 ? 'disabled' : ''} aria-label="下へ">▼</button><button class="rm" data-rm="${i}" aria-label="削除">🗑</button></div>`).join('') +
    `<button class="reset" id="resetBtn">作った順に もどす</button>`;
  document.getElementById('resetBtn').onclick = () => { saveOrder(APPS); lastMoved = ''; renderSort(); };
}
sortBox.addEventListener('click', e => {
  const rm = e.target.closest('button[data-rm]');
  if (rm) {
    const a = ordered()[+rm.dataset.rm];
    if (confirm(`「${a[1]}」を棚から削除しますか？\n（あとで「削除した動画を もどす」で戻せます）`)) { hidden.push(a[0]); saveHidden(); renderAll(); renderSort(); }
    return;
  }
  const b = e.target.closest('button[data-m]'); if (!b) return;
  const list = ordered(), i = +b.dataset.m, j = i + +b.dataset.d;
  if (j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]]; lastMoved = list[j][0];
  saveOrder(list); renderSort();
});
sortBtn.onclick = () => {
  sorting = !sorting; lastMoved = '';
  sortBtn.textContent = sorting ? '✓ できた' : '⇅ 並べかえ・削除'; sortBtn.classList.toggle('on', sorting);
  document.getElementById('shelf').classList.toggle('hide', sorting); document.getElementById('playRow').classList.toggle('hide', sorting); sortBox.classList.toggle('on', sorting);
  document.getElementById('note').textContent = sorting ? '▲▼ で順番を入れかえ、🗑 で棚から削除できます（この端末で覚えます）' : '赤い点：まだ見ていない動画';
  if (sorting) renderSort(); else renderAll();
};

// ---------- 説明のシート ----------
const sheet = document.getElementById('sheet'), sheetBg = document.getElementById('sheetBg');
function openSheet(a) {
  const [h, name, , one, desc, len, date, parts] = a;
  sheet.innerHTML =
    `<div class="top"><img src="${icon(h)}" alt=""><div><b>${esc(name)}</b><span>${esc(one)}</span>` +
    (parts ? '' : `<button class="play" id="sheetPlay">▶ 再生</button>`) + `</div></div>` +
    `<div class="facts">` +
      `<div>長さ<em>${esc(len)}</em></div><div>声<em>4人</em></div>` +
      `<div>作った日<em>${esc(date)}</em></div></div>` +
    `<p class="desc">${esc(desc)}</p>` +
    (parts ? `<div class="parts">${parts.map((p, i) => `<button data-p="${i}"><img src="${icon(p[0])}" alt=""><div>${esc(p[1])}<small>${esc(p[2])}</small></div></button>`).join('')}</div>` : '') +
    `<button class="del" id="sheetDel">🗑 棚から削除</button>` +
    `<button class="close" id="sheetClose">とじる</button>`;
  const sp = document.getElementById('sheetPlay'); if (sp) sp.onclick = () => { queue = null; rndVoice = false; play(h, name); };
  sheet.querySelectorAll('.parts button').forEach(b => b.onclick = () => { const p = parts[+b.dataset.p]; queue = null; rndVoice = false; play(p[0], p[1], h); });
  document.getElementById('sheetDel').onclick = () => {
    if (!confirm(`「${name}」を棚から削除しますか？\n（あとで「削除した動画を もどす」で戻せます）`)) return;
    hidden.push(h); saveHidden(); closeSheet(); renderAll(); if (sorting) renderSort();
  };
  document.getElementById('sheetClose').onclick = closeSheet;
  sheet.classList.add('on'); sheetBg.classList.add('on'); sheet.scrollTop = 0;
}
// 削除した動画の一覧：1つずつ、または全部 もどす
function openTrash() {
  const list = APPS.filter(isHidden);
  if (!list.length) { closeSheet(); return; }
  sheet.innerHTML = `<h3>削除した動画</h3><p class="hint">もどすと、また棚に並びます</p>` +
    list.map(a => `<div class="hrow"><img src="${icon(a[0])}" alt=""><span>${esc(a[1])}</span><button data-h="${esc(a[0])}">もどす</button></div>`).join('') +
    `<button class="allback" id="allBack">全部 もどす</button><button class="close" id="sheetClose">とじる</button>`;
  sheet.querySelectorAll('.hrow button').forEach(b => b.onclick = () => { hidden = hidden.filter(x => x !== b.dataset.h); saveHidden(); renderAll(); if (sorting) renderSort(); openTrash(); });
  document.getElementById('allBack').onclick = () => { hidden = []; saveHidden(); renderAll(); if (sorting) renderSort(); closeSheet(); };
  document.getElementById('sheetClose').onclick = closeSheet;
  sheet.classList.add('on'); sheetBg.classList.add('on'); sheet.scrollTop = 0;
}
document.getElementById('trashBtn').onclick = openTrash;
function closeSheet() { sheet.classList.remove('on'); sheetBg.classList.remove('on'); }
sheetBg.onclick = closeSheet;

// ---------- 再生：棚の中で動画のページを開く（もどると棚に戻る） ----------
const player = document.getElementById('player');
let frameEl = document.getElementById('frame');
// 動画ごとに新しい iframe に入れかえる（src を変えると「もどる」の履歴が増えて、棚に戻れなくなるため）
function newFrame(h) {
  const f = document.createElement('iframe');
  f.id = 'frame'; f.title = '動画'; f.setAttribute('allow', 'autoplay');
  if (h) { f.src = h; f.addEventListener('load', () => { tightTop(f); autoStart(f); }); }
  frameEl.replaceWith(f); frameEl = f;
}
// 棚の中で見るときは、動画のページの上のすき間（画面上の切り欠きの分）をつめる。上の「もどる」の帯がすでに空けているため
function tightTop(f) {
  try {
    const d = f.contentDocument, s = d.createElement('style');
    s.textContent = 'body { padding-top: 4px !important; }';
    d.head.appendChild(s); f.contentWindow.scrollTo(0, 0);
  } catch (e) {}
}
// cur：いま再生している棚の動画（三尊の弥陀の①②③のときも、棚の「三尊の弥陀」）
let cur = '', ending = 0;
// ---------- 音：棚で押したときに音の出口を1つ開けておき、どの動画もそこから鳴らす ----------
// iPhone は、画面を押していないときに新しく音を鳴らし始められない。そのため連続再生で次の動画に進むと
// 「再生する」を押すまで音が出なかった。最初に押したときの音の出口を使い回せば、次の動画もそのまま鳴る
let pac = null, bus = null;
function unlockAudio() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  try {
    if (!pac) pac = new (window.AudioContext || window.webkitAudioContext)();
    pac.resume();
    const s = pac.createBufferSource(); s.buffer = pac.createBuffer(1, 1, 22050); s.connect(pac.destination); s.start(0);
  } catch (e) {}
}
// 動画のページの AudioContext を、棚の音の出口に差しかえる。動画ごとに音量のつまみ（bus）を分け、
// 次の動画や棚に戻ったときは前の動画のつまみを外して、前の声や音楽が残らないようにする
function shareAudio(w) {
  dropBus();
  if (!pac) return;
  const my = bus = pac.createGain(); my.connect(pac.destination);
  const ctx = new Proxy(pac, {
    get(t, k) { if (k === 'destination') return my; const v = Reflect.get(t, k); return typeof v === 'function' ? v.bind(t) : v; },
    set() { return true; },
  });
  const Ctx = function () { return ctx; };
  w.AudioContext = Ctx; w.webkitAudioContext = Ctx;
}
function dropBus() { try { if (bus) bus.disconnect(); } catch (e) {} bus = null; }

function play(h, name, shelfH) {
  unlockAudio();
  closeSheet(); markSeen(shelfH || h); renderAll();
  cur = shelfH || h; ending = 0; clearTimeout(nextTimer);
  dropBus(); // 前の動画の音を すぐ止める
  document.getElementById('playTitle').textContent = name;
  newFrame(h);
  const was = player.classList.contains('on');
  player.classList.add('on'); document.body.style.overflow = 'hidden';
  if (!was) try { history.pushState({ play: 1 }, ''); } catch (e) {}
}

// ---------- 連続再生：動画が終わったら、棚の並び順で次の動画を自動で始める ----------
let cont = true;
try { cont = localStorage.getItem('tanaCont') !== '0'; } catch (e) {}
const contBtn = document.getElementById('contBtn');
function showCont() { contBtn.textContent = cont ? '🔁 連続 ON' : '🔁 連続 OFF'; contBtn.classList.toggle('on', cont); }
contBtn.onclick = () => {
  cont = !cont; showCont(); try { localStorage.setItem('tanaCont', cont ? '1' : '0'); } catch (e) {}
  if (!cont && ending) { clearTimeout(nextTimer); ending = 0; document.getElementById('playTitle').textContent = nameOf(cur); }
};
showCont();
const nameOf = h => (APPS.find(a => a[0] === h) || [, ''])[1];
// 続けて見る順番（「ランダムに 続けて」「新しい順から 続けて」のとき。ふだんは棚の並び順）
let queue = null;
// 「全部 続けて」「ランダム」「新しい順」で見るときは、声も全員からランダムにする（1本だけ選んだときは、その動画で選んだ声のまま）
let rndVoice = false;
// 次の動画（三尊の弥陀は「全部まとめて」を流す）
function nextOf(h) {
  const list = queue || ordered(), i = list.findIndex(a => a[0] === h);
  return i >= 0 ? list[i + 1] : null;
}
function playApp(a) { if (a[7]) { const z = a[7][a[7].length - 1]; play(z[0], a[1], a[0]); } else play(a[0], a[1]); }
let nextTimer = 0;
setInterval(() => {
  if (!player.classList.contains('on') || ending) return;
  let done = false;
  try { done = frameEl.contentWindow.eval('running && !playing && pos >= TOTAL'); } catch (e) {}
  if (!done) return;
  ending = 1;
  const n = nextOf(cur), title = document.getElementById('playTitle');
  if (!cont) return;
  if (!n) { title.textContent = '全部 見終わりました'; return; }
  let s = 5;
  const tick = () => {
    if (!ending) return;
    if (s <= 0) { playApp(n); return; }
    title.textContent = `次は「${n[1]}」… ${s}`; s--;
    nextTimer = setTimeout(tick, 1000);
  };
  tick();
}, 500);
// 続けて見る：渡された順番で、最初の動画から
function playList(list, q) {
  if (!list.length) return;
  if (!cont) { cont = true; showCont(); try { localStorage.setItem('tanaCont', '1'); } catch (e) {} }
  queue = q ? list : null; rndVoice = true;
  playApp(list[0]);
}
// 全部 続けて：棚のいちばん上から
document.getElementById('allBtn').onclick = () => playList(ordered(), false);
// ランダムに 続けて：棚の動画を まぜた順番で
document.getElementById('rndBtn').onclick = () => {
  const list = ordered();
  for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
  playList(list, true);
};
// 新しい順から 続けて：いちばん新しく作った動画から、古いほうへ
document.getElementById('newBtn').onclick = () => playList([...APPS].reverse().filter(a => !isHidden(a)), true);
// 動画のページが開いたら、その「▶ 再生する」を自動で押す。
// iPhone などで音が出せない（音の準備が止まったまま）ときは、止めて「▶ 再生する」を出したままにする（1回押せば再生）
function autoStart(f) {
  const w = f.contentWindow; if (!w || f !== frameEl || !player.classList.contains('on')) return;
  try {
    shareAudio(w);
    const go = () => {
      const btn = w.document.getElementById('startBtn'); if (!btn) return;
      // 続けて見るときは、声をランダムに（この端末に覚えている声の選びかたは変えない）
      if (rndVoice) try { w.eval("if (typeof ENGINES !== 'undefined') { vset = 2; makeNameBtns(); showVoice(); useVoices().forEach(loadVoice); }"); } catch (e) {}
      btn.click();
      setTimeout(() => {
        try {
          if (w.eval('ac && ac.state') === 'running') return;
          w.eval("playing = false; stopSpeak(); bgmOn(false); document.getElementById('startBox').classList.remove('hide')");
        } catch (e) {}
      }, 700);
    };
    // 字の準備ができてから（動画のページの最初の一枚と同じ）
    Promise.race([w.document.fonts.ready, new Promise(r => setTimeout(r, 1500))]).then(go);
  } catch (e) {}
}
function stopPlay() {
  dropBus();
  ending = 0; clearTimeout(nextTimer);
  player.classList.remove('on'); document.body.style.overflow = '';
  newFrame(''); // iframe ごと消して、声と音を止める
}
document.getElementById('backBtn').onclick = () => { if (history.state && history.state.play) history.back(); else stopPlay(); };
window.addEventListener('popstate', () => { if (player.classList.contains('on')) stopPlay(); });

// ---------- タイトルの左のオレンジのキャラクター（歩く） ----------
(function titleMascot() {
  const c = document.getElementById('ccTitle'), g = c.getContext('2d'), q = 4, oy = 5;
  function draw(now) {
    const t = now / 1000 / 1.4;
    const R = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(Math.round(x * q), Math.round(y * q), Math.round(w * q), Math.round(h * q)); };
    g.clearRect(0, 0, c.width, c.height);
    const col = '#d97757', f = Math.floor(t * 6) % 4, hop = f % 2 ? -1 : 0;
    const up = [f === 1, f === 3, f === 3, f === 1];
    [2, 4, 7, 9].forEach((x, i) => R(x, oy + 6, 1, up[i] ? 1 : 2, col));
    const y0 = oy + hop;
    R(2, y0, 8, 6, col); R(0, y0 + 2, 2, 2, col); R(10, y0 + 2, 2, 2, col);
    const blink = (t % 3) > 2.85;
    R(3, y0 + 1 + (blink ? .6 : 0), 1, blink ? .4 : 1, '#1a1612'); R(8, y0 + 1 + (blink ? .6 : 0), 1, blink ? .4 : 1, '#1a1612');
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>

e.style.cssText='display:block;width:100%;text-align:center;font:11px/1.4 sans-serif;color:inherit;opacity:.6;margin-top:10px;pointer-events:none;';
