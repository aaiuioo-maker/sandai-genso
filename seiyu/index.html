<style>
  :root { --bg:#05040d; --fg:#f3ead6; --accent:#d97757; --card:#12101f; --line:#2a2540; --sub:#8a84a8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  /* iPhone で ほかの画面から戻ったときなどに、文字が勝手に大きくならないようにする */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { font-family: "DotGothic16", sans-serif; display: flex; flex-direction: column; align-items: center;
         padding: calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); min-height: 100vh; }
  .wrap { width: 100%; max-width: 480px; }
  h1 { font-size: 20px; font-weight: 400; margin: 4px 0 4px; letter-spacing: .08em; text-align: center; }
  .sub { font-size: 12px; color: var(--sub); margin: 0 0 12px; text-align: center; line-height: 1.6; }
  .back { display: inline-block; font-size: 13px; color: #ffcf8a; text-decoration: none; margin-bottom: 6px; }
  h2 { font-size: 15px; font-weight: 400; margin: 18px 0 8px; display: flex; align-items: baseline; gap: 8px; }
  h2 small { font-size: 11px; color: var(--sub); }
  .grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .card { background: var(--card); border: 2px solid var(--line); border-radius: 6px; padding: 8px 10px; display: flex; gap: 12px; align-items: center; min-width: 0; }
  .card.on { border-color: var(--accent); }
  .card canvas { width: 49px; height: 56px; image-rendering: pixelated; flex-shrink: 0; }
  .who { min-width: 0; flex: 1; }
  .who b { display: block; font-weight: 400; font-size: 15px; }
  .who span { display: block; font-size: 11px; color: var(--sub); line-height: 1.5; overflow-wrap: anywhere; }
  .who .no { color: #ffcf8a; }
  button { font-family: inherit; color: var(--fg); background: #1c1930; border: 2px solid #5a5478; border-radius: 6px; cursor: pointer; }
  button:active { transform: translateY(1px); }
  .card button { font-size: 14px; padding: 8px 14px; flex-shrink: 0; }
  .card.on button { border-color: var(--accent); color: #ffcf8a; }
  .note { font-size: 11px; color: var(--sub); line-height: 1.7; margin: 18px 0 0; }
</style>
</head>

  見本の声は、トップの動画「三大元素といのち」の最初の字幕です。<br>
  ドット絵は この動画のために描いたもので、本物のキャラクターとは見た目がちがうことがあります。</p>

});

const audio = new Audio();
let curCard = null;
function stop() { audio.pause(); if (curCard) { curCard.classList.remove('on'); curCard.querySelector('button').textContent = '▶'; } curCard = null; }
audio.onended = stop;
document.querySelectorAll('.card button').forEach(b => b.onclick = () => {
  const card = b.closest('.card'), was = card === curCard;
  stop(); if (was) return;
  curCard = card; card.classList.add('on'); b.textContent = '■';
  audio.src = '../' + card.dataset.dir + '/00.mp3?v=' + KOE_V;
  audio.play().catch(stop);
});
