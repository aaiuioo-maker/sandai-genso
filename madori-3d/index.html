.brk{flex-basis:100%;height:0}

.shot #bar,.shot #hint{display:none}

 document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));draw()}
function draw(){const c=Math.cos(orb.el);camera.position.set(orb.t.x+orb.r*c*Math.sin(orb.az),orb.t.y+orb.r*Math.sin(orb.el),orb.t.z+orb.r*c*Math.cos(orb.az));camera.lookAt(orb.t);
 // 文字は近づいても大きくなりすぎないようにする（画面で高さ23pxまで）
 const k=2*Math.tan(camera.fov*Math.PI/360)/Math.max(innerHeight,1);labels.forEach(s=>{s.getWorldPosition(labelPos);const h=Math.min(s.userData.h,camera.position.distanceTo(labelPos)*k*23);s.scale.set(h*s.userData.a,h,1)});
 renderer.render(scene,camera)}
function size(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.fov=w<h?46:28;camera.updateProjectionMatrix();draw()}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>setView(b.dataset.v));
const el=renderer.domElement,pts=new Map();let mode='pan';
const setMode=m=>{mode=m;document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===m))};
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>setMode(b.dataset.m));setMode('pan');
const zoom=f=>{orb.r=Math.min(60,Math.max(1.2,orb.r*f))};
// 指の動きに合わせて、見ている場所を床の上で動かす
function pan(dx,dy){const k=2*orb.r*Math.tan(camera.fov*Math.PI/360)/Math.max(innerHeight,1),s=Math.sin(orb.az),c=Math.cos(orb.az),g=k/Math.max(Math.sin(orb.el),.35);
 orb.t.x+=-dx*k*c-dy*g*s;orb.t.z+=dx*k*s-dy*g*c;
 orb.t.x=Math.min(view==='both'?GAP+6:6.5,Math.max(-3,orb.t.x));orb.t.z=Math.min(12,Math.max(-4,orb.t.z))}
const rotate=(dx,dy)=>{orb.az-=dx*.006;orb.el=Math.min(1.56,Math.max(.05,orb.el+dy*.005))};
el.oncontextmenu=e=>e.preventDefault();
el.onpointerdown=e=>{el.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY])};
el.onpointermove=e=>{const p=pts.get(e.pointerId);if(!p)return;
 if(pts.size>=2){const [a,b]=[...pts.values()];pts.set(e.pointerId,[e.clientX,e.clientY]);const [c,d]=[...pts.values()],n0=Math.hypot(a[0]-b[0],a[1]-b[1]),n1=Math.hypot(c[0]-d[0],c[1]-d[1]);if(n0>0&&n1>0)zoom(n0/n1);pan((c[0]+d[0]-a[0]-b[0])/2,(c[1]+d[1]-a[1]-b[1])/2);draw();return}
 const dx=e.clientX-p[0],dy=e.clientY-p[1];pts.set(e.pointerId,[e.clientX,e.clientY]);
 ((mode==='pan')!==(e.shiftKey||e.buttons===2)?pan:rotate)(dx,dy);draw()};
el.onpointerup=el.onpointercancel=e=>{pts.delete(e.pointerId)};
el.addEventListener('wheel',e=>{e.preventDefault();zoom(1+e.deltaY*.001);draw()},{passive:false});
document.getElementById('zin').onclick=()=>{zoom(.75);draw()};
document.getElementById('zout').onclick=()=>{zoom(1/.75);draw()};
document.getElementById('reset').onclick=()=>setView(view);
addEventListener('resize',size);setView(view);size();if(shot)setTimeout(size,400);
</script>
