<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="代引計算">
<title>代引 送金額計算</title>
<meta name="theme-color" content="#f6f1e7">
<style>
  :root { --bg:#f6f1e7; --card:#fff; --fg:#222; --blue:#1d3f9e; --red:#d0312d; --mute:#777; --line:#c9d3ef; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; padding: calc(12px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
  main { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 4px 0 12px; color: var(--blue); text-align: center; }
  .card { background: var(--card); border: 2px solid var(--blue); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .yen { display: flex; align-items: center; gap: 6px; }
  input[type=text] { width: 100%; font-size: 24px; padding: 8px 10px; border: 1px solid #aaa; border-radius: 6px; text-align: right; font-variant-numeric: tabular-nums; }
  .tax { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tax label { font-weight: 400; font-size: 13px; display: flex; align-items: center; gap: 4px; margin: 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; }
  #taxManualWrap { margin-top: 8px; display: none; }
  #taxManualWrap input { font-size: 18px; }
  .row { padding: 10px 0; border-top: 1px dashed var(--line); }
  .row:first-child { border-top: none; padding-top: 0; }
  .head { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; }
  .head b { color: var(--blue); }
  .val { font-size: 15px; font-variant-numeric: tabular-nums; }
  .boxes { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0; margin-top: 6px; border: 1px solid var(--blue); }
  .boxes div { text-align: center; border-left: 1px dashed var(--line); }
  .boxes div:first-child { border-left: none; }
  .boxes small { display: block; font-size: 10px; color: var(--mute); border-bottom: 1px solid var(--line); }
  .boxes span { display: block; font-size: 22px; height: 34px; line-height: 34px; font-variant-numeric: tabular-nums; }
  .send .boxes span { color: var(--red); font-weight: 700; }
  .stamp { margin-top: 6px; font-size: 14px; }
  .chk { display: inline-block; width: 20px; height: 20px; border: 1.5px solid var(--blue); text-align: center; line-height: 18px; color: var(--red); font-weight: 700; margin-right: 4px; vertical-align: middle; }
  .warn { color: var(--red); font-size: 13px; margin-top: 8px; }
  .note { font-size: 12px; color: var(--mute); line-height: 1.6; }
  .note p { margin: 4px 0; }
</style>
</head>
<body>
<main>
  <h1>ゆうパック 代金引換 計算</h1>

  <div class="card">
    <label for="amount">① 引換金額（A）＝ お客さまから受け取る金額</label>
    <div class="yen"><input id="amount" type="text" inputmode="numeric" placeholder="0" autocomplete="off"><span>円</span></div>
    <div class="tax" id="taxModes">
      <label><input type="radio" name="tax" value="10" checked>税込 10%</label>
      <label><input type="radio" name="tax" value="8">税込 8%（軽減）</label>
      <label><input type="radio" name="tax" value="0">消費税なし</label>
      <label><input type="radio" name="tax" value="manual">税額を自分で入力</label>
    </div>
    <div id="taxManualWrap">
      <div class="yen"><input id="taxManual" type="text" inputmode="numeric" placeholder="② 消費税額等" autocomplete="off"><span>円</span></div>
    </div>
  </div>

  <div class="card" id="result">
    <div class="row send">
      <div class="head"><b>④ 送金額（A－B）</b><span class="val" id="vSend"></span></div>
      <div class="boxes" id="bSend"></div>
    </div>
    <div class="row">
      <div class="head"><b>① 引換金額（A）</b><span class="val" id="vA"></span></div>
      <div class="boxes" id="bA"></div>
    </div>
    <div class="row">
      <div class="head"><b>② 引換金額に含む消費税額等</b><span class="val" id="vTax"></span></div>
      <div class="boxes" id="bTax"></div>
    </div>
    <div class="row">
      <div class="head"><b>③ 印紙代（B）</b><span class="val" id="vB"></span></div>
      <div class="stamp" id="stamp"></div>
    </div>
    <div class="warn" id="warn"></div>
  </div>

  <div class="note">
    <p>・消費税額は 税込金額 ×10/110（8%なら ×8/108）を計算し、1円未満は切り捨てています。</p>
    <p>・印紙代は「①－②」が 5万円以上なら 200円、100万円を超えると 400円 です（5万円未満は 0円）。</p>
    <p>・④送金額 ＝ ①引換金額 －③印紙代。代引手数料は送金額から差し引かれません。</p>
    <p>・引換金額の上限は 30万円（セキュリティゆうパックは 200万円）です。</p>
  </div>
</main>
<script>
  const PLACES = ['百万','十万','万','千','百','十','円'];
  const $ = id => document.getElementById(id);
  const toNum = s => {
    const t = (s || '').replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[^0-9]/g, '');
    return t === '' ? null : parseInt(t, 10);
  };
  const fmt = n => n.toLocaleString('ja-JP') + ' 円';

  function boxes(el, n) {
    // 用紙と同じく右づめ。先頭の空き欄は空白のまま
    const s = n == null ? '' : String(n);
    const pad = PLACES.length - s.length;
    el.innerHTML = PLACES.map((p, i) => `<div><small>${p}</small><span>${i >= pad ? s[i - pad] : ''}</span></div>`).join('');
  }

  // 入力欄にカンマを付ける
  function commaInput(el) {
    el.addEventListener('input', () => {
      const n = toNum(el.value);
      el.value = n == null ? '' : n.toLocaleString('ja-JP');
      calc();
    });
  }

  function calc() {
    const A = toNum($('amount').value);
    const mode = document.querySelector('input[name=tax]:checked').value;
    $('taxManualWrap').style.display = mode === 'manual' ? 'block' : 'none';
    const warn = [];

    if (A == null) {
      ['vSend','vA','vTax','vB'].forEach(id => $(id).textContent = '');
      ['bSend','bA','bTax'].forEach(id => boxes($(id), null));
      $('stamp').innerHTML = '';
      $('warn').textContent = '';
      return;
    }

    let tax;
    if (mode === 'manual') tax = toNum($('taxManual').value) || 0;
    else if (mode === '0') tax = 0;
    else { const r = parseInt(mode, 10); tax = Math.floor(A * r / (100 + r)); }
    if (tax > A) warn.push('消費税額が引換金額より大きくなっています。');

    const base = A - tax;
    const B = base > 1000000 ? 400 : base >= 50000 ? 200 : 0;
    const send = A - B;

    $('vA').textContent = fmt(A);   boxes($('bA'), A);
    $('vTax').textContent = fmt(tax); boxes($('bTax'), tax);
    $('vB').textContent = fmt(B);
    $('vSend').textContent = fmt(send); boxes($('bSend'), Math.max(send, 0));
    $('stamp').innerHTML = B === 0
      ? '<span class="chk"></span>（①－② が 5万円未満なので レ印 は不要）'
      : `<span class="chk">✓</span>${B}円 にレ印（①－② ＝ ${base.toLocaleString('ja-JP')}円）`;

    if (A > 2000000) warn.push('引換金額の上限（200万円）を超えています。');
    else if (A > 300000) warn.push('30万円を超えるのでセキュリティゆうパックにする必要があります（用紙左上にレ印）。');
    if (String(A).length > 7) warn.push('用紙の欄（7けた）に入りません。');
    $('warn').textContent = warn.join(' ');
  }

  commaInput($('amount'));
  commaInput($('taxManual'));
  document.querySelectorAll('input[name=tax]').forEach(r => r.addEventListener('change', calc));
  calc();
</script>
</body>
</html>
