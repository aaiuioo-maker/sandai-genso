<style>
  :root { --bg:#05040d; --fg:#f3ead6; --accent:#d97757; --card:#12101f; --line:#2a2540; --dim:#b0a8c8; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font-family: "DotGothic16", sans-serif; padding: calc(12px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom)); min-height: 100vh; }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 18px; font-weight: 400; margin: 0 0 4px; letter-spacing: .08em; text-align: center; }
  .sub { font-size: 11px; opacity: .6; margin: 0 0 14px; text-align: center; }
  /* 大きく見る：えらんだ1体を大きく出す */
  .stage { display: flex; flex-direction: column; align-items: center; padding: 14px 0 10px; background: linear-gradient(135deg, #2a1a30, #12101f); border: 2px solid var(--accent); border-radius: 10px; margin-bottom: 14px; }
  .stage canvas { width: 128px; height: 192px; image-rendering: pixelated; }
  .stage b { font-weight: 400; font-size: 17px; color: #ffcf8a; margin-top: 8px; }
  .stage span { font-size: 11px; color: var(--dim); min-height: 1em; }
  /* 一覧：4つずつ並べる */
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 6px; padding: 14px 8px 10px; background: var(--card); border: 2px solid var(--line); border-radius: 10px; }
  .grid button { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; padding: 4px 0; color: var(--fg); font-family: inherit; cursor: pointer; border-radius: 8px; }
  .grid button.on { background: #2a2540; }
  .grid canvas { width: 48px; height: 72px; image-rendering: pixelated; }
  .grid small { font-size: 10px; line-height: 1.2; text-align: center; }
  .grid small i { font-style: normal; color: var(--dim); display: block; }
</style>
</head>

  <div class="grid" id="grid"></div>

// まばたき：目の上の段をはだの色にして、下の段だけ残す
function draw(ctx, c, blink, hop) {
  ctx.clearRect(0, 0, 16, 26);
  c.m.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === '.') return;
    let col = c.p[ch];
    if (ch === 'E' && blink && c.m[y + 1] && c.m[y + 1][x] === 'E') col = c.p.S || col;
    ctx.fillStyle = col; ctx.fillRect(x, y + 2 - hop, 1, 1);
  }));
}
const grid = document.getElementById('grid'), big = document.getElementById('big').getContext('2d');
const cells = CH.map((c, i) => {
  const b = document.createElement('button');
  const cv = document.createElement('canvas'); cv.width = 16; cv.height = 26;
  b.append(cv);
  const s = document.createElement('small'); s.textContent = c.n;
  if (c.v === 36) { const v = document.createElement('i'); v.textContent = '36巻'; s.append(v); }
  b.append(s);
  b.onclick = () => pick(i);
  grid.append(b);
  return { b, ctx: cv.getContext('2d'), off: Math.random() * 3 };
});
let cur = 0, jumpAt = -9;
function pick(i) {
  cur = i; jumpAt = performance.now() / 1000;
  cells.forEach((c, j) => c.b.classList.toggle('on', j === i));
  document.getElementById('bigName').textContent = CH[i].n;
  document.getElementById('bigVol').textContent = CH[i].v === 36 ? '36巻のすがた' : '12巻';
}
pick(0);
function frame() {
  const t = performance.now() / 1000;
  cells.forEach((c, i) => draw(c.ctx, CH[i], (t + c.off) % 3.2 > 3.05, 0));
  const dt = t - jumpAt, hop = dt < .5 ? Math.round(Math.sin(dt / .5 * Math.PI) * 2) : (Math.floor(t * 2) % 2);
  draw(big, CH[cur], t % 3.2 > 3.05, hop);
  requestAnimationFrame(frame);
}
frame();
