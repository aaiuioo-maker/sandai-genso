<style>
  :root { --bg:#05040d; --fg:#f3ead6; --accent:#d97757; --card:#12101f; --line:#2a2540; --dim:#b0a8c8; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font-family: "DotGothic16", sans-serif; padding: calc(12px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom)); min-height: 100vh; }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 18px; font-weight: 400; margin: 0 0 4px; letter-spacing: .08em; text-align: center; }
  .sub { font-size: 11px; opacity: .6; margin: 0 0 14px; text-align: center; }
  /* 変身する舞台：オレンジのキャラクターが光って、えらんだ1体に変わる */
  .stage { display: flex; flex-direction: column; align-items: center; padding: 10px 0 12px; background: linear-gradient(135deg, #2a1a30, #12101f); border: 2px solid var(--accent); border-radius: 10px; margin-bottom: 14px; }
  .stage canvas { width: 240px; height: 200px; image-rendering: pixelated; cursor: pointer; }
  .stage b { font-weight: 400; font-size: 17px; color: #ffcf8a; margin-top: 4px; min-height: 1.3em; }
  .stage span { font-size: 11px; color: var(--dim); min-height: 1.2em; }
  .btns { display: flex; gap: 8px; margin-top: 10px; }
  .btns button { font-family: inherit; font-size: 13px; border: none; border-radius: 99px; padding: 6px 14px; cursor: pointer; }
  #auto { background: var(--accent); color: #05040d; }
  #back { background: #2a2540; color: var(--fg); }
  /* 一覧：4つずつ並べる */
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 6px; padding: 14px 8px 10px; background: var(--card); border: 2px solid var(--line); border-radius: 10px; }
  .grid button { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; padding: 4px 0; color: var(--fg); font-family: inherit; cursor: pointer; border-radius: 8px; }
  .grid button.on { background: #2a2540; }
  .grid canvas { width: 60px; height: 60px; image-rendering: pixelated; }
  .grid small { font-size: 10px; line-height: 1.2; text-align: center; }
  .grid small i { font-style: normal; color: var(--dim); display: block; }
</style>
</head>
<body>
<div class="wrap">

  <p class="sub">オレンジのキャラクターが 12巻・36巻の表紙の20体に へんしん</p>

    <canvas id="big" width="48" height="40"></canvas>

  </div>
  <div class="grid" id="grid"></div>
</div>

// まばたき：目の上の段を、その下の色（体の色）にする
function px(c, x, y, blink) {
  const ch = c.m[y][x];
  if (ch === '.') return null;
  if (ch === 'E' && blink && c.m[y + 1] && c.m[y + 1][x] === 'E') return c.p.O;
  return c.p[ch];
}
function drawAt(ctx, c, ox, oy, blink, rowFrom = 0, rowTo = 24) {
  for (let y = rowFrom; y < rowTo; y++) for (let x = 0; x < 24; x++) {
    const col = px(c, x, y, blink); if (!col) continue;
    ctx.fillStyle = col; ctx.fillRect(ox + x, oy + y, 1, 1);
  }
}
const grid = document.getElementById('grid'), cv = document.getElementById('big'), big = cv.getContext('2d');
const cells = CH.map((c, i) => {
  const b = document.createElement('button');
  const g = document.createElement('canvas'); g.width = 24; g.height = 24; b.append(g);
  const s = document.createElement('small'); s.textContent = c.n;
  if (c.v === 36) { const v = document.createElement('i'); v.textContent = '36巻'; s.append(v); }
  b.append(s); b.onclick = () => { stopAuto(); henshin(i); };
  grid.append(b);
  return { b, ctx: g.getContext('2d'), off: Math.random() * 3 };
});

// ---------- へんしんの音（押したときだけ鳴らす） ----------
let ac = null;
function tone(f, at, dur, type, vol, f2) {
  const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + at;
  o.type = type; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + dur + .02);
}
function sfx() {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume();
    tone(220, 0, .35, 'square', .04, 880);                                   // ぴょん
    [784, 988, 1175, 1568].forEach((f, i) => tone(f, .4 + i * .06, .25, 'triangle', .06)); // きらきら
    [523, 659, 784, 1047].forEach((f, i) => tone(f, .9 + i * .05, .5, 'square', .025));   // じゃーん
  } catch (e) {}
}

// ---------- へんしん ----------
// 0〜0.4秒：オレンジのキャラがとび上がる → 0.4〜1.0秒：光って、下から上へ服と髪が変わる → 着地
let cur = -1, startAt = -9, prev = -1;
function henshin(i) {
  prev = cur; cur = i; startAt = performance.now() / 1000; sfx();
  cells.forEach((c, j) => c.b.classList.toggle('on', j === i));
  document.getElementById('bigName').textContent = i < 0 ? '' : CH[i].n;
  document.getElementById('bigVol').textContent = i < 0 ? 'おして へんしん！' : CH[i].v === 36 ? '36巻のすがた' : '12巻';
}
cv.onclick = () => { stopAuto(); henshin((cur + 1) % CH.length); };
document.getElementById('back').onclick = () => { stopAuto(); if (cur >= 0) henshin(-1); };
let autoT = null;
function stopAuto() { if (autoT) { clearInterval(autoT); autoT = null; document.getElementById('auto').textContent = 'じゅんばんに へんしん'; } }
document.getElementById('auto').onclick = () => {
  if (autoT) return stopAuto();
  henshin((cur + 1) % CH.length);
  autoT = setInterval(() => henshin((cur + 1) % CH.length), 2600);
  document.getElementById('auto').textContent = 'とめる';
};
document.getElementById('bigVol').textContent = 'おして へんしん！';

const sparks = [...Array(14)].map((_, i) => ({ a: i / 14 * 6.283, r: 10 + (i % 3) * 3 }));
function frame() {
  const t = performance.now() / 1000;
  cells.forEach((c, i) => { c.ctx.clearRect(0, 0, 24, 24); drawAt(c.ctx, CH[i], 0, 0, (t + c.off) % 3.2 > 3.05); });
  big.clearRect(0, 0, 48, 40);
  const dt = t - startAt, blink = t % 3.2 > 3.05, ox = 12, base = 14;
  const from = prev < 0 ? MASCOT : CH[prev], to = cur < 0 ? MASCOT : CH[cur];
  if (dt < 1.25) {
    // とび上がって、光りながら変わる
    const hop = dt < .4 ? -Math.round(Math.sin(dt / .4 * Math.PI / 2) * 10) : dt < 1.0 ? -10 : -Math.round((1 - (dt - 1.0) / .25) * 10);
    const k = Math.min(1, Math.max(0, (dt - .4) / .6)), line = Math.round(24 - k * 25); // この行より下はもう変わった
    drawAt(big, from, ox, base + hop, false, 0, Math.max(0, line));
    drawAt(big, to, ox, base + hop, false, Math.max(0, line + 1), 24);
    if (dt > .4 && dt < 1.0) {
      big.fillStyle = '#fff6c8'; big.fillRect(ox - 2, base + hop + line, 28, 1);
      big.globalAlpha = .18 * Math.sin(k * Math.PI); big.fillStyle = '#ffffff'; big.fillRect(0, 0, 48, 40); big.globalAlpha = 1;
      sparks.forEach((s, i) => {
        const a = s.a + dt * 5, r = s.r + k * 6;
        big.fillStyle = i % 2 ? '#ffe08a' : '#ffffff';
        const sx = Math.round(24 + Math.cos(a) * r), sy = Math.round(base + hop + 12 + Math.sin(a) * r * .8);
        big.fillRect(sx, sy, 1, 1); if (i % 3 === 0) { big.fillRect(sx - 1, sy, 3, 1); big.fillRect(sx, sy - 1, 1, 3); }
      });
    }
  } else {
    const bob = Math.floor(t * 2) % 2 ? -1 : 0;
    drawAt(big, to, ox, base + bob, blink);
  }
  requestAnimationFrame(frame);
}
frame();
