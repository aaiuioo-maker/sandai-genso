<style>

  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  /* iPhone で ほかの画面から戻ったときなどに、文字が勝手に大きくならないようにする */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { font-family: "DotGothic16", sans-serif; padding: calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); min-height: 100vh; }
  .wrap { max-width: 480px; margin: 0 auto; }
  button { font-family: inherit; color: var(--fg); cursor: pointer; }
  button:active { transform: translateY(1px); }
  .back { display: inline-block; font-size: 13px; color: var(--gold); text-decoration: none; margin-bottom: 6px; }
  /* タイトルは真ん中。オレンジのキャラクターは左はしに小さく（動画棚と同じ） */
  h1 { font-size: 20px; font-weight: 400; margin: 2px 0 4px; letter-spacing: .08em; position: relative; text-align: center; }
  #ccTitle { position: absolute; left: 36px; top: 50%; transform: translateY(-58%); width: 24px; height: 26px; image-rendering: pixelated; }
  .sub { font-size: 12px; color: var(--sub); margin: 0 0 14px; text-align: center; }

  /* おみくじの札 */
  .stage { position: relative; perspective: 900px; margin: 0 auto; }
  .fuda { position: relative; min-height: 340px; border-radius: 14px; transform-style: preserve-3d; transition: transform .6s; }
  .fuda.open { transform: rotateY(180deg); }
  /* 裏と表は、回って半分のところで入れかえる（裏が透けて見える端末があるため） */
  .fuda .ura { transition: visibility 0s .3s; }
  .fuda .omote { visibility: hidden; transition: visibility 0s .3s; }
  .fuda.open .ura { visibility: hidden; }
  .fuda.open .omote { visibility: visible; }
  .face { position: absolute; inset: 0; border-radius: 14px; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  /* 裏（ひく前） */
  .ura { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
         background: repeating-linear-gradient(45deg, #1a1530 0 10px, #15112a 10px 20px); border: 3px solid var(--accent); }
  .ura .mon { font-size: 40px; color: var(--gold); letter-spacing: .3em; writing-mode: vertical-rl; text-shadow: 0 2px 0 #000; }
  .ura .date { font-size: 13px; color: var(--sub); }
  .fuda.shake .ura { animation: shake .5s; }
  @keyframes shake { 0%,100% { transform: rotate(0); } 20% { transform: rotate(-4deg); } 40% { transform: rotate(4deg); } 60% { transform: rotate(-3deg); } 80% { transform: rotate(2deg); } }
  /* 表（ひいたあと） */
  .omote { transform: rotateY(180deg); background: linear-gradient(170deg, #241a33, #12101f 60%); border: 3px solid var(--accent);
           display: flex; flex-direction: column; padding: 14px 14px 12px; }
  .omote .kind { font-size: 11px; color: var(--accent); text-align: center; letter-spacing: .2em; }
  .omote .words { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; padding: 10px 2px; }
  .omote .l1 { font-size: 23px; line-height: 1.45; color: var(--gold); overflow-wrap: anywhere; }
  .omote .l2 { font-size: 19px; line-height: 1.45; margin-top: 6px; overflow-wrap: anywhere; }
  .reader { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: #0c0a18; border: 2px solid var(--line); border-radius: 10px; }
  .reader canvas { width: 42px; height: 48px; image-rendering: pixelated; flex-shrink: 0; }
  .reader .who { flex: 1; min-width: 0; font-size: 12px; color: var(--sub); }
  .reader .who b { display: block; font-weight: 400; font-size: 15px; color: var(--fg); }
  .reader button { font-size: 15px; width: 44px; height: 40px; background: #1c1930; border: 2px solid var(--accent); border-radius: 8px; flex-shrink: 0; }
  .from { display: flex; align-items: center; gap: 10px; margin-top: 8px; padding: 6px 10px; background: none; border: 2px solid var(--line); border-radius: 10px;
          width: 100%; text-align: left; text-decoration: none; color: var(--fg); }
  .from img { width: 36px; height: 36px; border-radius: 8px; image-rendering: pixelated; }
  .from span { flex: 1; min-width: 0; font-size: 12px; color: var(--sub); }
  .from span b { display: block; font-weight: 400; font-size: 14px; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .from i { font-style: normal; font-size: 12px; color: var(--gold); flex-shrink: 0; }

  .btns { display: flex; gap: 8px; margin-top: 14px; }
  .btns button { flex: 1; min-width: 0; font-size: 15px; padding: 11px 6px; border-radius: 10px; background: #1c1930; border: 2px solid #5a5478; }
  .btns .main { background: var(--accent); border-color: var(--accent); color: #05040d; }
  .btns button:disabled { opacity: .4; }
  .hint { font-size: 11px; color: var(--sub); text-align: center; margin: 8px 0 0; line-height: 1.6; }

  h2 { font-size: 13px; font-weight: 400; color: var(--sub); margin: 22px 0 8px; letter-spacing: .08em; display: flex; justify-content: space-between; align-items: center; }
  h2 button { font-size: 11px; background: none; border: 2px dashed #3a3358; border-radius: 6px; padding: 2px 8px; color: var(--sub); }
  .hist { display: flex; flex-direction: column; gap: 6px; }
  .hist button { display: flex; align-items: center; gap: 10px; text-align: left; padding: 7px 10px; background: var(--card); border: 2px solid var(--line); border-radius: 8px; width: 100%; }
  .hist img { width: 30px; height: 30px; border-radius: 7px; image-rendering: pixelated; flex-shrink: 0; }
  .hist span { flex: 1; min-width: 0; font-size: 13px; line-height: 1.4; }
  .hist small { display: block; font-size: 10px; color: var(--sub); }
  .hist .today { border-color: var(--accent); }
  .empty { font-size: 12px; color: var(--sub); text-align: center; padding: 10px; }
  .note { font-size: 11px; color: var(--sub); line-height: 1.7; margin: 18px 0 0; }
</style>

<div class="wrap">

  <h1><canvas id="ccTitle" width="48" height="52" aria-hidden="true"></canvas>きょうの一言</h1>
  <p class="sub" id="sub">動画の字幕から 一言を ひきます</p>

  <div class="stage">
    <div class="fuda" id="fuda">
      <div class="face ura"><div class="mon">一言</div><div class="date" id="date"></div></div>
      <div class="face omote">
        <div class="kind" id="kind">きょうの一言</div>
        <div class="words"><div class="l1" id="l1"></div><div class="l2" id="l2"></div></div>
        <div class="reader">
          <canvas id="face" width="14" height="16" aria-hidden="true"></canvas>
          <div class="who"><b id="who"></b><span id="whoSub"></span></div>
          <button id="againBtn" aria-label="もう一度聞く">▶</button>

        <a class="from" id="from" href="#"><img id="fromIcon" alt=""><span><b id="fromName"></b>この一言が出てくる動画</span><i>見る ▶</i></a>

    </div>

  <div class="btns">
    <button class="main" id="drawBtn">🎴 きょうの一言を ひく</button>
  </div>
  <div class="btns" id="moreRow" hidden>

    <button id="oneMoreBtn">🔀 もう1枚</button>
  </div>
  <p class="hint" id="hint">押すと 声が出ます</p>

  <h2>これまでの一言 <button id="clearBtn" hidden>消す</button></h2>
  <div class="hist" id="hist"></div>

  <p class="note">「きょうの一言」は 1日1つ。日付で決まるので、同じ日に ひくと 同じ一言が出ます。「もう1枚」は 何回でも ひけます。<br>

</div>

  [13, 15, "善悪を 立て分け", "罪穢を 清算する 最後の審判", "長年の、夜の世界、夜の時代の、善悪を、立て分け、ざいえを、清算され、つまり、最後の審判、しんぜんびの世に、立て替え、立て直して、行かれる、その時期が、いよいよ、到来したのであります。", 262143],
  [13, 16, "神権・神力を 発揮される", "節目の日が 二月四日 立春", "正しいがゆえに、長き世を、ごいんたいに、なっておられた、くにとこたちのみことが、世に出られ、善悪立て分けの、しんけん、しんりきを、いよいよ、発揮される。その節目となる日が、二月四日の、立春であり、まさしく、正しい神様の、「神界の年明け」、「光立つ春」なのであります。", 262143],
  [13, 17, "二月四日 立春祭（霊）", "六月十五日 地上天国祭（体）", "正しい神様の、しんけん、しんりきが、強化される日、二月四日、りっしゅんさいと、善悪立て分けの、浄化力たる、かそが、強化される日、六月十五日、ちじょうてんごくさいとは、地上天国と、最後の審判が、実行されるための、霊と体の、重要な、節目の日であります。", 262143],
  [13, 18, "まず 押し込めた罪を", "押し込めた神様に お詫びする", "それでは、立春に対する、我々人類の、正しい姿勢とは、いかなるもので、ありましょうか。それは、まず、「正しい神様を、押し込めた罪」を、押し込めた神様に、お詫びする事であります。", 262143],
  [13, 19, "偽悪醜に 振舞い 生きて来た", "自らと人類の 罪穢を お詫び", "物質文化、優先促進の時代とは言え、正しい神を押し込め、無神論が、はんらんする、長き夜の世界、夜の時代を、ぎあくしゅうに、振舞い生きて来た、自らの、そして、人類の、ざいえを、心より、お詫びする事であります。", 262143],
  [13, 20, "偽悪醜から 真善美へ", "自分を通して 神様を世に出す", "次に、その御詫びが、真実のものであるならば、自分自身の生活、人生を、ぎあくしゅうから、しんぜんびへと、転換させると共に、押し込めた、正しい神様を、まず、自分が迎え、つまり、ごしんたいさま、ごほうさい、今度は、自分を通して、その神様を、世に出す、すなわち、ごしんぎょう、じょうれい実践へと、立ち上がる事であります。", 262143],
  [13, 21, "年毎の 新たな決意と出発", "立春祭（霊）・地上天国祭（体）", "この、年毎の、新たな決意と、出発こそ、りっしゅんさい、霊、の意義であり、また、ちじょうてんごくさい、体、の意義なのであります。", 262143],
  [13, 22, "「福は内 鬼は外」は", "じつは あべこべ", "ここからは、めいしゅさまの、お言葉です。今日は立春で、大いに、意味があるのです。節分というものは、「福は内、鬼は外」で、ほうぼうの、神社仏閣で、豆まきを、やるのです。ところで、これは、あべこべなのです。", 262143],
  [13, 23, "鬼とは 偉い神様", "艮の金神 国常立尊", "鬼というのは、偉い神様なのです。うしとらのこんじん、くにとこたちのみこと、という神様です。今日の、ごさんかにも、「とこたちの神」というのが、ありましたが、くにとこたちのみことの事を、略して、とこたちの神と、詠んだのです。", 262143],
  [13, 24, "神代とは", "この前の 昼間の世界", "今年の節分は、非常に、意味があるのです。ごく古い、かみよ、というのですが、かみよと言っても、くうばくたるものでなくて、神格を得た人間が、住んでいた時代で、いわば、この前の、昼間の世界、といったようなものです。", 262143],
  [13, 25, "三千年前 世界を支配", "間違った事は 許さない", "三千年前、くにとこたちのみこと、という神様が、世界的に、支配していた時代が、あったのです。非常に、げんかくな神様で、間違った事は、許さない、というために、あまり厳しいので、やおよろずの神様が、とても、やりきれない、というので、押し込められたわけです。", 262143],
  [13, 26, "天若彦神が 押し込めた", "艮＝鬼門 と 忌み嫌った", "押し込めた方の神様は、あめのわかひこのかみ、というのです。それで、くにとこたちのみことを、うしとら、東北に、押し込めたのです。そこで、それを、きもんと言って、忌み嫌ったのです。人間の方が、間違った事をすれば、そういう、やかましい神様を、嫌うわけです。そうして、きもんよけと言って、いろんな事を、やったのです。", 262143],
  [13, 27, "悪い人には 恐ろしい顔", "善い人には 優しい顔", "その、うしとらのこんじん、という神様は、押し込められて、肉体の方は、無くなりましたが、霊は、霊界に行かれて、えんまだいおうに、なるのです。えんまだいおうは、罪けがれを裁く神様。本当は、しせいしちょくの神様ですから、霊界に行っても、悪い人間が見ると、恐ろしい顔に見え、心の善い人が行くと、非常に、にゅうわな、慕わしい、優しい神様の、お顔に見えるのです。", 262143],
  [13, 28, "「この世の閻魔と 現れるぞよ」", "大本教の お筆先", "おおもときょうの、おふでさきに、「うしとらのこんじんは、この世の閻魔と、現れるぞよ」と、ありますが、「この世の閻魔」という事は、現界の審判を、なされる、という事です。", 262143],
  [13, 29, "今迄は 死んだ人を審判", "今度は 生きた人間を審判", "今までは、霊界の、死んだ人を、審判されたが、今度は、現界で、生きた人間を、審判される。「この世に現れて」、というのですから、現界に現れて、審判をする、というわけです。", 262143],
  [13, 30, "陰の守護から 表の守護へ", "今日は 最後の審判の初日", "「今までは、かげの守護で、ありたが、今度は、表の守護になるぞよ」と、ありますが、すべて、現界的に、なるわけです。それで、いよいよ、直接、現界に現れる、というのが、今日からなのです。そうすると、今日は、最後の審判の、初日、というわけです。", 262143],
  [13, 31, "正しい心を 持っていれば", "有難い 善い人には結構", "恐ろしいですが、しかし、それは、こっちに、邪念があったり、曇りがあったりすると、怖いので、そうでなくて、こっちが、本当に、正しく、立派な心を持っていれば、有難いのです。今まで、悪いやつに、いじめられたり、していた。それが、いじめられなくなるから、善い人間には、非常に、結構です。", 262143],
  [13, 32, "艮の金神は 火の系統", "光が強く 隠し事が現れる", "それから、「今度は、善悪を、立て分けるぞよ」と、ありますが、うしとらのこんじん様は、火の系統の、神様ですから、非常に、光が強いのです。だから、今まで、隠していたり、いんぺいしていたものが、現れるのです。", 262143],
  [13, 33, "霊界が明るくなり 薬毒が", "はっきり 恐怖時代の一歩", "そこで、霊界が、明るくなるのです。目に見えるわけです。そこで、いろんな、そういう事が、出て来るのです。一段と、病気が、多くなります。やくどくが、段々、はっきりして来るわけです。恐怖時代の、一歩に、入ったわけでもあります。今まで、押えつけられていたのが、その、押えつける力が、弱るわけです。", 262143],

  [14, 15, "然毒・尿毒・薬毒", "これが 三毒", "まとめると、先祖から受け継ぐ、ねんどく。腎臓から出きらない、にょうどく。薬が生む、やくどく。この三つが、さんどく、であります。", 262143],

  [15, 8, "東国に生まれ 東の太陽に", "向かって 法華経を 唱えた", "にちれんは、東国に、生まれ、東の、太陽に、向かって、ほけきょうを、唱えました。", 262143],

  [15, 10, "昭和六年 鋸山の日本寺", "東方の光を 象徴する 神事", "また、昭和六年に、のこぎりやまの、にほんじで、行われた、神事も、東方からの、光を、象徴する、重大な、出来事と、されています。", 262143],

  [15, 17, "五 これからも 西へ", "九州 → 支那（中国）", "この、西へ向かう動きは、今後も続き、九州、そして、しな、つまり、中国を、経て、", 262143],

  [15, 19, "世界の 地上天国の 始まり", "そして 世界が 統一される", "世界の、地上天国の、始まりであり、それによって、世界が、統一される、というので あります。", 262143],
  [15, 20, "六 太陽は 東から 昇る", "西へ 沈むのが 大自然の法則", "太陽が、東から昇り、西へ、沈むように、東方で生まれた、真理が、西へと、進むことが、世界の、本来の姿で あります。", 262143],

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

// ---------- 日付で決まる乱数（同じ日は同じ一言） ----------
const now = new Date();
const TODAY = now.getFullYear() + '/' + (now.getMonth() + 1) + '/' + now.getDate();
const WEEK = '日月火水木金土'[now.getDay()];
function seeded(str) { let h = 2166136261; for (const c of str) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; }; }
const voicesOf = li => [...Array(18).keys()].filter(v => LINES[li][5] & (1 << v));
function pickDaily() { const r = seeded('hitokoto' + TODAY); const li = Math.floor(r() * LINES.length); const vs = voicesOf(li); return [li, vs[Math.floor(r() * vs.length)]]; }
function pickRandom(not) { let li; do { li = Math.floor(Math.random() * LINES.length); } while (LINES.length > 1 && li === not); const vs = voicesOf(li); return [li, vs[Math.floor(Math.random() * vs.length)]]; }

$('date').textContent = (now.getMonth() + 1) + '月' + now.getDate() + '日（' + WEEK + '）';
$('sub').textContent = SRC.length + '本の動画・' + LINES.length + 'の一言から ひきます';

// ---------- 読み手のドット絵（話すときは口が動く） ----------
const fg = $('face').getContext('2d');
let curV = 0, mouthOpen = false;
function drawFace() {
  const sp = SPK[curV];
  fg.clearRect(0, 0, 14, 16);
  sp.map.forEach((row, y) => [...row].forEach((ch, x) => { if (ch === '.') return; fg.fillStyle = sp.pal[ch]; fg.fillRect(x, y, 1, 1); }));
  fg.fillStyle = '#c0505a'; fg.fillRect(6, 9, 2, mouthOpen ? 2 : 1);
}

// ---------- 声 ----------
let audio = null, mouthTimer = 0;
function stopVoice() {
  if (audio) { audio.onended = null; audio.pause(); audio = null; }
  clearInterval(mouthTimer); mouthOpen = false; drawFace(); $('againBtn').textContent = '▶';
}
function speakSynth(text) { // 録音が読めなかったときは 端末の声で読む
  try { const u = new SpeechSynthesisUtterance(text); u.lang = 'ja-JP'; u.onend = stopVoice; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) { stopVoice(); }
}
function play(li, v) {
  stopVoice(); try { speechSynthesis.cancel(); } catch (e) {}
  const [si, ci, , , yomi] = LINES[li], s = SRC[si], [dir, ext] = s[4][v].split('/.');
  audio = new Audio('../' + s[0] + dir + '/' + String(ci).padStart(2, '0') + '.' + ext + '?v=' + s[3]);
  audio.onended = stopVoice;
  $('againBtn').textContent = '■';
  mouthTimer = setInterval(() => { mouthOpen = !mouthOpen; drawFace(); }, 140);
  audio.play().catch(() => { audio = null; speakSynth(yomi); });
}

// ---------- 札を見せる ----------
let cur = null; // [字幕の番号, 読み手, 'きょう' か 'おまけ']
function show(li, v, kind) {
  const [si, , l1, l2] = LINES[li], s = SRC[si];
  cur = [li, v, kind]; curV = v;
  $('kind').textContent = kind === 'today' ? '✦ ' + $('date').textContent + ' の一言 ✦' : '✦ もう1枚 ✦';
  $('l1').textContent = l1; $('l2').textContent = l2;
  $('who').textContent = NAMES[v][0]; $('whoSub').textContent = NAMES[v][1];
  $('fromName').textContent = s[1]; $('fromIcon').src = '../' + s[0] + 'icon-180.png';
  $('from').href = '../' + s[0];
  drawFace();
}
function remember(li, v, kind) {
  const h = store.get('hitokotoHist', []).filter(x => !(x.d === TODAY && x.k === 'today' && kind === 'today'));
  const [si, ci] = LINES[li];
  h.unshift({ d: TODAY, k: kind, p: SRC[si][0], c: ci, v });
  store.set('hitokotoHist', h.slice(0, 30));
  renderHist();
}
function draw(kind) {
  const fuda = $('fuda');
  const [li, v] = kind === 'today' ? pickDaily() : pickRandom(cur && cur[0]);
  $('drawBtn').disabled = true; $('voiceBtn').disabled = true; $('oneMoreBtn').disabled = true;
  stopVoice();
  const reveal = () => {
    show(li, v, kind); play(li, v); // 押した流れの中で鳴らす（iPhone は押したときでないと音が出ない）
    fuda.classList.remove('shake'); fuda.classList.add('open');
    $('drawBtn').parentNode.hidden = true; $('moreRow').hidden = false; $('hint').textContent = '▶ でもう一度聞けます';
    $('voiceBtn').disabled = voicesOf(li).length < 2; $('oneMoreBtn').disabled = false;
    remember(li, v, kind);
  };
  if (fuda.classList.contains('open')) { // 表なら いったん裏にもどしてから
    fuda.classList.remove('open');
    // 声は押した瞬間に用意しないと iPhone で鳴らないので、裏返しは見た目だけ待たずに出す
    show(li, v, kind); play(li, v); setTimeout(() => { fuda.classList.add('open'); $('voiceBtn').disabled = voicesOf(li).length < 2; $('oneMoreBtn').disabled = false; }, 450);
    remember(li, v, kind);
    return;
  }
  fuda.classList.add('shake');
  reveal();
}
$('drawBtn').onclick = () => draw('today');
$('oneMoreBtn').onclick = () => draw('extra');
$('againBtn').onclick = () => { if (!cur) return; if (audio) stopVoice(); else play(cur[0], cur[1]); };
$('voiceBtn').onclick = () => { // 同じ一言を ほかの人の声で
  if (!cur) return;
  const vs = voicesOf(cur[0]).filter(v => v !== cur[1]); if (!vs.length) return;
  const v = vs[Math.floor(Math.random() * vs.length)];
  show(cur[0], v, cur[2]); play(cur[0], v);
};

// ---------- これまでの一言 ----------
function findLine(p, c) { const si = SRC.findIndex(s => s[0] === p); return si < 0 ? -1 : LINES.findIndex(l => l[0] === si && l[1] === c); }
function renderHist() {
  const h = store.get('hitokotoHist', []).map(x => ({ ...x, li: findLine(x.p, x.c) })).filter(x => x.li >= 0);
  $('clearBtn').hidden = !h.length;
  $('hist').innerHTML = h.length ? h.map((x, i) => {
    const [si, , l1, l2] = LINES[x.li];
    return `<button data-i="${i}" class="${x.d === TODAY && x.k === 'today' ? 'today' : ''}"><img src="../${esc(SRC[si][0])}icon-180.png" alt="">` +
      `<span>${esc(l1)} ${esc(l2)}<small>${esc(x.d)}${x.k === 'today' ? ' のきょうの一言' : ' もう1枚'}・${esc(NAMES[x.v] ? NAMES[x.v][0] : '')}・${esc(SRC[si][2])}</small></span></button>`;
  }).join('') : '<div class="empty">まだ ありません</div>';
  $('hist').querySelectorAll('button').forEach(b => b.onclick = () => {
    const x = h[+b.dataset.i], v = LINES[x.li][5] & (1 << x.v) ? x.v : voicesOf(x.li)[0];
    show(x.li, v, x.k); play(x.li, v);
    $('fuda').classList.add('open'); $('drawBtn').parentNode.hidden = true; $('moreRow').hidden = false; $('voiceBtn').disabled = voicesOf(x.li).length < 2;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}
$('clearBtn').onclick = () => { if (confirm('これまでの一言を消しますか？')) { store.set('hitokotoHist', []); renderHist(); } };
renderHist();

// きょうもう ひいていたら、ボタンの文字を変える
if (store.get('hitokotoHist', []).some(x => x.d === TODAY && x.k === 'today')) $('drawBtn').textContent = '🎴 きょうの一言を もう一度見る';

// ---------- タイトルの左のオレンジのキャラクター（歩く） ----------
(function titleMascot() {
  const c = $('ccTitle'), g = c.getContext('2d'), q = 4, oy = 5;
  function frame(t0) {
    const t = t0 / 1000 / 1.4;
    const R = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(Math.round(x * q), Math.round(y * q), Math.round(w * q), Math.round(h * q)); };
    g.clearRect(0, 0, c.width, c.height);
    const col = '#d97757', f = Math.floor(t * 6) % 4, hop = f % 2 ? -1 : 0;
    const up = [f === 1, f === 3, f === 3, f === 1];
    [2, 4, 7, 9].forEach((x, i) => R(x, oy + 6, 1, up[i] ? 1 : 2, col));
    const y0 = oy + hop;
    R(2, y0, 8, 6, col); R(0, y0 + 2, 2, 2, col); R(10, y0 + 2, 2, 2, col);
    const blink = (t % 3) > 2.85;
    R(3, y0 + 1 + (blink ? .6 : 0), 1, blink ? .4 : 1, '#1a1612'); R(8, y0 + 1 + (blink ? .6 : 0), 1, blink ? .4 : 1, '#1a1612');
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
