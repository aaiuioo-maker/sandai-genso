<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>いろいろなモブへ変身</title>
<meta name="theme-color" content="#05040d">
<link rel="icon" href="icon-180.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root { --bg:#05040d; --fg:#f3ead6; --accent:#d97757; --green:#6fd35a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font-family: "DotGothic16", sans-serif; padding: calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); }
  h1 { font-size: 18px; font-weight: 400; margin: 0 0 4px; letter-spacing: .08em; text-align: center; }
  .sub { font-size: 11px; opacity: .6; margin: 0 0 12px; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; max-width: 820px; margin: 0 auto; }
  .card { background: #12101f; border: 2px solid #2a2540; border-radius: 6px; padding: 6px; cursor: pointer; }
  .card:active { transform: translateY(1px); }
  canvas { width: 100%; display: block; image-rendering: pixelated; border-radius: 4px; background: #000; }
  .no { color: var(--accent); font-size: 12px; margin-top: 6px; }
  .mob { font-size: 15px; color: var(--green); }
  .name { font-size: 12px; }
  .how { font-size: 11px; opacity: .65; margin-top: 2px; line-height: 1.4; }
</style>
</head>
<body>
<h1>Claude Code の キャラクター → いろいろなモブ</h1>
<p class="sub">20 とおりの変身 ／ カードをタップすると最初から</p>
<div class="grid" id="grid"></div>

<script>
// =============================================================
// Claude Code のキャラクターが マイクラのいろいろなモブに変身する 20 とおりの動き
//   （creeper.html・zombie.html と同じ作り：48×48 の画面、1マス 2 ドット、足もとの中心が (24, 42)）
// =============================================================
const G = 48, GROUND = 42, CS = 2, S = 5, LOOP = 5.5; // 画面の大きさ・地面・1マス・1ドットの画素・ループの長さ

// ---------- 描画の道具 ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k); return k * k * (3 - 2 * k); };
const seg = (t, a, b) => clamp((t - a) / (b - a));
function mix(c1, c2, k) {
  const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
  const ch = s => Math.round(lerp((a >> s) & 255, (b >> s) & 255, clamp(k)));
  return '#' + [16, 8, 0].map(s => ch(s).toString(16).padStart(2, '0')).join('');
}
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

function canvasG(ctx) {
  const g = {
    R(x, y, w, h, c, a = 1) { ctx.globalAlpha = clamp(a); ctx.fillStyle = c; ctx.fillRect(Math.round(x * S), Math.round(y * S), Math.round(w * S), Math.round(h * S)); ctx.globalAlpha = 1; },
    T(s, x, y, size, c, a = 1) {
      if (a <= 0) return;
      ctx.globalAlpha = clamp(a); ctx.font = `${size * S}px "DotGothic16", monospace`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineWidth = S * 1.2; ctx.lineJoin = 'round';
      ctx.strokeStyle = '#000'; ctx.strokeText(s, x * S, y * S); ctx.fillStyle = c; ctx.fillText(s, x * S, y * S); ctx.globalAlpha = 1;
    },
    clip(x, y, w, h, fn) { ctx.save(); ctx.beginPath(); ctx.rect(x * S, y * S, w * S, h * S); ctx.clip(); fn(); ctx.restore(); },
    disc(cx, cy, r, c, a = 1) { for (let y = -r; y <= r; y++) { const w = Math.floor(Math.sqrt(r * r - y * y) + .3); g.R(cx - w, cy + y, w * 2 + 1, 1, c, a); } },
    // 足もとの中心 (cx, by) を基準に、横 sx・縦 sy 倍で描く。col で色を差し替え、show でマスを選び、off でマスをずらす
    sprite(sp, cx, by, o = {}) {
      const sx = o.sx ?? 1, sy = o.sy ?? 1, a = o.a ?? 1;
      for (const e of sp.cells) {
        if (o.show && !o.show(e)) continue;
        const c = o.col ? o.col(e) : e.c, [dx, dy] = o.off ? o.off(e) : [0, 0];
        g.R(cx + (e.x - sp.w / 2) * CS * sx + dx, by - (sp.h - e.y) * CS * sy + dy, CS * sx + .01, CS * sy + .01, c, a);
      }
    },
  };
  return g;
}

// 文字の並び（1文字＝1マス）と色の表から、キャラクターの形を作る
function build(rows, pal, seed = 7) {
  let s = seed; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const cells = [];
  rows.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === '.') return;
    const p = [].concat(pal[ch]);
    cells.push({ x, y, c: p[(r() * p.length) | 0], k: ch });
  }));
  return { w: Math.max(...rows.map(r => r.length)), h: rows.length, cells };
}

// ---------- Claude Code のキャラクター ----------
const EYE = '#1a1612';
const MASCOT = (() => {
  const c = '#d97757', cells = [];
  for (let y = 0; y < 6; y++) for (let x = 2; x < 10; x++) cells.push({ x, y, c });
  [[0, 2], [1, 2], [0, 3], [1, 3], [10, 2], [11, 2], [10, 3], [11, 3]].forEach(([x, y]) => cells.push({ x, y, c }));
  [2, 4, 7, 9].forEach(x => { cells.push({ x, y: 6, c }); cells.push({ x, y: 7, c }); });
  cells.forEach(e => { if ((e.x === 3 || e.x === 8) && e.y === 1) e.c = EYE; });
  return { w: 12, h: 8, cells };
})();
const bob = t => (Math.floor(t * 4) % 2 ? -1 : 0);
const walkFrame = t => (Math.floor(t * 6) % 2 ? -1 : 0);
function mascotIdle(g, t, o = {}) { g.sprite(MASCOT, 24, GROUND + bob(t), o); }
const tint = (c, k) => e => e.c === EYE ? e.c : mix(e.c, c, k); // 目はそのままで 色を変える

// ---------- 新しいモブの形 ----------
// 2本足のモブは 足を かわりばんこに
const legs = (from, mid, speed = 2) => t => { const f = Math.floor(t * speed) % 2; return e => e.y >= from ? [0, ((e.x < mid) === (f === 0)) ? -1 : 0] : [0, 0]; };
// 4本足のモブは 前足と後ろ足を かわりばんこに、しっぽを ふりふり
const paws = (from, front, tail = -1) => t => {
  const f = Math.floor(t * 3) % 2;
  return e => e.y >= from ? [0, ((e.x >= front) === (f === 0)) ? -1 : 0] : e.x <= tail ? [0, Math.floor(t * 5) % 2 ? -1 : 0] : [0, 0];
};
const M = {
  ender: { sp: build([
    '..KKKKKKKK..', '..KKKKKKKK..', '..KKKKKKKK..', '..KKKKKKKK..', '..PMPKKPMP..', '..KKKKKKKK..', '..KKKKKKKK..', '..KKKKKKKK..',
    '.K.KKKKKK.K.', '.K.KKKKKK.K.', '.K.KKKKKK.K.', '.K.KKKKKK.K.', '.K.KKKKKK.K.', '.K.KKKKKK.K.',
    '.K.KK..KK.K.', '.K.KK..KK.K.', '.K.KK..KK.K.', '.K.KK..KK.K.', '...KK..KK...', '...KK..KK...',
  ], { K: ['#161616', '#1e1e22', '#121214'], P: '#e079fa', M: '#cc00fa' }), off: legs(14, 6, 1.5) },
  skel: { sp: build([
    '..WWWWWWWW..', '..WWWWWWWW..', '..WWWWWWWW..', '..WKKWWKKW..', '..WWWKKWWW..', '..WWWWWWWW..', '..WKKKKKKW..', '..WWWWWWWW..',
    '.W.WWWWWW.W.', '.W.WKWWKW.W.', '.W.WWWWWW.W.', '.W.KWKWKK.W.', '.W..WWWW..W.', '.W..WWWW..W.',
    '....W..W....', '....W..W....', '....W..W....', '....W..W....', '...WW..WW...',
  ], { W: ['#c8c8c8', '#b5b5b5', '#d6d6d6'], K: '#3a3a3a' }), off: legs(14, 6) },
  blaze: { sp: build([
    'YYYYYYYY', 'YOYYYYOY', 'YYYYYYYY', 'YKKYYKKY', 'YYYYYYYY', 'YOKKKKOY', 'YYYYYYYY', 'OYYOOYYO',
  ], { Y: ['#f0c030', '#e8b020', '#f8d040'], O: '#e07010', K: '#3a1a00' }), fly: 18,
    // まわりを くるくる回る 棒と けむり
    extra(g, t, cx, by, o) {
      for (let i = 0; i < 8; i++) {
        const ring = i < 4 ? 0 : 1, an = t * (ring ? -2.5 : 2) + (i % 4) / 4 * Math.PI * 2;
        const x = cx + Math.cos(an) * (ring ? 6 : 10), y = by - 4 + ring * 8 + Math.sin(an) * 1.5;
        if (Math.sin(an) < -.2) continue; // うしろ側は かくれる
        g.R(x - 1, y, 2, 6, i % 2 ? '#e8a020' : '#ffcf3a', o.a ?? 1);
      }
      for (let i = 0; i < 4; i++) { const ph = (t * .8 + i / 4) % 1; g.R(cx - 6 + hash(i) * 12, by + 4 + ph * 10, 2, 2, '#5a5050', (1 - ph) * .7 * (o.a ?? 1)); }
    } },
  sheep: { sp: build([
    '..........WWWW', '.WWWWWWWWWSSSS', 'WWWWWWWWWWSKSS', 'WWWWWWWWWWSSSS', 'WWWWWWWWWWSSPS', 'WWWWWWWWWW....', '.WWWWWWWWW....',
    '.SS....SS.....', '.SS....SS.....', '.SS....SS.....',
  ], { W: ['#ececec', '#dedede', '#f6f6f6'], S: '#e6c9a8', K: '#222222', P: '#e8a0a0' }), off: paws(7, 5) },
  snow: { sp: build([
    '..OOOOOOOO..', '..OOOOOOOO..', '..OKKOOKKO..', '..OKKOOKKO..', '..OOOOOOOO..', '..OKKKKKKO..', '..OOKOOKOO..', '..OOOOOOOO..',
    'B..WWWWWW..B', '.B.WWWWWW.B.', '..BWWWWWWB..', '...WWWWWW...', '...WWWWWW...',
    '..WWWWWWWW..', '..WWWWWWWW..', '..WWWWWWWW..', '..WWWWWWWW..', '..WWWWWWWW..',
  ], { O: ['#e38a1d', '#d07a12', '#f09a2a'], K: '#5a2a00', B: '#6b4a2a', W: ['#f4f8fb', '#e6eef4', '#dde8f0'] }),
    off: t => e => e.c === '#6b4a2a' && Math.floor(t * 2) % 2 ? [0, -1] : [0, 0] },
  cow: { sp: build([
    '..........H..H', '.BBBWWBBBBBBBB', 'BBBWWWBBBWBKBB', 'BWWWBBBBWWBBBB', 'BBWBBBBWWWBPPP', 'BBBBBWWBBBBPPP', '.BBBBBBBBB....',
    '.BB....BB.....', '.BB....BB.....', '.KK....KK.....',
  ], { B: ['#4a3020', '#563a26'], W: ['#e8e8e8', '#d8d8d8'], K: '#222222', P: '#c9a08a', H: '#d8d0c0' }), off: paws(7, 5) },
  cat: { sp: build([
    '........K..K', '........KKKK', 'K.......KGKG', '.KKKKKKKKKKP', '..KKKKKKKK..', '..KKKKKKKK..', '..K.K..K.K..', '..K.K..K.K..',
  ], { K: ['#1c1c22', '#24242c', '#2c2c34'], G: '#7cff4a', P: '#d07090' }), off: paws(6, 6, 0) },
  ocelot: { sp: build([
    '........Y..Y', '........YYYY', 'Y.......YGYG', '.YYDYYDYYYYP', '..YYYDYYYY..', '..YDYYYDYY..', '..Y.Y..Y.Y..', '..Y.Y..Y.Y..',
  ], { Y: ['#e8b040', '#f0c050', '#dca838'], D: '#8a5a20', G: '#3ab03a', P: '#d07090' }), off: paws(6, 6, 0) },
  bat: { sp: build([
    '.....B..B.....', 'WW...BBBB...WW', 'WWW..BEEB..WWW', '.WWWWBBBBWWWW.', '..WWWBBBBWWW..', '.....B..B.....',
  ], { B: '#4a3a2c', W: ['#2a2422', '#342c28'], E: '#111111' }), fly: 16,
    off: t => e => e.k === 'W' ? [0, (Math.floor(t * 10) % 2 ? -2 : 1) * (Math.abs(e.x - 6.5) > 4 ? 1 : .5)] : [0, 0] },
  husk: { sp: build([
    '..HHHHHHHH..', '..HGGGGGGH..', '..GGGGGGGG..', '..GKKGGKKG..', '..GGGNNGGG..', '..GGGGGGGG..', '..GGMMMMGG..', '..GGGGGGGG..',
    '.CCCCCCCCCC.', '.CCCCCCCCCC.', '.GGCCCCCCGG.', '.GGCCCCCCGG.', '.GGCCCCCCGG.', '.GGPPPPPPGG.',
    '...PPPPPP...', '...PPdPPP...', '...PPdPPP...', '...PPdPPP...', '...SSSSSS...',
  ], { H: ['#7a6a48', '#857452'], G: ['#a89468', '#9a8660', '#b4a070'], K: '#2a2010', N: '#8a7650', M: '#5a4a30',
    C: ['#6a5a40', '#5e5038', '#76664a'], P: ['#4a3e2c', '#54462f'], d: '#3a2e1e', S: ['#6b6b6b', '#5a5a5a'] }),
    // ゾンビと同じく うでを前に出して ゆらゆら
    off: t => { const f = Math.floor(t * 3) % 2; return e => e.y >= 10 && (e.x <= 2 || e.x >= 9) ? [0, f ? -1 : 0] : e.y >= 14 ? [0, ((e.x <= 5) === !!f) ? -1 : 0] : [0, 0]; } },
  squid: { sp: build([
    '..NNNNNN..', '.NNNNNNNN.', '.NNNNNNNN.', '.NNNNNNNN.', '.NWKNNKWN.', '.NNNNNNNN.', '.NNNNNNNN.', '.NNMMMMNN.',
    '.N.N.N.N..', '.N.N.N.N..', '..N.N.N.N.', '..N.N.N.N.', '.N.N.N.N..', '.N...N....',
  ], { N: ['#2a4a6a', '#335577', '#244060'], M: '#1a2a3a', W: '#ffffff', K: '#000000' }), fly: 6,
    off: t => e => e.y >= 8 ? [Math.round(Math.sin(t * 4 + e.x + e.y * .6) * (e.y - 7) * .35), Math.round(Math.sin(t * 2) * -1)] : [0, Math.round(Math.sin(t * 2) * -1)] },
  rabbit: { sp: build([
    '.BB..BB.', '.BP..PB.', '.BP..PB.', '.BBBBBB.', 'BBBBBBBB', 'BKBBBBKB', 'BBBPPBBB', 'BBBWWBBB', '.BBBBBB.', 'BBBBBBBB', 'BB.BB.BB',
  ], { B: ['#a0784a', '#946c40', '#ac8454'], P: '#e0a0a0', K: '#222222', W: '#f0f0f0' }),
    off: t => { const p = t % 1.4, y = p < .35 ? -Math.round(Math.sin(p / .35 * Math.PI) * 4) : 0; return () => [0, y]; } },
  pig: { sp: build([
    '..PPPPPPPP..', '..PPPPPPPP..', '..PPPPPGGG..', '..PKPPPKGG..', '..PPNNNNGG..', '..PPNKKNPP..', '..PPPPPPPP..', '..PPPPPPPP..',
    '.PPPPPPPPPP.', '.PPPGGPPPPP.', '.PPPGGPPPPP.', '.PPPPPPPPPP.', '.PPPPPPPPPP.', '.PPLLLLLLPP.',
    '...LLLLLL...', '...PP..GP...', '...PP..PP...', '...PG..PP...', '...PP..PP...',
  ], { P: ['#e89a9a', '#d88a8a', '#f0aaaa'], G: ['#5f9a45', '#4f8a3a'], K: '#222222', N: '#c87878', L: '#6a4a2a' }), off: legs(15, 6),
    // 金の剣を 持っている
    extra(g, t, cx, by, o) { const a = o.a ?? 1; g.R(cx + 10, by - 26, 2, 14, '#f0d040', a); g.R(cx + 11, by - 26, 1, 14, '#fff2a0', a); g.R(cx + 8, by - 13, 6, 1, '#a07020', a); g.R(cx + 10, by - 12, 2, 2, '#6a4a2a', a); } },
  ghast: { sp: build([
    'WWWWWWWWWWWWWWWW', 'WWWWWWWWWWWWWWWW', 'WWWWWWWWWWWWWWWW', 'WWWWWWWWWWWWWWWW', 'WWWKKKWWWWKKKWWW', 'WWWWWWWWWWWWWWWW',
    'WWWWWWWWWWWWWWWW', 'WWWWWWKKKKWWWWWW', 'WWWWWWKKKKWWWWWW', 'WWWWWWWWWWWWWWWW', 'WWWWWWWWWWWWWWWW', 'WWWWWWWWWWWWWWWW',
    '..W..W..W..W..W.', '..W..W..W..W..W.', '..W.....W.....W.', '.....W.....W....',
  ], { W: ['#f0f0f0', '#e4e4e4', '#f8f8f8', '#dcdcdc'], K: '#3a3a3a' }), fly: 5,
    off: t => e => e.y >= 12 ? [Math.round(Math.sin(t * 3 + e.x) * (e.y - 11) * .5), 0] : [0, 0] },
  golem: { sp: build([
    '....IIIIII....', '....IIIIII....', '....IRIIRI....', '....IIIIII....', '....IINNII....', '....IINNII....',
    '.IIIIIIIIIIII.', 'IIIIIIVIIIIIII', 'IIIIIIVVIIIIII', 'II.IIIIIVII.II', 'II..IIIIII..II', 'II..IIIIII..II',
    'II..IIIIII..II', 'II...IIII...II', 'II..IIIIII..II', '...III..III...', '...III..III...', '...III..III...', '...III..III...', '...III..III...',
  ], { I: ['#d8d0c8', '#c8c0b8', '#bab2aa'], R: '#8a2a1a', N: '#b0a89e', V: '#4f8a3a' }), off: legs(15, 7, 1.5),
    // 赤い花を 持っている
    extra(g, t, cx, by, o) { const a = o.a ?? 1; g.R(cx - 14, by - 10, 1, 3, '#3a8a2a', a); g.R(cx - 15, by - 13, 3, 3, '#d02020', a); g.R(cx - 14, by - 12, 1, 1, '#ffcf3a', a); } },
  chicken: { sp: build([
    '......WWWW..', '......WWKWOO', '......WWWWOO', 'W.....WWWWR.', 'WWWWWWWWWWR.', 'WWWWWWWWWW..', '.WWWWWWWW...', '..WWWWWW....',
    '....O..O....', '...OO.OO....',
  ], { W: ['#f4f4f4', '#e8e8e8'], O: '#e8a020', R: '#d03030', K: '#222222' }),
    off: t => { const f = Math.floor(t * 3) % 3; return e => e.y >= 8 ? [0, 0] : e.x >= 6 && f === 1 ? [1, 1] : [0, 0]; } },
  wolf: { sp: build([
    '...........W..W.', '...........WWWW.', '...........WKWWG', 'W..........WWWWD', '.W.WWWWWWWRRRR..', '..WWWWWWWWWWWW..', '...WWWWWWWWWW...',
    '...W.W....W.W...', '...W.W....W.W...', '...W.W....W.W...',
  ], { W: ['#e0dcd8', '#d4d0cc', '#ece8e4'], K: '#222222', G: '#b8b0a8', D: '#222222', R: '#c8302a' }), off: paws(7, 8, 1) },
  slime: { sp: build([
    'LLLLLLLL', 'LGGGGGGL', 'LKKGGKKL', 'LKKGGKKL', 'LGGGGGGL', 'LGGGKGGL', 'LGGGGGGL', 'LLLLLLLL',
  ], { L: ['#7ad35e', '#86dc6a'], G: ['#5fbf4a', '#56b043'], K: '#2f6f24' }),
    // ぴょーんと はねて、着地で ぺちゃっ
    idle(g, t, cx, o = {}) {
      const ph = (t * .9) % 1, air = ph < .6 ? Math.sin(ph / .6 * Math.PI) : 0, land = ph >= .6 ? Math.sin((ph - .6) / .4 * Math.PI) : 0;
      g.sprite(this.sp, cx, GROUND - air * 8, { ...o, sx: (o.sx ?? 1) * 1.5 * (1 + land * .2), sy: (o.sy ?? 1) * 1.5 * (1 - land * .2) });
    } },
  magma: { sp: build([
    'MMMMMMMM', 'OMMMMOMM', 'MMMMMMMM', 'MYOMMOYM', 'MMMMMMMM', 'OMMOMMMO', 'MMMMMMMM', 'MOMMMOMM',
  ], { M: ['#3a1a10', '#4a2216', '#2e140c'], O: '#ff6a10', Y: '#ffcf3a' }),
    // はねると だんだんに のびて すき間から マグマが見える
    idle(g, t, cx, o = {}) {
      const ph = (t * .8) % 1, air = ph < .6 ? Math.sin(ph / .6 * Math.PI) : 0, sp = this.sp;
      g.sprite(sp, cx, GROUND - air * 8, { ...o, sx: 1.5, sy: 1.5, off: e => [0, -(sp.h - 1 - e.y) * air * 1.2] });
    } },
  vill: { sp: build([
    '..SSSSSSSS..', '..SSSSSSSS..', '..SSSSSSSS..', '..SBBBBBBS..', '..SWGSSGWS..', '..SSSNNSSS..', '..SSSNNSSS..', '..SSSNNSSS..',
    '.RRRRNNRRRR.', '.RRAAAAAARR.', '.RRAHHHHARR.', '.RRRRRRRRRR.', '.RRRRRRRRRR.', '..RRRRRRRR..', '..RRRRRRRR..',
    '..RRRRRRRR..', '..RRRRRRRR..', '..RRRRRRRR..', '..KKKKKKKK..',
  ], { S: ['#c0906a', '#b4845e'], B: '#4a3020', W: '#ffffff', G: '#3a9a3a', N: '#a8785a', R: ['#6a4a30', '#5e4028'], A: '#5a3c24', H: '#b4845e', K: '#3a2a1a' }),
    off: t => () => [0, bob(t * .5)] },
};
// モブを 待っている間の動きで描く（cx は足もとの中心）
function mobAt(g, m, t, cx = 24, o = {}) {
  if (m.idle) return m.idle(g, t, cx, o);
  const by = GROUND - (m.fly ? m.fly + Math.round(Math.sin(t * 3) * 1.5) : 0);
  g.sprite(m.sp, cx, by, { off: m.off && m.off(t), ...o });
  if (m.extra) m.extra(g, t, cx, by, o);
}

// ---------- 効果の道具 ----------
function sparkle(g, x, y, k, c = '#fff') { if (k <= 0 || k >= 1) return; const r = Math.round(1 + k * 3); g.R(x - r, y, r * 2 + 1, 1, c, 1 - k); g.R(x, y - r, 1, r * 2 + 1, c, 1 - k); }
function puff(g, cx, cy, k, n = 8) {
  if (k <= 0 || k >= 1) return;
  for (let i = 0; i < n; i++) {
    const an = i / n * Math.PI * 2 + hash(i) * .5, d = k * (6 + hash(i + 9) * 8);

      if (fl > 0 && fl < 1) g.R(0, 0, G, G, '#a0ffb8', (1 - fl) * .7);
      [[12, 14, 2.4], [36, 10, 2.6], [34, 28, 2.8], [12, 30, 3.0], [24, 4, 3.2]].forEach(([x, y, s]) => sparkle(g, x, y, seg(t, s, s + .5), '#6fe07a'));
      g.T('ハァン', 41, 4, 5, '#ffffff', seg(t, 2.5, 2.8) - seg(t, 3.8, 4.2));
    } },
];

// 背景：夜空と草ブロックの地面
function scene(g, t) {
  g.R(0, 0, G, G, '#0b0a1a');
  for (let i = 0; i < 14; i++) { const b = .4 + .6 * Math.abs(Math.sin(t * 1.5 + i)); g.R((hash(i) * G) | 0, (hash(i + 50) * 30) | 0, 1, 1, '#ffffff', b * .7); }
  g.R(0, GROUND, G, G - GROUND, '#7a5230');
  g.R(0, GROUND, G, 2, '#4f9a3a'); g.R(0, GROUND, G, 1, '#6cc04a');
  for (let x = 1; x < G; x += 5) g.R(x, GROUND + 3 + (x % 3), 1, 1, '#5e3e22');
}

// ---------- カードを並べて動かす ----------
const grid = document.getElementById('grid'), cards = [];
PATTERNS.forEach((p, i) => {
  const card = document.createElement('div'); card.className = 'card';
  const cv = document.createElement('canvas'); cv.width = cv.height = G * S;
  card.append(cv);
  card.insertAdjacentHTML('beforeend', `<div class="no">パターン ${i + 1}</div><div class="mob">${p.mob}</div><div class="name">${p.name}</div><div class="how">${p.how}</div>`);
  grid.append(card);
  const ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
  const c = { p, g: canvasG(ctx), t0: performance.now() / 1000 - i * .25 };
  card.addEventListener('click', () => { c.t0 = performance.now() / 1000; });
  cards.push(c);
});
function frame(now) {
  for (const c of cards) {
    const t = (now / 1000 - c.t0) % LOOP;
    scene(c.g, t);
    c.p.draw(c.g, t);
    const fade = seg(t, LOOP - .4, LOOP); // 最後は 少し暗くして ループ
    if (fade > 0) c.g.R(0, 0, G, G, '#000000', fade);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
